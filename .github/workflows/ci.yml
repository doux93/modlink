name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: cargo test --locked --manifest-path modulink-core/Cargo.toml
      - run: cargo test --locked --manifest-path tests/storage/Cargo.toml
      - run: cargo test --locked --manifest-path tests/ai_transport/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
        env:
          MODULINK_TEST_MANIFEST: "1"
      - name: Build Windows preview
        run: npm run tauri build -- --debug --no-bundle --ci
      - name: Package Windows preview with resources
        run: node scripts/package-windows-preview.mjs
      - name: Smoke test packaged Windows WebView
        run: node scripts/smoke-windows-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-smoke
          path: artifacts/desktop-smoke/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: modulink-windows-preview
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14

- cmd: AT+MPWMDATA
  syntax: AT+MPWMDATA=<channel>,<period>,<duty>,<period1>,<duty1>...,<periodN>,<dutyN>ML307A/ML307B系列仅支持单个波形重复。
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MPWMDATA 设置pwm数据
  doc: '该命令用于设置pwm数据。


    参数：

    `<channel>`pwm通道号，0~1，以模组实际支持的通道数量为准。


    `<period>`单个pwm波周期，单位us。（注：ML307A/ML307C/ML307R/ML307X/ML307Y/ML307B：为10~10000；ML307G为3~655；ML307H为10~2521。需注意较低周期时，某些暂空比有一定误差，请以测试为准。）


    `<duty>`单个pwm波占空比，单位百分比。


    > 注意：- 仅ML307A/ML307R-DC/ML307B/ML307C/ML307R-DL/ML307G/ML307H/ML307X/ML307Y：支持该命令。

    - ML307G/ML307H：pwm波周期只能是2.56us的整数倍，输入命令时向上取整。'
  examples: []
  source: 扩展AT用户手册 (developmentdomain/extendedatcommandusermanual/topics/4gseries_topics/r_4g_at_mpwmdata.dita)
  models:
  - ML302A
  - ML302A-DCLM
  - ML302A-DSLM

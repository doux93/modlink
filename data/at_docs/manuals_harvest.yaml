- cmd: AT+NUESTATS
  syntax: AT+NUESTATS=<type>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NUESTATS 查询UE统计信息
  doc: '该命令用于获取当前的模组操作统计信息。


    参数：

    `<type>`字符串，命令类型。


    - `RADIO`: 具体无线信息

    - `CELL`: 前 10个小区信息

    - `BLER`: 误块率信息

    - `THP`: 吞吐量

    - `APPSMEM`: 应用核动态内存使用情况

    - `ALL`: 所有信息


    `<signal_power_in_centibels>`整型，信号功率。实际值需要除以十。


    `<total_power_in_centibels>`整型，总功率。实际值需要除以十。


    `<current_Tx_power_level_in_centibels>`整型，当前强发功率等级。实际值需要除以十。


    `<total_Tx_time_since_last_reboot_in_millisecond>`整型，自上次重启以来总的 TX 时间。单位：毫秒。


    `<total_Rx_time_since_last_reboot_in_millisecond>`整型，自上次重启以来总的 RX 时间。单位：毫秒。


    `<last_cell_ID>`整型，上一个 SIB1 的小区 ID。


    `<last_ECL_value>`整型，上一个 ECL 的值。


    `<last_SNR_value>`整型，上一个 SNR 的值。


    `<last_EARFCN_value>`整型，上一个 EARFCN 的值。


    `<last_PCI_value>`整型，上一个 PCI 的值。


    `<RSRQ_in_centibels>`整型，参考信号接收质量。实际值需要除以十。


    `<operator_mode>`整型，SIB1 的部署模式。


    - `0`: 未知模式

    - `1`: 带内不同的 PCI 模式

    - `2`: 带内相同的 PCI 模式

    - `3`: 保护带模式

    - `4`: 独立模式


    `<current_band>`整型，服务小区的频段 。


    `<earfcn>`整型，绝对射频频道号。


    `<physical_cell_ID>`整型，物理小区 ID。


    `<primary_cell>`整型，小区类型。


    - `0`: 邻区

    - `1`: 当前服务小区


    `<RSRP>`整型，参考信号接收功率。


    `<RSRQ>`整型，参考信号接收质量。


    `<RSSI>`整型，接收信号强度指示。


    `<SNR>`整型，信噪比。


    `RLC UL BLER RLC`整型，层误块率（上行），整数百分比。


    `RLC DL BLER RLC`整型，层误块率（下行），整数百分比。


    `MAC UL BLER MAC`整型，层误块率（上行），整数百分比。


    `MAC DL BLER MAC`整型，层误块率（下行），整数百分比。


    `Total TX bytes`整型，传输的总字节数。


    `Total RX bytes`整型，接收的总字节数。


    `Total TX blocks`整型，发送的传输块。


    `Total RX blocks`整型，接收的传输块。


    `Total RTX blocks`整型，重新传输的传输块。


    `Total ACK/NACK RX`整型，收到 ACK/NACK 消息的总数。


    `RLC UL`整型，RLC 层吞吐量（上行）。单位：bps。


    `RLC DL`整型，RLC 层吞吐量（下行）。单位：bps。


    `MAC UL`整型，MAC 层吞吐量（上行）。单位：bps。


    `MAC DL`整型，MAC 层吞吐量（下行）。单位：bps。


    `<allocated>`整型，'
  examples:
  - 'AT+NUESTATS

    Signal power:-842

    Total power:-780

    TX power:100

    TX time:859

    RX time:26543

    Cell ID:137262770

    ECL:0

    SNR:226

    EARFCN:3734

    PCI:105

    RSRQ:-108

    OPERATOR MODE:4

    CURRENT BAND:8

    OK'

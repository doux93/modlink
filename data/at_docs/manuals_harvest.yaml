- cmd: AT+MBLEGATSADDC
  syntax: AT+MBLEGATSADDC=<gsrvId>,<gchrId>,<chrUuid>,<chrPermission>[,<length>[,<chrVal>]]
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEGATSADDC GATTS向服务添加特征
  doc: '该命令用于向一个服务中添加一个特征。


    参数：

    `<gsrvId>`整型，服务的唯一标识，0~65535。（注：ML302/ML305为0~65534。）


    `<gchrId>`整型，特征在服务中的唯一标识。添加特性时要保证每个service下的每个特征的id值唯一，0~65535。（注：ML302/ML305为0~65534。）


    `<chrUuid>`十六进制字符串，特征的UUID，该参数是一个16位或128位的数，对应的数串为4字节或32字节。


    `<chrPermission>`整型，特征权限（特征允许的操作）。使用bit位表示可对该特征进行哪些操作，该参数是一个10位的数。


    - `Bit0`: 广播（如果设置，则允许广播特征值，则服务器特征配置描述符应存在。）

    - `Bit1`: 读（如果设置，允许client读取特征值。）

    - `Bit2`: 写（如果设置，允许client在无响应的情况下写入特征值。）

    - `Bit3`: 写（如果设置，允许client在有响应的情况下写入特征值。）

    - `Bit4`: 通知（如果设置，则允许使用`AT+MBLEGATSNTFY`在不确认的情况下通知特征值。如果设置，则需设置UUID为2902的特征描述符应，并使能通知。）

    - `Bit5`: 指示（如果设置，允许使用`AT+MBLEGATSIND`在确认的情况下显示特征值。如果设置，则需设置UUID为2902的特征描述符应，并使能指示。）

    - `Bit6`: 经过身份验证的签名写入（如果设置，允许使用 Bluetooth Core Specification V5.0 | Vol 3, Part G ,The program defined
    in Section 4.9.2。）

    - `Bit7`: 扩展属性（如果设置，则需设置UUID为2900的特征描述符。）

    - `Bit8`: 安全连接（如果设置，则需在配对完成后对端设备才可访问该特征。）

    - `Bit9`: MITM 鉴权（如果设置，则需在配对完成后对端设备才可访问该特征。）


    `<length>`整型，数据长度，单位字节，0~512。数据模式输入时，长度需大于0，命令中直接输入数据时，不校验数据长度以实际输入数据为准。


    `<chrVal>`数据，特征属性的初始值，最大512字节数据，数据格式由`AT+MBLECFG="encoding"`命令确定，默认为空。'
  examples:
  - 'AT+MBLEGATSADDC=1,1,0102,255,0,0102030405 //十六进制字符串模式下输入

    OK'
  source: BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mblegatsaddc.dita)

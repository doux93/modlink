- cmd: AT+MBLESCANCFG
  syntax: AT+MBLESCANCFG=<scan_type>,<own_addr_type>,<filter_policy>,<scan_interval>,<scan_window>
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLESCANCFG 设置BLE扫描参数
  doc: '该命令用于设置 BLE 扫描功能相关参数（主机端）。


    参数：

    `<scan_type>`整型，扫描模式，初始默认值0。


    - `0`: 被动扫描（只接受对端广播数据，不向对端发起扫描请求。）

    - `1`: 主动扫描（可接受对端广播数据，并可发起扫描请求。）


    `<own_addr_type>`整型，本地地址类型，初始默认值0。


    - `0`: 未加密公用设备地址（public address）

    - `1`: 未加密随机设备地址（random device address）

    - `2`: 加密公用设备地址（RPA public address）（注：ML302/ML305不支持该参数。）

    - `3`: 加密随机设备地址（RPA random device address）（注：ML302/ML305不支持该参数。）


    `<filter_policy>`整型，扫描过滤方式，初始默认值0。


    - `0`: 扫描所有未加密设备地址

    - `1`: 扫描未加密白名单设备地址

    - `2`: 扫描所有加密设备地址（注：ML302/ML305不支持该参数。）

    - `3`: 扫描加密白名单设备地址（注：ML302/ML305不支持该参数。）


    `<scan_interval>`整型，扫描间隔，单位timeslot（1 timeslot=625μs）,范围4~16384，对应的时间范围2.5ms~10.24s，初始默认值0x10，10ms。


    `<scan_window>`整型，扫描窗口，单位timeslot（1 timeslot=625μs）,范围4~16384，对应的时间范围2.5ms~10.24s，扫描窗⼝的值不能大于扫描间隔，初始默认值0x10，10ms。'
  examples:
  - 'AT+MBLESCANCFG=0,0,0,100,50

    OK'
  source: BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mblescancfg.dita)
  models:
  - ML302
  - ML302-ENLM
  - ML302-FNLM
  - ML302-GNLM
  - ML302-INLM
  - ML302-JNLM
  - ML302-MNLM
  - ML302-QNLM
  - ML305
  - ML305-RNLM
  - MN318
  - MN318-BX
  sources:
  - BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mblescancfg.dita)

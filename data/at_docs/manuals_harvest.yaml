- cmd: AT+CGSN
  syntax: AT+CGSN=<snt>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CGSN 请求国际移动用户识别码
  doc: '该命令用于请求TA序列号。


    参数：

    `<snt>`整型， 被请求的序列号类型 。当前只支持0和1。


    - `0`: 返回`<sn>`

    - `1`: 返回`<imei>`

    - `2`: 返回`<imeisv>`

    - `3`: 返回`<svn>`


    `<sn>`UE 的 128 位 UUID。信息文本（包括行终止符在内）的字符总数不应超过 2048。


    `<imei>`十进制格式的字符串型。IMEI 号。


    `<imeisv>`十进制格式的字符串型。IMEISV 号。


    `<svn>`十进制格式的字符串型。当前 SVN（SVN 是 IMEISV 的一部分） 。'
  examples:
  - 'AT+CGSN=1

    +CGSN:869975033574370

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cgsn.dita)
  models:
  - MN328
  - MN328-BX
  sources:

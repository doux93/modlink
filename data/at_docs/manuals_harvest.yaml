- cmd: AT+MADC
  syntax: AT+MADC[=<chanel>]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MADC 读取ADC电压
  doc: '该命令用于读取对应ADC电压值。


    参数：

    `<channel>`整型，ADC通道，默认值0。（注：MN316/MN316-S/MN328/MN327/MN316A/MN326A/MN319/MN319-A/MN326：仅支持ADC0。


    MN318：仅支持ADC0、ADC1。）（注：ML307A/ML307M：仅支持ADC0。


    ML305A/ML305U/ML305M/ML307N/ML307R/ML307C/ML307X/ML307Y/ML307B：支持ADC0、ADC1。


    ML302A/ML305A/ML307A/ML307R/ML307C/ML307G/ML307H/ML307B：不支持缺省`<channel>`参数。）（注：MF308C：仅支持ADC0。


    MR880A/MR380M/MR380R：仅支持ADC0、ADC1。


    MF572E：不支持缺省`<channel>`参数，不支持ADC0。）



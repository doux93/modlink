- cmd: AT+MIPLOBSERVERSP
  syntax: AT+MIPLOBSERVERSP=<ref>,<msgid>,<result>
  category: lwm2musermanual
  kind: command
  risk: none
  title: AT+MIPLOBSERVERSP 观测请求操作响应
  doc: '该命令用于接收到`+MIPLRVERSP`消息后，回复模组OBSERVE操作的结果。


    参数：

    `<ref>`整型，LwM2M设备实例ID。


    `<msgid>`uint16类型，该resource所属的instance observe操作时下发的`<mid>`。


    `<result>`整型，操作结果。（注：操作结果正确`<result>`返回1；其他返回值都表示操作错误，一般返回11。）



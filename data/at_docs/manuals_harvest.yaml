- cmd: AT+MLPMCFG
  syntax: AT+MLPMCFG="psind"[,<psind_enable>]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MLPMCFG 低功耗管理配置
  doc: '该命令用于低功耗相关功能项的配置。


    参数：

    `<cmd>`字符串，命令标识符。（注：MN316/MN316-S/MN316A/MN326A/MN326：仅支持sleepind、sleepmode、delaysleep。


    M5310-E/MN328/MN318：仅支持psind、sleepmode、delaysleep。）（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML307C/ML305A/ML307G/ML307H：仅支持sleepind、sleepmode、delaysleep。


    ML307B：仅支持psind、sleepmode、delaysleep。


    ML305U/ML305M/ML307M/ML307N：仅支持sleepmode。


    ML307X/ML307Y：仅支持sleepind、sleepmode、delaysleep、dtr。）（注：MR380R：仅支持sleepmode。


    MR380M：仅支持sleepmode、delaysleep。）


    - `psind`: 协议栈低功耗状态上报

    - `sleepind`: 睡眠状态上报

    - `sleepmode`: 睡眠模式

    - `delaysleep`: 达到休眠条件后延时进入休眠时间

    - `dtr`: DTR引脚控制睡眠


    `<psind_enable>`整型，协议栈低功耗状态是否开启URC上报，默认值0。


    - `0`: 关闭上报

    - `1`: 打开上报


    `<sleep_level>`整型，睡眠等级，进入、退出对应睡眠等级。（注：MN316/MN316-S/MN316A/MN326A/MN327/MN319/MN319-A/MN326：仅支持2。）（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML307C/ML305A/ML307G/ML307H/ML307B：仅支持2。


    ML307X/ML307Y：仅支持1。）


    - `1`: 浅睡眠

    - `2`: 深度睡眠


    `<protocol_status>`整型，协议栈低功耗状态。


    - `0`: 连接态

    - `1`: Idle态

    - `2`: PSM


    `<sleepind_report>`整型，睡眠等级，进入、退出对应睡眠等级是否开启URC上报，默认值0。（注：MN316/MN316-S/MN316A/MN326A/MN327//MN319/MN319-A/MN326：仅支持0、2。）（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML307C/ML305A/ML307G/ML307H：仅支持0、2；ML307X/ML307Y：仅支持0、1，默认值0，且掉电后将恢复为默认值。）


    - `0`: 关闭上报

    - `1`: 仅上报浅睡眠进入及退出

    - `2`: 仅上报深度睡眠进入及退出

    - `3`: 上报浅、深度睡眠进入及退出


    `<sleep_mode>`整型，配置模组睡眠模式，默认值2。（注：M5310-E/MN327/MN328/MN318：仅支持0、2。


    MN319/MN319-A：仅支持1、2。）（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML307C/ML305A/ML305U/ML305M/ML307G/ML307H/ML307M/ML307N/ML307B：仅支持0、2，且ML307A/ML307R/ML307C/ML305A/ML307S/ML307G/ML307H/ML307B：默认值0'
  examples:
  - 'AT+MLPMCFG="psind",1

    OK

    +MLPMPSTA: 1

    +MLPMPSTA: 2'

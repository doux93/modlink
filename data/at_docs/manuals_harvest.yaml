- cmd: AT+BLESETADVDATA
  syntax: AT+BLESETADVDATA=<advdata>,<scan_rspdata>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLESETADVDATA 设置广播和扫描响应数据
  doc: '该命令用于设置广播和扫描响应数据。


    参数：

    `<advdata>`字符串类型。广播数据。由以下三个字段组成（即多个 AD Structure 组成），组成方式符合上图的报文格式，内容必须是十六进制的数串。 Length：AD Structure
    的长度，包括 AD Type 和 AD Data 的长度，不包含 Length 本身的 1 字节。最大 0x1e，即数据域最大长度为 30 字节。 AD Type：1 字节，该广播数据所属的类型，如功耗级别
    TX Power Level(0x0A)、 设备名称 Local Name(0x09)、角色 Le Role(0x1C)、服务标识 Service UUIDs(0x16) 等。对端扫描到广播后，可以根据
    AD Type 判断出广播数据的意义。关于 AD Type 的类型和含义取值，请参考 Bluetooth Core Specification 5.0。 AD Data：广播数据内容，以大端模式组织。


    `<scan_rspdata>`字符串类型。扫描响应数据。报文格式与广播数据相同 。'
  examples:
  - 'AT+BLESETADVDATA="0709424332383056","020a01"

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blesetadvdata.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blesetadvdata.dita)
  variants: []

  risk: none
  title: AT+MIPSACK 已发送数据ACK查询
  doc: '该命令用于查询已发送数据的ACK信息。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-E/MN316/MN316-S/MN326范围：0~4。


    MN316A/MN326A/MN319/MN319-A范围：0~3。）


    `<sent>`整型，已发送的数据量，单位：字节。


    `<acked>`整型，对端已确认接收到的数据量，单位：字节。


    `<nack>`整型，对端还未确认接收的数据量，单位：字节。（注：MR380M：不支持`<nack>`参数。）


    `<received>`整型，本地已接收到的数据量，单位：字节。'
  examples:
  - 'AT+MIPSACK=?

    +MIPSACK: (0-5)

    OK'

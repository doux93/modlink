- cmd: AT+CPIN
  syntax: AT+CPIN=<pin>[,<newpin>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CPIN 输入PIN码
  doc: '该命令用于输入PIN码。


    参数：

    `<pin>`字符串，PIN码。


    `<newpin>`字符串， 请求的代码是 PUK 时所需的新密码 。


    `<code>`字符串。


    - `READY`: 表示 UE 无密码输入请求。

    - `SIM PIN`: 表示 USIM PIN 密码请求。

    - `SIM PUK`: 表示 SIM PUK 密码请求。

    - `SIM PUK BLOCKED`: 如果在输入错误的 PUK 10 次后 sim 卡被锁定，则在开机时主动上报。'
  examples:
  - 'AT+CPIN?

    +CPIN:READY

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cpin.dita)
  models:
  - MN328
  - MN328-BX

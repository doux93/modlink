- cmd: AT+MIPLCFG
  syntax: AT+MIPLCFG="platform",<ref>,<platform>[,<pattern>]
  category: lwm2musermanual
  kind: command
  risk: none
  title: AT+MIPLCFG 配置可选参数
  doc: '该命令用于配置可选参数，以支持各个LwM2M协议平台登录请求。


    参数：

    `<ref>`整型，LwM2M设备实例ID。


    `<platform>`整型，使用的目标IoT平台。


    - `0`: 中国移动OneNET平台

    - `1`: 中国电信CTWing平台

    - `2`: 中国联通雁飞格物DMP平台（注：ML305A/ML307A/ML307R/ML307B/ML307C/ML307M/ML307N：暂不支持。）

    - `3`: 华为云物联网平台（注：ML307M/ML307N：暂不支持。）

    - `10`: 其他平台


    `<pattern>`整型，登录平台所使用的的endpoint name模式，为0~4时各个参数由模组自动获取。


    - `0`: 不指定，各个平台采用默认值。

    - `1`: IMEI，CTWing平台、华为云物联网平台默认方式。

    - `2`: IMEI;IMSI，OneNET平台默认方式。

    - `3`: urn:imei:############; CTWing平台可选方式。

    - `4`: urn:imei-imsi:###############-###############; CTWing平台可选方式。


    `<epname>`字符串，登录平台的epname由客户指定，platform=10时有效。


    `<binding_mode>`整型，客户端绑定模式，登录/更新过程上传的设备绑定参数。


    - `0`: 客户端不设置，采用服务器默认模式。

    - `1`: UDP模式

    - `2`: UDP & Queue模式'
  examples:
  - 'AT+MIPLCFG="platform",0,1

    OK'

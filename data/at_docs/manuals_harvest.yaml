- cmd: AT+MQTTSUB
  syntax: AT+MQTTSUB=<connect_id>,<topic>,<qos>[,<topic1>,<qos1>..]
  category: mqttusermanual
  kind: command
  risk: none
  title: AT+MQTTSUB 订阅主题
  doc: '该命令支持用于订阅主题。


    参数：

    `<connect_id>`整型，MQTT客户端标识符。范围：0~5。（注：MN316A/MN326A/MN319/MN319-A范围：0~2。）


    `<topic>`字符串，订阅的主题。（注：ML302A/ML305A/ML307A/ML302S/ML307S/ML307R/ML307B/ML307C/ML305M/ML307G/ML307H/MR880A/ML307X/ML307Y/ML307M/ML307N：长度最大为256。）


    `<qos>`整型，消息交付质量等级。


    - `0`: 最多发送一次

    - `1`: 最少发送一次

    - `2`: 只发送一次


    `<mid>`整型，数据包标识。范围：0~65535。


    `<code>`整型， 对应订阅时设置的QoS，订阅失败时值为128。'

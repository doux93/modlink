    `<flag>`整型。指定消息传输类型。此参数的值为十六进制格式。 释放指示不支持 UP 模式。若未指定 ，则参数值将设置为 0。


    - `0x100`: 异常消息：发送具有高优先级的消息

    - `0x200`: 释放指示：指示该条消息发送后释放

    - `0x400`: 释放指示：表示收到该消息的回复后释放


    `<length>`整型。表示要发送数据的十进制长度。默认最大长度为 1358 字节，实际取决于网 络下发的 MTU 值。


    `<data>`十六进制字符串。要传输的数据。


    `<sequence>`整型，数据的序列。范围：1~255。如果省略，则不会上报数据发送状态。如果不省略，当数据通过 RF 发送或丢弃时，将上报以下结果：`+NSOSTR:<socket>,<sequence>,<status>`


    `<status>`整型， 数据报状态。


    - `0`: 错误

    - `1`: 已发送'
  examples:

- cmd: AT+MTTSPLAY
  syntax: AT+MTTSPLAY=<text>[,<volume>[,<channel>]]
  category: audiousermanual
  kind: command
  risk: none
  title: AT+MTTSPLAY 播放TTS文本内容
  doc: '该命令用于播放TTS文本内容。


    参数：

    `<text>`字符串，需要播放的内容（编码格式需按照`AT+MTTSCFG`命令配置），根据实际情况限定。（注：百度在线 TTS，text参数需要按照url参数标准使用urlencode编码，仅支持播放不超过10秒时长的数据，例如语速为15时，一次可以播放约60个中文字符，语速为5时，一次可以播放约40个中文字符。


    讯飞离线TTS版本text参数需要按照UTF-8编码，仅支持播放不超过14秒时长的数据。


    ML307N-DC/ML307N-GC：最大支持548字节 。）


    `<status>`整型，播放状态。


    - `0`: 空闲/播放结束

    - `1`: 播放异常中断

    - `2`: 播放失败

    - `3`: 不可使用（正在播放或其他音频功能正在使用）


    `<volume>`整型，音频通道音量，范围：0~100。（注：ML305A/ML302A/ML307A：不支持通道音量的设置，配置该参数值不起作用，可省略该参数。


    ML307N-DC/ML307N-GC：仅在播放通道为CODEC时支持，其他播放通道下不生效。）


    `<channel>`整型，播放通道（此处配置时使用此处通道，此处不配置时使用`AT+MTTSCFG`命令配置通道）。（注：ML305A/ML302A/ML307A/ML307N-DC/ML307N-GC：仅支持扬声器通道，其他配置无效，可省略该参数。）


    - `0`: 听筒

    - `1`: 耳机

    - `2`: 扬声器

    - `3`: 远端（通话过程中在对端播放）'
  examples:
  - 'AT+MTTSPLAY=?

    OK'

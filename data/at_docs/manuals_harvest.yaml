- cmd: AT+MDIALUP
  syntax: AT+MDIALUP=<cid>,<connect>[,<conn_interface>]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MDIALUP （上位机）拨号连网
  doc: '该命令用于控制拨号连网功能。


    参数：

    `<cid>`整型，pdp上下文标识符，仅为1有效。（注：MR880A：`<conn_interface>`配置为0时，网卡模式支持的`<cid>`范围1~`<nicmaxcnt>`，其他模式`<cid>`仅支持1；`<conn_interface>`配置为1时，路由模式下`<cid>`仅支持1，其他模式下`<cid>`仅支持8。路由模式下，cid
    1拨号成功后，USB 和网口共用一路 PDP拨号，可同时使用cid 1。网卡模式下，仅支持一种物理接口拨号，两种物理接口同时拨号时仅USB可用。


    MR380M：路由模式仅支持2，网卡模式仅支持1。）


    （注：ML307B：手动拨号时不支持使用默认cid 0，`<cid>`范围1-4，且不支持多路同时拨号。）


    `<connect>`整型，操作类型。


    - `0`: 断开连接

    - `1`: 建立连接


    `<conn_interface>`整型，拨号物理接口。（注：MR880A Mini-PCIe/MR880A M.2不支持网口拨号，MR880A RGMII适配的PHY芯片请联系技术支持， 网口拨号需使用`AT+MUECONFIG`命令使能后使用。


    MR380M：仅支持0。）


    - `0`: USB

    - `1`: 网口(以太网卡)


    `<ipv4>`字符串，网卡ipv4地址。


    `<v4_gw>`字符串，网关地址，为0.0.0.0时表示不可见。


    `<v4_dns1>`字符串，DNS服务器首选地址。


    `<v4_dns2>`字符串，DNS服务器备选地址。


    `<ipv6>`字符串，网卡ipv6地址。


    `<v6_gw>`字符串，网关地址。


    `<v6_dns1>`字符串，DNS服务器首选地址。


    `<v6_dns2>`字符串，DNS服务器备选地址。'
  examples:
  - 'AT+MDIALUP=1,1

    OK

    +MDIALUP: 1,1,"10.43.159.12","10.43.159.12","183.230.126.225","183.230.126.224"

    +MDIALUP: 1,1,"2409:8961:2a03:8797::1","2409:8961:2a03:8797::1","2409:8060:20ea:0201::1","2409:8060:20ea:0101::1"'
  source: 扩展AT用户手册 (developmentdomain/extendedatcommandusermanual/topics/r_at_mdialup.dita)

- cmd: AT+BLEADV
  syntax: AT+BLEADV=<mode>[,<adv_interval_min>,<adv_interval_max>,<duration>,<advtype>,<own_addrtype>,<peer_addrtype>,<peer_addr>,<adv_channel_map>,<adv_filter_policy>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLEADV 开启/关闭广播
  doc: '该命令用于开启或者关闭广播。


    参数：

    `<mode>`整型。开启或关闭广播。


    - `0`: 关闭广播，无需携带广播参数

    - `1`: 开启广播，需要携带广播参数


    `<adv_interval_min>`整型。广播间隔的最小值。范围：32~65535；单位：timeslot。对应的时间范围： 20 毫秒~40.96 秒（1 timesolt = 625 μs）。


    `<adv_interval_max>`整型。广播间隔的最大值。范围：32~65535；单位：timeslot。对应的时间范围： 20 毫秒~40.96 秒（1 timesolt = 625 μs）。`<adv_interval_max>`的值不小于`<adv_interval_min>`的值。


    `<duration>`整型。本次广播的持续时间。范围：1~0xffffffff；单位：毫秒。设置的值大于 180 秒时会被限制成持续时间 180 秒；如果需要持续广播，该值设置成 0xffffffff。如果
    广播类型是高占空比定向广播，那么最多只能广播 1.28 秒。


    `<advtype>`整型。广播类型。


    - `0`: 可连接的非定向广播（CONNECTABLE UNDIRECTED）

    - `1`: 可 连 接 的 高 占 空 比 定 向 广 播 （ CONNECTABLE HIGH DUTY CYCLE DIRECTED）

    - `2`: 可扫描的非定向广播（SCANNABLE UNDIRECTED）

    - `3`: 不可连接的非定向广播（NON CONNECTABLE UNDIRECTED）

    - `4`: 可 连 接 的 低 占 空 比 定 向 广 播 （ CONNECTABLE LOW DUTY CYCLE DIRECTED）


    `<own_addrtype>`整型。本端设备地址类型。设备地址可解析功能关闭时，地址类型应为 0，设备地 址可解析功能开启时，地址类型应为 1。


    - `0`: 未加密的设备公共地址（public address）

    - `1`: 设备的公共地址加密后生成的可解析地址。


    `<peer_addrtype>`整型。对端设备地址类型。共有两种地址类型。


    - `0`: 未加密的设备公共地址（public address）

    - `1`: 未加密的设备随机地址（random address）


    `<peer_addr>`字符串类型。对端设备地址。48 位地址以十六进制数串表示，设置命令中每个字节 之间可以加 “ : ”（ 英 文 冒 号 ）， 也 可 以 不 加 ， 如 "A662616202C4"
    或 "A6:62:61:62:02:C4"；查询命令返回结果中不带“:”，如"A662616202C4"；广播 类型为非定向广播时，该值可为空。当开启广播时下发的参数中`<peer_addr>`为空
    时，查询广播参数命令的返回结果中`<peer_addr>`的内容为"000000000000"。


    `<adv_channel_map>`整型。发送该广播报文的信道。共有三个广播信道：37、38、39，可使用 3 bit 进 行表示，使用 1~7 的数字表示三个信道之间的组合。


    - `1`: 广播信道 37

    - `2`: 广播信道 38

    - `3`: 广播信道 37、38

    - `4`: 广播信道 39

    - `5`: 广播信道 37、39

    - `6`: 广播信道 38、39

    - `7`: 广播信道 37、38、39


    `<adv_filter_policy>`整型。广'
  examples:
  - 'AT+BLEADV=1,480,480,0xffffffff,0,0,0,"",7,0

    OK

    +BLECMPEVT:0x200a'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_bleadv.dita)

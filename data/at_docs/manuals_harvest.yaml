- cmd: AT+MSSLKEYWR
  syntax: AT+MSSLKEYWR=<key_name>,<remain_length>,<length>[,<data>]
  category: sslusermanual
  kind: command
  risk: none
  title: AT+MSSLKEYWR 写入SSL私钥
  doc: '本命令用于写入SSL私钥。


    参数：

    `<key_name>`字符串型，私钥名称，不超过64字节。（注：ML307B：最多56字节。）


    `<remain_length>`整型，剩余待写入的数据长度。（注：ML307A/ML307C/ML307R：仅支持0和1。1代表非最后一包，0代表最后一包。）


    - `0`: 剩余待写入长度为0，表示本包为最后一包。

    - `其他`: 剩余待写入长度，还需再次写入。


    `<length>`整型，当前输入私钥数据长度，单个私钥最多写入8K（8192字节）数据。数据模式下不可设置为0，命令中直接输入数据时，设置为0，不对数据长度进行校验，设置大于0，将对输入数据的长度进行校验（ascii字符串和带转义的字符串输入模式下：校验实际命令中输入字符串长度是否与指定长度相等；Hex字符串输入模式下：校验实际命令中输入字符串长度是否是指定长度的两倍）。


    `<data>`字符串型，写入的私钥内容，私钥内容必须为PEM格式。'

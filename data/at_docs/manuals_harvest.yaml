    - `0`: 非缓存模式

    - `1`: 缓存模式


    `<cache_lenght>`缓存空间，默认4K。


    `<conn_timeout>`连接超时时间，0~180s，默认60s。


    `<rsp_timeout>`服务器响应超时时间，0-60s，默认0s（不超时）。


    `<input_timeout>`数据输入超时时间，0-180s，默认10s。（AT命令输入数据，并采用>模式输入时。）


    `<input_format>`数据输入编码模式，默认0。模组将按设置的编码格式把输入数据转换为原始数据。


    - `0`: ASCII字符串（原始数据）

    - `1`: HEX字符串

    - `2`: 带转义的字符串


    `<output_format>`数据输出编码模式，默认0。模组将按设置的编码格式把原始数据转换为指定编码格式数据然后输出。


    - `0`: ASCII字符串（原始数据）

    - `1`: HEX字符串


    `<ssl_enable>`SSL使能，默认0。


    - `0`: 不使用SSL（普通连接，HTTP）。

    - `1`: 使用SSL（安全连接，HTTPS）。


    `<ssl_id>`SSL上下文索引号，指定当前实例使用的SSL上下文。


    `<cid>`PDP上下文id，指定当前实例使用的PDP上下文。


    `<frag_size>`接收到数据后，数据上报的最大分包大小，0-1024，默认0（实际接收包大小输出）。


    `<interval>`接收到数据后，数据分包输出的时间间隔，0-2000ms，默认0（无间隔）。


    `<urlencode_mode>`URL编码使能，默认0。


    - `0`: 不编码

    - `1`: 编码（不对字母数字以及进行-_.!~*''();/?:@&=+$,#编码）'
  examples:
  - 'AT+MHTTPCFG=?+MHTTPCFG: ("header","chunked","cached","timeout","encoding","ssl","cid","fragment","urlencode"),(0-3),

    OK'

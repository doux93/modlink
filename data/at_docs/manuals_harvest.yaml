- cmd: AT+MIPCFG
  syntax: AT+MIPCFG="cid"[,<connect_id>[,<cid>]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPCFG TCP/IP参数设置
  doc: '该命令用于设置客户端实例相关的通用配置参数。


    参数：

    `<cmd>`字符串型，命令标识符。（注：M5310-E：`<cmd>`暂不支持"cid"、"timeout"、"sndbuf"、"rcvbuf"、"ssl"选项设置。


    MN316/MN316-S/MN326：`<cmd>`暂不支持"cid"、"timeout"、"sndbuf"、"ackmode"、"ssl"选项设置。


    MN327：`<cmd>`不支持 "timeout"、"sndbuf" 、"ssl"选项设置。


    MN318/MN328：`<cmd>`暂不支持 "timeout"、"sndbuf"、"rcvbuf"、"ssl" 选项设置。


    MN316A/MN326A/MN319/MN319-A：`<cmd>`不支持"cid"、"timeout"、"sndbuf"、"ssl"选项设置。


    MR880A：`<cmd>`不支持"cid"选项设置。


    ML307H-GU：`<cmd>`不支持"ssl"选项设置。


    ML307N：`<cmd>`不支持"sndbuf"选项设置。）


    - `cid`: 设置连接实例所属的PDP上下文

    - `encoding`: 连接实例的输入和输出格式

    - `timeout`: 发送超时时间，用于AT命令输入数据，并采用">"模式输入时。

    - `autofree`: 断开连接后资源释放模式

    - `sndbuf`: 发送缓存大小

    - `rcvbuf`: 接收缓存大小

    - `ackmode`: TCP响应模式，UDP无效。

    - `ssl`: SSL模式设置项，包括使能开关和SSL上下文ID。


    `<connect_id>`整型，客户端连接实例id。范围：0~5。（注：M5310-EMN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。


    MR880A：范围0~9。）


    `<cid>`整型，PDP上下文id，指定当前实例使用的PDP上下文，范围与`AT+CGDCONT`命令支持的范围相同，默认不指定，指定时需保证指定cid已激活。（注：MN327：范围1~7，默认不指定，指定时需保证指定cid已激活。


    ML307H：范围1~5，默认使用第1路，指定时需要保证指定cid已激活。）


    `<send_format>`整型，数据发送格式。默认值0。（注：该参数影响`AT+MIPSEND`命令的数据输入。


    MR880A不支持转义字符输入。）


    - `0`: ASCII字符串（原始数据）

    - `1`: HEX字符串

    - `2`: 带转义的字符串


    `<recv_format>`整型，数据接收格式。默认值0。（注：该参数影响普通模式下`+MIPURC: "rtcp"/+MIPURC: "rudp"`数据输出打印，缓存模式下`AT+MIPRD`数据输出打印。）


    - `0`: ASCII字符串（原始数据）

    - `1`: HEX字符串


    `<send_timeout>`整型，发送超时时间。范围：1~180；单位：s。默认值10。（注：ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML305M/ML307M/ML307N/ML307R/ML307B/ML307H/ML307C：范围1~120。）


    `<free_mode>`整型，连接异常断开后资源释放模式。默认值0。


    - `0`: 连接异常断开后自动释放资源，无需使用`AT+MIPCLOSE`命令。

    - `1`: 连接异常断'
  examples:
  - 'AT+MIPCFG="autofree",0,1

    OK'
  source: TCP/IP用户手册 (developmentdomain/tcp_ipusermanual/topics/r_at_mipcfg.dita)

- cmd: AT+MGNSSLOC
  syntax: AT+MGNSSLOC=<auto_report>
  category: gnssusermanual
  kind: command
  risk: none
  title: AT+MGNSSLOC 获取位置定位信息
  doc: '该命令用于获取GNSS定位信息。


    参数：

    `<auto_report>`整型。


    - `0`: 不自动上报位置信息。

    - `1`: 自动上报位置信息，见`AT+MGNSSLOC`响应说明。（单次定位模式下，仅支持自动上报。）


    `<UTC>`(hhmmss.sss) UTC时间，时分秒.毫秒，位宽10。（参考GGA信息）


    `<latitude>`(ddmm.mmmmN/S)纬度，dd:度，mm.mmmm:分，N/S:北纬/南纬，保留4位小数。（参考GGA信息）


    `<longtitude>`(dddmm.mmmmE/W)经度，ddd:度，mm.mmmm:分，E/W:东经/西经，保留4位小数。（参考GGA信息）


    `<hdop>`(x.x)水平精度因子，保留1位小数。（参考GGA信息）


    `<altitude>`(x.x)海拔高度，单位:米，保留1位小数。（参考GGA信息）


    `<fix>`(n)定位类型。1:未定位，2:2D定位，3:3D定位；位宽1。（参考GSA信息）


    `<cog>`(ddd.dd)运动角度，真北参照系，单位:度，保留2位小数。（参考VTG信息）


    `<spkm>`(x.x)水平运动速度，单位Km/h，保留1位小数。（参考VTG信息）


    `<spkn>`(x.x)水平运动速度，单位Knots，保留1位小数。（参考VTG信息）


    `<date>`(ddmmyy)当前日期，日月年，位宽6。（参考RMC信息）


    `<nsat>`(nn)参与定位的卫星数量，位宽2。（参考GGA信息）


    `<dtype>`(n)差分定位标识，位宽1。0:无效，1:单点定位，2:差分定位。（参考GGA信息）'
  examples:
  - 'AT+MGNSSLOC

    +MGNSSLOC: 005031.833,2937.1685N,10629.6172E,2.1,453.3,3,0.00,0.1,0.1,141222,06,1

    OK'

- cmd: AT+MIPRD
  syntax: AT+MIPRD=<connect_id>[,<read_len>]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPRD 读取缓存数据
  doc: '该命令用于读取TCP、UDP连接的缓存数据。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-E/MN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。MR880A：范围0~9。）


    `<read_len>`整型，读取缓存数据长度，范围：0~4096；单位：字节。为0或超过已有缓存长度时读取全部缓存数据。（注：MN316A/MN326A/MN319/MN319-A内存有限，不支持大包读取，支持范围：1~1460。）


    `<unread_len>`整型，流缓存模式（TCP连接）下，剩余缓存数据大小。


    `<data_len>`整型，读取的缓存数据长度。


    `<data>`字符串型，读取到的缓存数据。数据格式受`AT+MIPCFG="encoding"`命令中`<recv_format>`参数影响。


    `<pack_count>`整型，包个数。受协议栈限制，NB模组最大缓存包个数为12个，Cat1模组最大缓存包个数为256个，UDP协议缓存模式达到缓存上限后，继续接收数据将出现丢包并打印`+MIPURC:
    "drop",<connect_id>,<drop_length>`提示。（注：ML302A/ML305A/ML307A/ML307G/ML302S/ML307S/ML307R/ML307B/ML307C：缓存包数为256。


    MN316A/MN326A/MN319/MN319-A：内存有限，不支持多包读取，只可单包读取。


    ML305M/ML307M/ML307N：缓存包数为128。


    ML307H：缓存包数为45，每包最大1500个字节。


    MR880A：缓存包数为256。）


    `<unread_packcount>`整型，包缓存模式（UDP连接）下，剩余缓存包个数。'
  examples:
  - 'AT+MIPRD=?

    +MIPRD: (0-4),(0-4096)

    OK'

- cmd: AT+MSSLCFG
  syntax: AT+MSSLCFG="auth"[,<ssl_id>[,<cert_verify>]]
  category: sslusermanual
  kind: command
  risk: none
  title: AT+MSSLCFG 配置SSL Context参数
  doc: '本命令用于配置SSL Context参数操作。


    参数：

    `<cmd>`字符串，命令类型。（注：ML307B：不支持参数“psk”配置。）


    - `auth`: 配置认证方式

    - `cert`: 配置证书及密钥

    - `psk`: 配置PSK

    - `encoding`: 配置输入数据编码格式

    - `negotime`: 配置SSL协商超时时间

    - `version`: 配置SSL指定版本

    - `ciphersuite`: 配置SSL指定加密套件

    - `session`: 配置SSL会话恢复功能打开/关闭

    - `ignorestamp`: 配置SSL是否忽略证书时间戳

    - `ignoreverify`: 配置SSL是否忽略证书认证结果

    - `sni`: 配置SSL是否使能sni扩展（注：当前仅MR880A支持该配置。）


    `<ssl_id>`整型，SSL连接ID，范围：0~5。（注：NB系列：支持范围0~4。）


    `<cert_verify>`整型，证书认证方式，默认值0。


    - `0`: 无身份认证，默认值。

    - `1`: 单向认证

    - `2`: 双向认证


    `<pskid>`字符串型，预共享密钥id，不超过64字节。（注：4G系列：不支持该参数。


    MR880A：不支持该参数。）


    `<input_format>`整型，输入数据编码格式，默认值2。（注：MN316/MN326/ML302S/ML307S/ML302A/ML305A/ML307A/ML307X/ML307Y/ML305U/ML305M/ML307M/ML307N/ML307G/MR880A/ML307R/ML307B/ML307C/ML307H：只支持2转义字符串。）


    - `0`: ascii字符串

    - `1`: Hex格式字符串

    - `2`: 转义字符串，默认值。


    `<negotiate_timeout>`整型，SSL协商超时时间，范围：10~300，默认值300，单位：s。


    `<srv_cert>`字符串型，受信任CA 证书名称，不超过64字节。


    `<cli_cert>`字符串型，客户端证书名称，不超过64字节。


    `<prv_key>`字符串型，客户端密钥名称，不超过64字节。


    `<ssl_version>`整型，指定SSL版本，默认值255。（注：MR880A：不支持TLS1.2以下版本。


    ML307X/ML307Y：仅支持TLS 1.1和TLS 1.2。


    MR380R/MR380M：不支持TLS1.2以下的版本。


    ML307B：仅支持参数值3，即 TLS 1.2。）


    - `0`: SSL 3.0

    - `1`: TLS 1.0

    - `2`: TLS 1.1

    - `3`: TLS 1.2

    - `255`: 全部


    `<cipher_suite>`十六进制字符串，指定加密套件，默认值0。（注：ML307X/ML307Y：十六进制输入加密套件值需携带“0x”。


    ML307A/ML307R/ML307C：设置与查询值均为十进制。


    ML307N：字段类型是整型。）


    - `0`: 支持所有加密套件

    - `其他`: 参考附录


    `<session_enable>`整型，是否开启会话恢复功能，默认值1。


    - `0`: 关闭

    - `1`: 开启


    `<ignore_stamp>`整型，是否忽略证书时间戳，默认值1。


    - `0`: 不忽略

    - `1`: 忽略


    `<ignore_verify>`整型，是否忽略证书认证结果，默认值0。


    - `0`: 不忽略

    - `1'
  examples:
  - 'AT+MSSLCFG="psk",1,"1"

    OK'

- cmd: AT+MUECONFIG
  syntax: AT+MUECONFIG="defapn"[,<PDP_type>[,<defapn>]]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MUECONFIG 配置UE基础行为
  doc: '该命令用于配置UE基础行为。其参数包含一个功能和一个控制该功能操作的值。


    参数：

    `<cmd>`字符串，命令标识符。（注：MN316/MN316-S/MN316A/MN326A/MN326：仅支持 autoconn、relver、asrai；


    M5310-E/MN328/MN318：支持 defapn、autoconn、relver、asrai、2harq、reestablish；


    MN327：仅支持defapn、relver；


    MN319/MN319-A：仅支持defapn、autoconn、relver、asrai、2harq、emulticar。）（注：ML302A/ML307A/ML307R/ML307C/ML305A/ML305U/ML305M
    /ML307M/ML307N：仅支持autoconn。


    ML307X/ML307Y：仅支持defapn、autoconn、relver、emulticar。


    ML307B：仅支持defapn、autoconn、simswap、usbport。）（注：MF308C：仅支持autoconn。


    MR880A：仅支持autoconn、hpt、simenable、simswap、ims、mac。


    MR380R：仅支持autoconn、defapn、simswap。


    MR380M：仅支持autoconn、defapn、simswap、ims。）


    - `defapn`: 配置模组默认APN，并保存Flash。

    - `autoconn`: 配置模组在上电或重启后是否自动尝试连接到网络。启用时，它将设置`AT+CFUN=1`并从USIM读取PLMN，并且它将使用由网络提供的APN。

    - `relver`: 配置发布版本，仅支持版本R13和R14，并保存Flash。

    - `asrai`: 配置模组是否支持AS RAI，并保存Flash，R14特性，需在`<release_version>`配置为14前提下生效。

    - `2harq`: 配置模组是否支持2HARQ和2536TBS，并保存Flash，R14特性，需在`<release_version>`配置为14前提下生效。

    - `emulticar`: 配置模组是否支持Multi Carrier R14增强功能，包含RA和paging，并保存Flash，R14特性，需在`<release_version>`配置为14前提下生效。

    - `reestablish`: 配置模组是否支持重建连接，并保存Flash，R14特性，需在`<release_version>`配置为14前提下生效。

    - `hpt`: 配置高精度授时功能。

    - `simenable`: 配置SIM卡激活与去激活功能。

    - `simswap`: 配置SIM卡卡位及热插拔功能。

    - `ims`: 启用/禁用IMS域能力，设置后需执行重新驻网操作(重启、`AT+CFUN=0`等)生效。

    - `mac`: 启用/禁用网络MAC控制器功能。

    - `usbport`: 配置USB端口模式


    `<PDP_type>`字符串，PDP类型，保存至Flash。（注：MN316/MN316-S/MN316A/MN326A/MN326：不支持。


    M5310-E/MN328/MN318：在去附着状态下才可以设置，不支持PPP。


    MN319/MN319-A：不支持PPP。）（注：ML302A/ML307A/ML307R/ML307C/ML305A/ML305U：不支持。


    ML307X/ML307Y：不支持'
  examples:
  - 'AT+MUECONFIG=?

    +MUECONFIG: "defapn",,

    +MUECONFIG: "autoconn",(0,1)

    +MUECONFIG: "relver",(13,14)

    +MUECONFIG: "asrai",(0,1)

    +MUECONFIG: "2harq",(0,1)

    +MUECONFIG: "reestablish",(0,1)

    +MUECONFIG: "emulticar",(0,1)

    OK'
  source: 扩展AT用户手册 (developmentdomain/extendedatcommandusermanual/topics/r_at_mueconfig.dita)

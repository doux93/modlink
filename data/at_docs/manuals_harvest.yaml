    `<length>`整型，数据长度，单位字节，范围0~2048。数据模式输入时，长度需大于0，命令中直接输入数据时，不校验数据长度以实际输入数据为准。


    `<data>`数据，最大长度2048字节，数据格式由`AT+MBLECFG="encoding"`命令确定。'

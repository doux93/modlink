- cmd: AT+MQTTCONN
  syntax: AT+MQTTCONN=<connect_id>,<host>[,<port>[,<clientID>,<user>,<passwd>]]
  category: mqttusermanual
  kind: command
  risk: none
  title: AT+MQTTCONN 连接
  doc: '该命令用于连接至MQTT或MQTTS服务器。


    参数：

    `<connect_id>`整型，MQTT客户端标识符。范围：0~5。（注：MN316A/MN326A/MN319/MN319-A范围：0~2。）


    `<host>`字符串，MQTT服务器IP地址或域名，最大长度128。


    `<port>`整型，MQTT服务器端口，范围：0~65535，省略时为默认值1883。


    `<clientID>`字符串，终端ID，最大长度128。


    `<user>`字符串，登录用户名，最大长度128。


    `<passwd>`字符串，登录密码或鉴权信息，最大长度256。


    `<conn_state>`整型，MQTT客户端状态。参考URC信息上报。


    - `0`: 连接成功

    - `1`: 正在重连

    - `2`: 客户端断开

    - `3`: 服务器拒绝

    - `4`: 服务器断开

    - `5`: ping超时

    - `6`: 网络异常

    - `255`: 未知错误'
  examples:
  - 'AT+MQTTCONN=0,"mqtt.heclouds.com",6002,"716335458","425089","SnMHaAOMCbQD90eADEGpMBPu8pI="

    OK

    +MQTTURC: "conn",0,0'

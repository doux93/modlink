- cmd: AT+MHTTPREQUEST
  syntax: AT+MHTTPREQUEST=<httpid>,<method>[,<length>[,<path>[,<local_path>]]]
  category: http_httpsusermanual
  kind: command
  risk: none
  title: AT+MHTTPREQUEST 发送HTTP请求
  doc: '该命令用于发送HTTP请求。


    参数：

    `<httpid>`客户端实例id，0~3。（注：MN319/MN319-A/MN316A/MN326A：`<httpid>`参数范围0~1。）


    `<method>`请求类型。（注：ML307G：DELETE请求返回不携带配置的content数据。）


    - `1`: GET

    - `2`: POST

    - `3`: PUT

    - `4`: DELETE

    - `5`: HEAD


    `<length>`输入数据长度，0~4096，数据模式下不可设置为0，命令中直接输入数据时，设置为0，不对数据长度进行校验，设置大于0，将对输入数据的长度进行校验（ASCII字符串和带转义的字符串输入模式下：校验实际命令中输入字符串长度是否与指定长度相等；HEX字符串输入模式下：校验实际命令中输入字符串长度是否是指定长度的两倍）。（注：MN327：命令直接输入模式下，单条命令最大长度为2048，超过将报错。


    ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML305M/ML307R/ML307B/ML307C/ML307M/ML307H/ML307N/MR380R/MR380M：数据模式下可设置为0。


    ML305U：数据模式下可设置为0，参数缺省时为0。）


    `<path>`请求的url path。（注：`AT+MHTTPCFG="encoding"`中设置的`<input_format>`参数，只对直接命令中带`<path>`的输入模式有效，对数据模式输入无效，数据模式直接使用原始数据。`AT+MHTTPCFG="urlencode"`使能后，模组将自动对请求的`<path>`进行编码，不对字母数字以及`-_.!~*''();/?:@&=+$,#`进行编码。）


    `<local_path>`本地文件路径，长度范围与文件系统相关。（注：ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML307R/ML307B/ML307C/MR380R/MR380M：若`<local_path>`第一位为正斜杠("/")则将下载文件存储在用户输入的路径下，否则将下载文件存储在`/etc/http_file/`路径下。


    ML305U/ML305M/ML307X/ML307Y：若`<local_path>`仅含有正斜杠("/")则将下载文件存储在用户输入的路径下，若`<local_path>`仅含有反斜杠("\")或者不包含斜杠则将下载文件存储在`/etc/http_file/`路径下。


    ML307M/ML307H/MN319-A：不支持`<local_path>`参数设置。）'
  examples:
  - 'AT+MHTTPCREATE="http://120.27.12.119:10080"

    +MHTTPCREATE: 0

    OK

    AT+MHTTPREQUEST=0,1,0,"/get"

    OK

    +MHTTPURC: "header",0,200,225,HTTP/1.1 200 OK

    Server: nginx/1.18.0

    Date: Fri, 23 Jul 2021 09:59:35 GMT

    Content-Type: application/json

    Content-Length: 145

    Connection: keep-alive

    Access-Control-Allow-Origin: *

    Access-Control-Allow-Credentials: true

    +MHTTPURC: "content",0,145,145,145,{"args":{},"headers":{"Connection":"close","Content-Length":"0","Host":"localhost:6000"},"origin":"127.0.0.1","url":"http://localhost:6000/get"}'

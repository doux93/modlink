- cmd: AT+MIPLMGR
  syntax: AT+MIPLMGR=<ref>
  category: lwm2musermanual
  kind: command
  risk: none
  title: AT+MIPLMGR 获取缓存请求
  doc: '该该命令用于获取未被读取的缓存下发操作，仅用于URC非默认模式下。


    参数：

    `<ref>`整型，LwM2M设备实例ID。'
  examples:
  - 'AT+MIPLMGR=0

    +MIPLREAD: 0,8172,3200,0,-1

    OK

    AT+MIPLMGR=0 /*需执行对应的RSP命令后，才可读取下一条操作。*/

    +MIPLREAD: 0,8172,3200,0,-1

    OK

    AT+MIPLREADRSP=0,8172,1,3200,0,5500,5,1,"0",2,1

    OK

    AT+MIPLREADRSP=0,8172,1,3200,0,5501,3,3,"-12",1,2

    OK

    AT+MIPLREADRSP=0,8172,1,3200,0,5750,1,4,"test",0,0

    OK

    AT+MIPLMGR=0 /*如果一次write操作中有多条资源被write，将一并上报。*/

    +MIPLWRITE: 0,8173,3200,0,5501,3,4,1860,1,0

    +MIPLWRITE: 0,8173,3200,0,5750,1,4,test,0,0

    OK

    AT+MIPLWRITERSP=0,8173,2

    OK

    AT+MIPLMGR=0

    OK

    AT+MIPLMGR=0

    +CIS ERROR: 602'

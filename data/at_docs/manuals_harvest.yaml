- cmd: AT+MPSRAT
  syntax: AT+MPSRAT=<PreferredAct>[,<PreferredAct>…]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MPSRAT 设置模组制式及优先级
  doc: '该命令用于模组制式相关功能项的设置及查询。


    参数：

    `<PreferredAct>`字符串，配置模组无线接入制式。（注：MR880A/MF572E/MR380R/MR380M：仅支持LTE及NR制式。MR380M在`AT+CFUN=0`时执行设置命令可在`AT+CFUN=1`时立即生效，在`AT+CFUN=1`时执行配置命令，无法立即生效，需重启模组或`AT+CFUN=0`再`AT+CFUN=1`后生效。）（注：ML307B：仅支持LTE制式。）


    - `GSM`: GSM制式

    - `WCDMA`: WCDMA制式

    - `TDSCDMA`: TDSCDMA制式

    - `LTE`: LTE制式

    - `eMTC`: eMTC制式

    - `NBIOT`: NB-IoT制式

    - `CDMA`: CDMA制式

    - `NR`: NR制式'
  examples:
  - 'AT+MPSRAT="LTE","GSM" //设置模组支持的制式优先级为LTE、GSM。

    OK'

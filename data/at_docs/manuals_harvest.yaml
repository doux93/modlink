    - `timeout`: 超时时间设置，包含连接超时、响应超时、数据输入超时。

    - `encoding`: 输入输出数据编码设置。

    - `ssl`: SSL使能设置，用于HTTPS。

    - `cid`: PDP上下文cid设置。

    - `fragment`: 数据输出流控设置，用于数据输出打印时控制分包输出。

    - `urlencode`: URL编码设置，使能后，模组将自动对请求的path进行编码，不对字母数字以及-_.!~*''();/?:@&=+$,#进行编码。

    - `wtcp`: wtcp模式设置，包括是否绕过wtcp，以及绕过时选用的TCP options配置值。


    `<httpid>`客户端实例id，`AT+MHTTPCREATE`创建成功后返回，0~3。（注：MN319/MN319-A/MN316A/MN326A：`<httpid>`参数范围0~1。）


    `<header_len>`通用报头长度。


    `<header>`通用报头，应用于实例生命周期，设置时需按`key: value`的形式分字段进行设置，模组会保存所有设置字段。（注：ML302A/ML305A/ML307A/ML307G/ML307M/ML307R/ML307B/ML307C/ML307H/ML307N：`<header>`参数输入长度范围为1~1024。）


    `<chunked_mode>`传输模式，默认值0。


    - `0`: content_length模式

    - `1`: chunked模式


    `<cached>`缓存模式，默认值0。


    - `0`: 非缓存模式

    - `1`: 缓存模式


    `<cache_length>`缓存空间，默认值4K（4096字节），1~8192字节。（注：当`<cached>`为0时（非缓存模式），查询时不显示`<cache_length>`。此外，MN316A/MN326A：支持范围1~4096字节。）


    `<conn_timeout>`连接超时时间，0~180s，默认值60s。


    `<rsp_timeout>`服务器响应超时时间，0~60s，默认值0s（不超时）。


    `<input_timeout>`数据输入超时时间，0~180s，默认值10s。（AT命令输入数据，并采用>模式输入时。）（注：M5310-E/MN328/MN318/MN316/MN319/MN319-A/MN326/MN316A/MN326A：不支持数据模式输入'

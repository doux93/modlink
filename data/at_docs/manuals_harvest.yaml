- cmd: AT+CGDCONT
  syntax: AT+CGDCONT=<cid>[,<PDP_type>[,<APN>[,<PDP_addr> [,<d_comp>[,<h_comp>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CGDCONT 定义PDP上下文
  doc: '该命令用户设置PDP上下文。


    参数：

    `<cid>`整型， 指定某个 PDP 上下文。这是 TE-UE 接口的本地参数，可以用在其他 PDP 上下文相关的命令中。测试命令返回参数值的范围（最小值为 1；如果支持自动激活，最小值为 0），0-10。
    使能 BIP 时，不可将 <cid> 的值设置为 7。


    `<PDP_type>`字符串， 分组数据协议类型 。


    - `IP`: 网络协议（IETF STD 5）

    - `IPV6`: 网络协议，IPv6

    - `IPV4V6`: 引入虚拟 <PDP_type> 处理双 IP 堆栈 UE 功能

    - `Non-IP`: 无 IP


    `<APN>`字符串， 逻辑名称，用于选择 GGSN 或外部 PDN。值为空或省略时，将请求订阅 值。字符串的最大长度为 100 个字符。


    `<PDP_addr>`字符串，在可应用于PDP的地址空间中标识MT的字符串参数。不支持设置。


    `<d_comp>`整型，PDP数据压缩。不支持设置。默认值0。


    - `0`: 关闭

    - `1`: 打开 （制造商首选压缩）

    - `2`: V.42bis

    - `3`: V.44bis


    `<h_comp>`整型， 控制 PDP 头压缩。 当前只支持0和1，默认值0。


    - `0`: 关闭

    - `1`: 打开 （制造商首选压缩）

    - `2`: RFC1144

    - `3`: RFC2507

    - `4`: RFC3095


    `<IPv4AddrAlloc>`整型，控制MT/TA如何请求获取IPv4地址信息。不支持设置，默认值0。


    - `0`: 通过NAS信令进行IPv4地址分配。

    - `1`: 通过DHCP分配的IPv4地址。


    `<request_type>`整型，PDP上下文激活请求的类型。不支持设置，默认值2。


    - `0`: PDP上下文用于新的PDP上下文建立或用于从非3GPP接入网络的切换。

    - `1`: PDP上下文用于紧急承载服务。

    - `2`: PDP上下文用于建立新的PDP上下文。

    - `3`: PDP上下文用于从非3GPP接入网络切换。

    - `4`: PDP上下文用于从非3GPP接入网络切换紧急承载服务。


    `<PCSCF_discovery>`整型，影响MT/TA如何请求获得P-CSCF地址。不支持设置，默认值0。


    - `0`: P-CSCF地址发现的首选项不受+CGDCONT的影响。

    - `1`: 通过NAS信令发现P-CSCF地址的偏好。

    - `2`: 通过DHCP发现P-CSCF地址的偏好。


    `<IM_CN_Signalling_Flag_Ind>`整型，向网络指示PDP上下文是否仅用于IM CN子系统相关信令。不支持设置，默认值。


    - `0`: UE指示PDP上下文仅不用于IM CN子系统相关信令。

    - `1`: UE指示PDP上下文仅用于IM CN子系统相关信令。


    `<NSLPI>`整型， NAS 信令优先级 。默认值0。


    - `0`: 根据 UE 中配置的低优先级指示符的值激活此 PDP 上下文 。

    - `1`: 根据低优先级指示符设置为“NAS 信令低优先级 MS 未配置”，激活此 PDP 上下文。 UE 使用 3GPP TS 24.301 和 3GPP TS 24.008 中提供的 NSLPI
    信息 。


    `<securePCO>`整型， 指定是否请求 PCO 的安全保护传输（适用于仅 EPS）。默认值0。


    - `0`: 指定是否请求 PCO 的安全保护传输（适用于仅 EPS） 。

    - `1'
  examples:
  - 'AT+CGDCONT=?

    +CGDCONT:(0-10),("IP","IPV6","IPV4V6","NONIP"),,,,(0,1),,,,,(0,1),(0,1)

    OK'

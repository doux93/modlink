- cmd: AT+MLOCKFREQ
  syntax: AT+MLOCKFREQ=<mode>[,<earfcn>,[<pci>]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MLOCKFREQ 指定搜索频率
  doc: '该命令用于指定频率进行搜网。


    参数：

    `<mode>`整型，指定搜索类型并定义提供的参数。（注：MN316/MN316-S/MN316A/MN326A/M5310-E/MN327/MN328/MN319/MN319-A/MN318/MN326：不支持模式2。）（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML307C/ML305A/ML305U/ML305M/ML551Z/ML307M/ML307N：不支持模式2。）（注：MF308C/MF572E/MR380R/MR380M：不支持模式2。）


    - `0`: 解除锁定

    - `1`: 锁定

    - `2`: 设置优先频点


    `<earfcn>`整型，表示要搜索的EARFCN。范围：1~262143。（注：MN316/MN316-S/MN316A/MN326A/MN319/MN326支持范围：1~65535。）（注：MF308C/MF572E支持范围：1~2279166。）（注：ML551Z：支持范围1~4294967294中支持的earfcn值，如报错则为预留值。）


    `<pci>`整型，E-UTRAN物理小区ID，十进制。范围：0~503。（注：MF308C支持范围：0~1007。


    MF572E支持范围：0~1008。）'
  examples:
  - 'AT+MLOCKFREQ?

    +MLOCKFREQ: 0

    OK'

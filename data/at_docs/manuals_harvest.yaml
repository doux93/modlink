- cmd: AT+CEREG
  syntax: AT+CEREG=<n>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CEREG EPS 网络注册状态
  doc: '该命令用于查询EPS网络注册状态或设置状态URC显示。


    参数：

    `<n>`整型，默认值0。


    - `0`: 禁用网络注册 URC。

    - `1`: 使能网络注册 URC：`+CEREG:<stat>`。

    - `2`: 使能网络注册与位置信息 URC：`+CEREG:<stat>[,[<tac>],[<ci>],[<AcT>]]`。

    - `3`: 使能网络注册、位置信息和 EMM 原因值 URC：`+CEREG:<stat>[,[<tac>],[<ci>],[<AcT>][,<cause_type>,<reject_cause>]]`。

    - `4`: 对于请求 PSM 的 UE，使能网络注册和位置信息 URC：`+CEREG:<stat>[,[<tac>],[<ci>],[<AcT>][,,[,[<Active-Time>],[<Periodic-TA
    U>]]]]`。

    - `5`: 对于请求 PSM 的 UE，使能网络注册、位置信息和 EMM 原因值 URC：`+CEREG:<stat>[,[<tac>],[<ci>],[<AcT>][,[<cause_type>],[<reject_cause>][,[<
    Active-Time>],[<Periodic-TAU>]]]]`。


    `<stat>`整型，EPS注册状态。


    - `0`: 未注册，UE 目前未搜索运营商进行注册。

    - `1`: 已注册，本地网络。

    - `2`: 未注册，但 UE 目前正在连接或搜索运营商进行注册 。

    - `3`: 注册被拒绝。

    - `4`: 未知（例如不在 E-UTRAN 范围内）。

    - `5`: 已注册，漫游网络。


    `<tac>`字符串，十六进制 2 字节跟踪区域代码（例如“00C3”等于十进制的 195）。


    `<ci>`字符串，十六进制 4 字节的 E-UTRAN 小区 ID。


    `<AcT>`整型，服务小区的接入技术。


    - `7`: E-UTRAN

    - `9`: E-UTRAN (NB-S1 模式)


    `<cause_type>`整型，`<reject_cause>`类型。


    - `0`: 表示`<reject_cause>`包含一个 EMM 原因值。

    - `1`: 表示`<reject_cause>`包含一个特定制造商的原因值。


    `<reject_cause>`整型，包含注册失败的原因。该参数的类型由`<cause_type>`定义。


    `<Active-Time>`字符串。 8 位格式的一个字节。表示在 E-UTRAN 中分配给 UE 的 Active-time 值 （T3324）。Active-time 值编码为 GPRS Timer
    2 信息元素的一个字节（octet 3），编 码为位格式（例如“00100100”等于 4 分钟）。 关于编码和值范围，请参考 3GPP TS 24.008、3GPP TS 23.682 和 3GPP
    TS 23.401。


    `<Periodic-TAU>`字符串。 8 位格式的一个字节。表示在 E-UTRAN 中分配给 UE 的扩展周期性 TAU 值（T3412）。扩展的周期 TAU 值，编码为 GPRS Timer
    3 信息元素的一个字节（octet 3），编码为位格式（例如“01000111”等于 70 小时）。 对于编码和值范围，请参考 3GPP TS 24.008、3GPP TS 23.682 和 3GPP
    TS 23.401。'
  examples:
  - 'AT+CEREG=1

    OK

    AT+CEREG?

    +CEREG:1,1

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cereg.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cereg.dita)

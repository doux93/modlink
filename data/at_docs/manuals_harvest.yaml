- cmd: AT+MIPCLOSE
  syntax: AT+MIPCLOSE=<connect_id>[,<mode>]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPCLOSE 关闭TCP/IP连接
  doc: '该命令用于关闭TCP或UDP连接。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-E/MN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。


    MR880A：范围0~9。）


    `<mode>`整型，仅对TCP生效，socket关闭模式，默认值0。（注：MN316/MN316-S/MN319/MN319-A/MN326/MN327：不支持`<mode>`参数配置，关闭方式为模式2。


    MN316A/MN326A：不支持`<mode>`参数配置，关闭方式为模式4。


    M5310-E：不支持`<mode>`参数配置，关闭方式为向服务器发送RST消息重置连接后关闭。


    MN318/MN328：不支持`<mode>`参数配置，关闭方式为向服务器发送RST消息重置连接后关闭。


    ML302A/ML305A/ML307A/ML302S/ML307S/ML305U/ML305M/ML307M/ML307R/ML307N/ML307C/ML307X/ML307Y：不支持`<mode>`参数配置，关闭方式为等待缓存区数据发送完毕。


    ML307G：`<mode>`参数范围0~3。


    ML307H：不支持`<mode>`参数配置，关闭方式为立即关闭不等待缓存区数据发送完毕 。


    MR880A：不支持`<mode>`参数配置，关闭方式为模式4，其中MSL=30s。


    ML307B：不支持`<mode>`参数配置，关闭方式为不等待发送缓存区数据发送完毕，正常关闭TCP连接，关闭环节最长等待10s。）


    - `0`: 等待发送缓存区数据发送完毕后（不等待2MSL），关闭TCP连接。

    - `1`: 立即关闭不等待缓存区数据发送完毕（不等待2MSL）。

    - `2`: 不等待发送缓存区数据发送完毕，等待 2MSL（Maximum Segment Lifetime，最大分段报文生存周期） 后关闭。如果建立连接时未指定本地端口，关闭连接时等待的时间将不影响下一次创建，可忽略该等待时间；如果建立连接时指定了本地端口，关闭连接时该端口将在2MSL后才可使用。该等待的起始时间为最后一次数据交互的时间，所以资源释放等待时间为小于等于2MSL。（注：MN316/MN316-S/MN316A/MN326A/MN319/MN319-A/MN326/MN327：MSL=5.5s。）

    - `3`: 向服务器发送RST消息重置连接后关闭。

    - `4`: 等待发送缓存区数据发送完毕后，再等待 2MSL（Maximum Segment Lifetime，最大分段报文生存周期） 后关闭。 等待 2MSL策略与模式2相同。


    `<ret_code>`整型，返回码，`<mode>`有效时触发。


    - `0`: 正常关闭

    - `1`: 服务器端未响应，超时关闭。

    - `2`: 其他原因关闭（收到RST、传输超时等。）'
  examples:
  - 'AT+MIPCLOSE=?

    +MIPCLOSE: (0-4),(0-3)

    OK'

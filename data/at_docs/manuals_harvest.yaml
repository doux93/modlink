  syntax: AT+MFWDLOAD=<offset>,<len>[,<data>]
  category: firmwareupgradeusermanual
  kind: command
  risk: none
  title: AT+MFWDLOAD 下载升级包
  doc: '该命令用于下载固件包，可从指定URL或AT口载入升级包数据。


    参数：

    `<offset>`整型，当前固件包写入偏移地址。（注：ML305U不支持断点续传功能，`<offset>`仅支持0。）


    `<len>`整型，本次写入字节长度，最大512。（注：ML305U不支持断点续传功能，`<len>`为差分包实际总大小，可以大于512。）


    `<data>`字符串，可选参数，16进制字符串。


    `<state>`整型，下载过程中的状态。


    - `1`: 下载中

    - `2`: 下载成功

    - `3`: 下载失败


    `<total>`整型，本次下载固件包总长度。无法预知总长度时，该参数将被省略。


    `<dlength>`整型，当前固件包已下载字节数。'
  examples:
  - 'AT+MFWCFG="url","http://1.15.41.92:3000/data"

    OK

    AT+MFWDLOAD

    OK

    +MFWDLOAD: 2,9508,9508'

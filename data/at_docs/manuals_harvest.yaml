- cmd: AT+MLBSCFG
  syntax: AT+MLBSCFG="method"[,<method>]
  category: lbsusermanual
  kind: command
  risk: none
  title: AT+MLBSCFG 配置LBS参数
  doc: '该命令用于配置LBS参数。


    参数：

    `<subcmd>`字符串型，可配置选项。


    - `method`: LBS定位平台设置。

    - `apikey`: 高德定位平台接入API key设置。

    - `signkey`: 高德定位平台数字签名私钥设置，仅在`<signen>`为1时生效。

    - `signen`: 向高德定位平台请求定位数据时启用数字签名模式设置。

    - `precision`: 定位结果经纬度小数部分数字的位数设置。

    - `format`: 定位结果输出具体位置信息描述的模式设置。

    - `pid`: OneOS定位服务鉴权参数设置，模组已内置此鉴权参数，可无需进行配置。若对此参数进行了配置，则会优先使用配置的鉴权参数。在配置后若想恢复使用内置的鉴权参数，将`<pid>`配置为"0"即可。

    - `nearbtsen`: 使用邻区信息参与定位的模式设置。


    `<value>`字符串型/整型，类型由可配置选项决定，可配置选项的参数。


    `<method>`整型，LBS定位平台，默认值10。（注：ML307A-DL/ML305A-DL/ML307R-DL/ML307C-DL-CN/ML307C-DL-EM/ML307R-BL/ML307R-ML/ML305M-DALM/ML307G/ML307M/ML307H/ML307X-DC/ML307Y：默认值为40。）


    - `10`: 高德智能硬件定位1.0

    - `11`: 高德智能硬件定位2.0


    - `40`: OneOS定位服务


    `<apikey>`字符串型，高德定位平台接入的API key。


    `<apikey_md5>`字符串型，`<apikey>`的MD5值。


    `<signkey>`字符串型，高德定位平台数字签名私钥，仅在`<signen>`为1时生效。


    `<signkey_md5>`字符串型，`<signkey>`的md5值。


    `<signen>`整型，向高德定位平台请求定位数据时是否启用数字签名，默认值0。


    - `0`: 关闭数字签名

    - `1`: 启用数字签名


    `<precision>`整型，定位结果经纬度小数部分数字位数，范围1~8，默认值8，若设置的位数超过实际获取到的数据位数，则数据在末尾补0。


    `<descr_mode>`整型，用于设置定位结果是否输出`<descr>`（该参数详细描述见`AT+MLBSLOC`命令）， 默认值0，`<method>`为40时，不支持此参数配置。


    - `0`: 不输出

    - `1`: 输出


    `<pid>`字符串型，OneOS定位服务鉴权参数，模组已内置此鉴权参数，可无需进行配置。若对此参数进行了配置，则会优先使用配置的鉴权参数。在配置后若想恢复使用内置的鉴权参数，将`<pid>`配置为"0"即可。


    `<pid_md5>`字符串型，`<pid>`的md5值。


    `<nearbtsen>`整型，用于设置是否使用邻区信息参与定位，默认值0，若使用邻区信息参与定位，能够提高定位结果准确性，由于测量邻区信息会消耗一定时间，会增加定位所消耗的总时间。


    - `0`: 不使用邻区信息参与定位

    - `1`: 使用邻区信息参与定位


    > 注意：- 设置的参数均会保存,在不改变的情况下只需进行一次设置即可;

    - 设置`<apikey>`前应先设置`<method>`,`<apikey>`与`<method>`一一对应，例如：先`<method>`设置为10，再设置`<apikey>`，则此时所设置的`<apikey>`只针高德智能硬件定位1.0生'
  examples: []
  source: LBS用户手册 (developmentdomain/lbsusermanual/topics/r_at_mlbscfg.dita)

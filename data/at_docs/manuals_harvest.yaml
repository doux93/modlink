- cmd: AT+MLED
  syntax: AT+MLED=<led_mode>[,<enable>]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MLED 开关指示灯功能
  doc: '该命令用于设置指示灯功能。


    参数：

    `<led_mode>`整型，指示灯功能选择。（注：MN316/MN316-S/MN316A/MN326A/MN326：网络指示灯在未注网时或注网中均为灯快闪，MN316-S-DLVS：不支持运行状态指示灯。M5310-E/MN328/MN318：不支持`<led_mode>`=1运行状态灯设置。）（注：MF308C/MR880A：仅支持网络状态指示灯配置。）


    - `0`: 模组网络状态指示灯（未注网时：灯熄灭；注网中：灯快闪，高电平50ms，低电平1000ms；注网成功：灯慢闪，高电平50ms，低电平2000ms。）（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML307C/ML307G/ML307H/ML307M/ML307N/ML307X/ML307Y/ML307B：未注网时灯快闪，高电平50ms，低电平950ms；注网成功后灯慢闪，高电平100ms，低电平1900ms。


    ML307N：系统进入睡眠后，网络状态指示灯熄灭，退出睡眠后恢复。


    ML305A：未注网时灯熄灭，注网成功后灯常亮。


    ML305U：未注网时灯快闪，高电平100ms，低电平1000m；注网成功后灯慢闪，高电平100ms，低电平2000m。）（注：MF308C：未注网或正在注网时灯快闪，低高电平50ms，低电平1000ms；注网成功后灯慢闪，高电平50ms，低电平2000ms。


    MR880A未注网时：低电平；注网中：灯快闪，低电平50ms，高电平1000ms；注网成功：灯慢闪，低电平50ms，高电平2000ms。）

    - `1`: 模组运行状态指示灯（注：MN319-A：模组运行状态指示灯对应WAKEUPOUT引脚。）（注：MR380R/MR380M：开机或休眠时常亮，此时输出为低电平；关机时熄灭。MR380M该指示灯默认开启，无法关闭。）

    - `2`: 网络制式状态指示灯（注：仅MR380R支持，注册到5G网络后输出高电平，其他状态输出低电平。）


    `<enable>`整型，是否使能指示灯，默认值0。


    - `0`: 关闭指示灯

    - `1`: 开启指示灯'
  examples:
  - 'AT+MLED=?

    +MLED: (0-1),(0-1)

    OK'
  source: 扩展AT用户手册 (developmentdomain/extendedatcommandusermanual/topics/r_at_mled.dita)

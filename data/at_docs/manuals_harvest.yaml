- cmd: AT+MIPSRVCFG
  syntax: AT+MIPSRVCFG="cid",<sid>[,<cid>]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPSRVCFG 设置服务器参数
  doc: '该命令用于配置服务器相关指定参数。


    参数：

    `<cmd>`字符串，命令标识符。（注：MR880A：不支持"cid"设置。）


    - `cid`: 设置服务器实例所属的PDP上下文

    - `encoding`: 设置服务器新连接的数据接收格式

    - `rcvbuf`: 设置服务器新连接的接收缓存大小


    `<sid>`整型，服务器实例id，用于标识操作的服务器实例。范围：0~3。


    `<cid>`整型，PDP上下文id，指定当前实例使用的PDP上下文，范围与`AT+CGDCONT`命令支持的范围相同，默认不指定，指定时需保证指定`<cid>`已激活。


    `<rev_format>`整型，新连接数据接收格式。默认值0。


    - `0`: ASCII字符串（原始数据）

    - `1`: HEX字符串


    `<recv_buffer>`整型，新连接接收缓存大小，范围：1~65535，单位：字节。使用缓存模式时有效。TCP连接时，受TCP协议滑动窗口机制限制，可能出现URC上报信息中缓存⽆法达到上限的情况，属正常现象，TCP协议配置无效。（注：MR880A：TCP协议配置有效。）'
  examples:
  - 'AT+MIPSRVCFG=?

    +MIPSRVCFG: "encoding",(0-3),(0-1)

    +MIPSRVCFG: "rcvbuf",(0-3),(1-65535)

    OK'

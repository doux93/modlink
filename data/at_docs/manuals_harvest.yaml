    - `4`: 初始化过程中

    - `7`: RF 被 NB-IoT 抢占


    `<mode>`整型。控制蓝牙协议栈的开关标识。 默认值0。


    - `0`: 关闭 BLE 协议栈

    - `1`: 开启 BLE 协议栈'

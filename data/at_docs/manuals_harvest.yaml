- cmd: AT+MHTTPREAD
  syntax: AT+MHTTPREAD=<httpid>,<type>[,<read_len>]
  category: http_httpsusermanual
  kind: command
  risk: none
  title: AT+MHTTPREAD 读取HTTP数据
  doc: '该命令用于读取缓存模式下的HTTP缓存数据。


    参数：

    `<httpid>`客户端实例id，0~3。（注：MN319/MN319-A/MN316A/MN326A：`<httpid>`参数范围0~1。）


    `<type>`缓存数据类型。


    - `0`: header数据

    - `1`: content数据


    `<read_len>`希望读取的数据长度，0~65535，为0时读取全部缓存数据。


    `<unread_length>`剩余未读取缓存长度。


    `<data_len>`当前读取数据长度。


    `<data>`读取的数据。'
  examples:
  - 'AT+MHTTPCREATE="http://120.27.12.119:10080"

    +MHTTPCREATE: 0

    OK

    AT+MHTTPCFG="cached",0,1

    OK

    AT+MHTTPREQUEST=0,1,0,"/get"

    OK

    +MHTTPURC: "recv",0,200,225,145

    AT+MHTTPREAD=0,0,225

    +MHTTPREAD: 0,0,0,225,HTTP/1.1 200 OK

    Server: nginx/1.18.0

    Date: Mon, 26 Jul 2021 01:25:15 GMT

    Content-Type: application/json

    Content-Length: 145

    Connection: keep-alive

    Access-Control-Allow-Origin: *

    Access-Control-Allow-Credentials: true

    OK'

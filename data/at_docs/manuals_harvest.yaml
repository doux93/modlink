- cmd: AT+MBLECONN
  syntax: AT+MBLECONN=<conn_index>,<peer_addr_type>,<peer_addr>[,<min_interval>,<max_interval>,<latency>,<timeout>]
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLECONN 建立BLE连接
  doc: '该命令用于建立BLE连接（主机发起）。


    参数：

    `<conn_index>`整型，连接号，根据支持情况，进行单路或多路连接。


    `<peer_addr_type>`整型，连接地址类型。


    - `0`: 未加密公用设备地址（public address）

    - `1`: 未加密随机设备地址（random device address）

    - `2`: 加密公用设备地址（RPA public address）（注：ML302/ML305不支持该参数。）

    - `3`: 加密随机设备地址（RPA random device address）（注：ML302/ML305不支持该参数。）


    `<peer_addr>`6字节十六进制字符串，连接BLE地址，“xx:xx:xx:xx”格式。


    `<min_interval>`整型，最小连接间隔，单位时间1.25ms，范围6~3200，即时间范围7.5ms~4s，不能大于最大时间间隔。


    `<max_interval>`整型，最大连接间隔，单位时间1.25ms，范围6~3200，即时间范围7.5ms~4s。


    `<latency>`整型，从机延时对应的连接间隔数，即从机最多忽略的主机数据包个数，范围0~499。


    `<timeout>`整型，监控超时时间，单位时间10ms，范围10~3200，对应时间100ms~32s，如果在该事件段内，双方没有数据交互，就会断开连接。'
  examples:
  - 'AT+MBLECONN=0,"45:C6:E9:34:2D:CC"

    OK

    +MBLEGAPURC: "conn",0,1,0,"45:C6:E9:34:2D:CC",1 //连接建立成功'

- cmd: AT+MUESTATS
  syntax: AT+MUESTATS[=<type>]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MUESTATS 查询UE网络信息
  doc: '该命令用于查询UE（User Equipment）当前的网络信息。


    参数：

    `<type>`字符串，数据类型。（注：MF308C/MF572E/MR880A：不支持"bler"、"thp"与"all"。）


    - `"radio"`: Radio特定信息，当未驻留小区时，参数取无效值。

    - `"cell"`: 服务小区、邻区信息。

    - `"bler"`: 误块率信息

    - `"thp"`: 吞吐量

    - `"sband"`: 查询当前服务小区对应的BAND

    - `"all"`: 所有信息

    - `"fmcell"`: 查询当前服务小区及强制测量邻区信息


    `<type>`="radio"相关参数。（注：ML551Z：驻留GSM网络时不支持参数`<tx_power>`、`<dtx_used>`、`<rxlevsub>`、`<rxlevfull>`、`<rxqualsub>`与`<rxqualfull>`。）


    `<rat>`整型，无线接入模式。（注：MR880A：仅支持LTE和NR制式。）


    - `0`: 无效的网络

    - `1`: GSM

    - `2`: WCDMA

    - `3`: TDSCDMA

    - `4`: LTE

    - `5`: eMTC

    - `6`: NB-IoT

    - `7`: CDMA

    - `8`: EVDO

    - `11`: NR


    `<rsrp>`整型，参考信号接收功率，即RSRP（Reference Signal Receiving Power），单位0.1dBm。 有效值范围：-1650~-400-1400~-440；无效值-32768。（注：MN316/MN316-S/MN326/MN316A/MN326A：有效值范围为：-1650~-250。）（注：ML307X/ML307Y：有效值范围为：-1410~-440。）


    `<rssi>`整型，接收的信号强度指示，即RSSI（Received Signal Strength Indication），单位0.1dBm。 有效值范围：-1330~-250；无效值-32768。（注：MN316/MN316-S/MN326/MN316A/MN326A：有效值范围为：-1330~-150。）（注：ML307X/ML307Y：有效值范围为：-1410~0。）（注：MR880A：NR制式不支持RSSI参数。）


    `<rsrq>`整型，参考信号接收质量，单位0.1dB。有效值范围：-400~-108-195~-30；无效值-32768。（注：MN319/MN319-A：`<rsrq>`参数有效范围是：-400~30。）（注：ML307X/ML307Y：有效值范围为：-200~-30。）


    `<rxlev>`整型，接收信号电平，描述收到信号强度（电平）的统计参数，应映射到0~63之间的数值。


    - `0`: 小于-110 dBm

    - `1`: -110~-109 dBm

    - `2`: -109~-108 dBm

    - `...`: ...

    - `62`: -49~-48 dBm

    - `63`: 大于-48 dBm

    - `99`: 无效值


    `<tx_power>`整型，最近一次的发射功率，单位0.1dBm。有效值范围：-400~230；无效值-32768。（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML305A/ML305M/ML551Z/ML307M/ML307N/ML307B：不支持该参数。）（注：MR880A：不支持该参数。）


    `<tx_time>`整型，上行累计的发送时长，'
  examples:
  - 'AT+MUESTATS="radio"

    +MUESTATS: "radio",6,-1015,-933,230,289,421,0D1A84FE,0,211,3684,498,-108

    OK'

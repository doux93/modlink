- cmd: AT+MFOPEN
  syntax: AT+MFOPEN=<fname>,<mode>
  category: filesystemusermanual
  kind: command
  risk: none
  title: AT+MFOPEN 打开或创建文件
  doc: '该命令用于打开或创建文件。


    参数：

    `<fname>`字符串型，文件名，最大128字节。（注：ML302A-DCLM/ML302A-GCLM/ML305A-DC/ML305A-DL/ML307A-DCLN/ML307A-GCLN/ML307A-DL/ML307R/ML307C：最大96字节。


    ML305U：路径长度最大为128字节，但目录长度和文件名长度最大为63字节。


    ML307B ：最大64字节，仅支持最多三层目录结构（包含根目录）。


    ML307C：文件名不支持中文、以及"*、?、@"特殊字符。）


    `<mode>`整型，文件模式。


    - `0`: 只读(O_RDONLY)，文件不存在时报错。

    - `1`: 只写(O_WRONLY)，从头开始并清除已有数据(O_TRUNC)，文件不存在时自动创建(O_CREAT)。

    - `2`: 只写(O_WRONLY)，附加模式(O_APPEND)，文件不存在时自动创建(O_CREAT)。

    - `3`: 读写(O_RDWR)，从头开始并清除已有数据(O_TRUNC)，文件不存在时自动创建(O_CREAT)。

    - `4`: 读写(O_RDWR)，附加模式(O_APPEND)，文件不存在时自动创建(O_CREAT)。


    `<fhandle>`整型，文件句柄，范围：0~65535。'
  examples:
  - 'AT+MFOPEN="/usr/test/2/2.txt",4

    +MFOPEN: 2

    OK'
  source: 文件系统用户手册 (developmentdomain/filesystemusermanual/topics/r_at_mfopen.dita)

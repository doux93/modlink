  scope_source: explicit_table
  language: zh
  content_hash: bcc954cd3c5bd7ad56c98fb8e31764f2fa93d4905e43c077971100fb73bf421e
- cmd: AT+NSONMI
  syntax: AT+NSONMI=<mode>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NSONMI 指示已到达Socket的消息
  doc: '该命令用于设置下行消息指示。


    参数：

    `<mode>`整型，上报模式。


    - `0`: 禁用 URC 指示消息 。

    - `1`: 启用 URC，仅指示消息数据长度：`+NSONMI:<socket>,<length>`

    - `2`: 启用 URC，指示发送消息的系统地址及远程端口、消息长度及数据内容：`+NSONMI:<socket>,<remote_addr>,<remote_port>,<length>,<data>`

    - `3`: 启用 URC，指示消息长度及数据内容：`+NSONMI:<socket>,<length>,<data>`


    `<socket>`整型， 接收数据的 socket。


    `<length>`整型， 缓存为空时接收到的第一条消息数据长度。单位：字节。


    `<remote_addr>`字符串， 发送消息的系统地址。


    `<remote_port>`整型， 远程端口。范围：0~65535。


    `<data>`十六进制字符串型。接收到的数据。接收数据的最大长度为 1358 字节。'
  examples:
  - 'AT+NSONMI=1

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nsonmi.dita)
  models:

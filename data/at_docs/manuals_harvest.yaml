- cmd: AT+CFUN
  syntax: AT+CFUN=<fun>[,<rst>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CFUN 设置UE功能
  doc: '该命令用户选择UE功能等级。


    参数：

    `<fun>`整型，功能等级。


    - `0`: 最新功能。

    - `1`: 全功能。 使 UE 能够收发所有支持的无线接入技术 RF 电路。对于支持`AT+CSRA`的 UE，这相当于命令`AT+CSRA=?`响应的 RATs。目前`AT+CSRA`设置被忽略。
    当此设置生效时，收发 RF 电路不必处于禁用状态。在`<fun>`成功配置为 1 后，可 以用`<fun>`=0 或者其他方式关闭 UE 。

    - `5`: 开机（如`AT+CFUN=1`），然后连接（如`AT+CGATT=1`）。


    `<rst>`整形，UE 重置 。暂不支持，默认值0，设置时也将被忽略。


    - `0`: 不重置 UE 。

    - `1`: 重置 UE 。'
  examples:
  - 'AT+CFUN=?

    +CFUN:(0,1,5)

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cfun.dita)

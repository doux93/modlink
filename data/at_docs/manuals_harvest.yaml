- cmd: AT+BLEWLST
  syntax: AT+BLEWLST?
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLEWLST 查询白名单
  doc: '该命令用于查询当前白名单中的设备。


    参数：

    `<BLE_addr>`字符串类型。待添加的 BLE 设备地址。48 位地址以十六进制数串表示，每个字节之间可以加 “ : ”（英文冒号）， 也可不加 ，如 "A662616202C3" 或 "A6:62:61:62:02:C3"。


    `<BLE_addrtype>`整型。BLE 设备地址类型。


    - `0`: 未加密的设备公共地址（public address）

    - `1`: 未加密的设备随机地址（random address）'
  examples:
  - 'AT+BLEWLST?

    +BLEWLST:A662616202C4,0

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blewlst.dita)

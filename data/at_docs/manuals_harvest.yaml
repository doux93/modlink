- cmd: AT+MIPTKA
  syntax: AT+MIPTKA=<connect_id>[,<keepalive>[,<keepidle>[,<keepinterval>[,<keepcount>]]]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPTKA 设置TCP心跳
  doc: '该命令用于设置TCP连接的心跳配置。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-EMN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。


    MR880A：范围0~9。）


    `<keepalive>`整型，心跳使能开关。默认值0。


    - `0`: 关闭心跳

    - `1`: 打开心跳


    `<keepidle>`整型，心跳包发送间隔，范围：30~7200；单位：s。默认值90。（注：MN316/MN316-S/MN326：默认值30。）


    `<keepinterval>`整型，心跳包重传间隔，范围：30~600；单位：s。默认值75。（注：MN316/MN316-S/MN326：默认值90。）


    `<keepcount>`整型，心跳包重传次数，范围：1~9。默认值3。'
  examples:
  - 'AT+MIPTKA=?

    +MIPTKA: (0-4),(0-1),(30-7200),(30-600),(1-9)

    OK'

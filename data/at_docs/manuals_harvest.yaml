- cmd: AT+BLEDISC
  syntax: AT+BLEDISC=<conn_hdl>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLEDISC 断开连接
  doc: '该命令用于断开连接。


    参数：

    `<conn_hdl>`整型。BLE 连接句柄。


    `<peer_addr>`字符串类型。对端设备地址。48 位地址以十六进制数串表示，如"A662616202C4"。


    `<peer_addrtype>`整型。对端设备地址类型。


    - `0`: 未加密的设备公共地址（public address）

    - `1`: 未加密的设备随机地址（random address）


    `<status>`整型。连接状态。


    - `0`: 断开连接

    - `1`: 连接


    `<reason>`整型。错误原因。 详情请参考5.4.2。'
  examples:
  - 'AT+BLEADV=1,32,32,0xffffffff,0,0,0,"",7,0

    OK

    +BLECMPEVT:0x200a

    AT+BLESETADVDATA="06094E42494F54","020a01"

    OK


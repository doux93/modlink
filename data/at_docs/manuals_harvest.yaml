- cmd: AT+NSOCR
  syntax: AT+NSOCR=<type>,<protocol>,<listen_port>[,<receive_control>[,<af_type>[,<IP_address>]]]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NSOCR 创建Socket
  doc: '该命令用于创建socket。


    参数：

    `<type>`字符串。Socket 类型。


    - `DGRAM`: UDP

    - `STREAM`: TCP


    `<protocol>`整型。标准互联网协议。例如，UDP 为 17，TCP 为 6。


    `<listen_port>`整型。范围：0~65535。表示一个包含在发送的消息中的本地端口，并会通过此本 地端口接收消息。如果为 0（在创建 TCP socket 时），则模块将为此 socket
    分配 一个随机的`<listen_port>`。


    `<socket>`大于等于 0 的整型。表示创建的 socket 的编号。最多支持 7 个 socket，但其他服务可能会占用 socket。


    `<receive_control>`整型。接收控制。


    - `0`: 忽略传入消息

    - `1`: 接收传输消息


    `<af_type>`字符串。地址族类型，IPv4 是 AF_INET，IPv6 是 AF_INET6。默认值为 AF_INET。


    `<IP_address>`IP 地址。网络分配给 UE 的 IP 地址。'
  examples:
  - 'AT+NSOCR=DGRAM,17,4587,1,AF_INET

    1

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nsocr.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nsocr.dita)

- cmd: AT+MFWCFG
  syntax: AT+MFWCFG="url"[,<url>]
  category: firmwareupgradeusermanual
  kind: command
  risk: none
  title: AT+MFWCFG 固件升级配置
  doc: '该命令用于配置通过HTTP/FTP方式升级时所需的参数。


    参数：

    `<url>`字符串，可为HTTP服务器、FTP服务器或本地文件系统URL，最大256字节，url中必须指定协议类型，比如"ftp://xxx.com:23/update1.bin"或"http://xxx.com:8080/update2.bin"或"file://dload/update3.bin"或"https://xxx.com:8080/update2.bin"。（注：ML302A-DCLM/ML302A-GCLM/ML305A-DC/ML305A-DL/ML307A-DCLN/ML307A-GCLN/ML307A-DL不支持FTP方式升级。


    ML302A/ML305A/ML307A/ML302S/ML307S不支持本地文件系统方式升级与串口写入升级。


    ML305U暂不支持FTP/FTPS方式升级，不支持指定本地文件系统方式升级。）


    `<user>`字符串，服务器登录用户名，最大48字节。


    `<passwd>`字符串，服务器登录密码，最大48字节。


    `<timeout>`整型，HTTP/FTP服务器连接超时时间设置，单位：s；范围：30~180。默认值60。（注：ML302A/ML305A/ML307A/ML302S/ML307S不支持配置服务器超时时间功能。）


    `<mode>`整型，固件包类型，仅模组支持差分包/全包升级模式可选时有效，默认值0。（注：ML302A/ML305A/ML307A/ML302S/ML307S不支持升级模式配置。


    ML305U不支持升级模式配置，仅支持差分方式升级。）


    - `0`: 差分

    - `1`: 全量


    `<progbytes>`整型，HTTP/FTP等远程下载进度上报的提示设置，单位：字节，默认值0，表示不做中间进度上报，仅结束时上报一次进度。例如配置为10240，表示每下载量超过10KB上报一次下载进度。设置值必须为1024的整数倍。（注：ML302A/ML305A/ML307A/ML302S/ML307S不支持升级上报提示配置。）


    `<ssl_id>`整型，可用的SSL加密套件配置ID，范围：0~4。（注：ML302A/ML305A/ML307A/ML302S/ML307S不支持该功能配置。）


    `<pkgsize>`整型，HTTP远程下载每包大小，单位：字节，默认值512。设置值必须为512的整数倍，最大值为3072。（注：ML302A/ML305A/ML307A/ML302S/ML307S不支持HTTP方式下载每包大小配置。


    ML305U不支持该功能配置。）'
  examples:
  - 'AT+MFWCFG="url","http://1.15.41.92:3000/data"

    OK'
  source: 固件升级用户手册 (developmentdomain/firmwareupgradeusermanual/topics/r_at_mfwcfg.dita)

- cmd: AT+MBLEGATCDISC
  syntax: AT+MBLEGATCDISC=<conn_index>,<gsrvId>
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEGATCDISC GATTC发现服务特征
  doc: '该命令用于发现服务特征。


    参数：

    `<conn_index>`整型，连接号，当前只支持单路连接，固定为0。


    `<gsrvId>`整型，服务的唯一标识，0~65535。（注：ML302/ML305为0~65534。）


    `<result>`整型，执行结果。


    - `0`: 成功

    - `其他`: 见错误码


    `<gchrId>`整型，特征在服务中的唯一标识。


    `<chrUuid>`十六进制字符串，特征的UUID，该参数是一个16位或128位的数。


    `<chrPermission>`整型，特征权限（特征允许的操作）。使用bit位表示可对该特征进行哪些操作，该参数是一个10位的数。


    - `Bit0`: 广播（如果设置，则允许广播特征值，则服务器特征配置描述符应存在。）

    - `Bit1`: 读（如果设置，允许client读取特征值。）

    - `Bit2`: 写（如果设置，允许client在无响应的情况下写入特征值。）

    - `Bit3`: 写（如果设置，允许client在有响应的情况下写入特征值。）

    - `Bit4`: 通知（如果设置，则允许使用`AT+MBLEGATSNTFY`在不确认的情况下通知特征值。如果设置，则需设置UUID为2902的特征描述符应，并使能通知。）

    - `Bit5`: 指示（如果设置，允许使用`AT+MBLEGATSIND`在确认的情况下显示特征值。如果设置，则需设置UUID为2902的特征描述符应，并使能指示。）

    - `Bit6`: 经过身份验证的签名写入（如果设置，允许使用Bluetooth Core Specification V5.0| Vol 3, Part G ,The program defined
    in Section 4.9.2.）

    - `Bit7`: 扩展属性（如果设置，则需设置UUID为2900的特征描述符。）

    - `Bit8`: 安全连接（如果设置，则需在配对完成后才可访问该特征。）

    - `Bit9`: MITM 鉴权（如果设置，则需在配对完成后才可访问该特征。）'
  examples:
  - 'AT+MBLEGATCDISC=0,2

    OK

    +MBLEGATCDISC: 0,2,0,0,7201,10

    +MBLEGATCDISC: 0,2,0,1,7202,24'
  source: BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mblegatcdisc.dita)
  models:
  - ML302
  - ML302-ENLM
  - ML302-FNLM
  - ML302-GNLM
  - ML302-INLM
  - ML302-JNLM
  - ML302-MNLM

- cmd: AT+MHTTPCFG
  syntax: AT+MHTTPCFG="header"[,<httpId>[,<header>]]
  category: 5glanfunctionusageguide
  kind: command
  risk: none
  title: AT+MHTTPCFG 参数设置
  doc: '该命令用于设置客户端实例相关的通用配置参数。


    参数：

    `<cmd>`命令标识符


    - `header`: 通用报头设置，应用于实例生命周期，设置时需按key: value的形式分字段进行设置，模组会保存所有设置字段。

    - `chunked`: 传输模式设置。普通模式（Content-Length模式）与Chunked模式的使用流程存在差异。普通模式先设置content数据，后发送请求；Chunked模式先发送请求，后设置content数据。

    - `cached`: 缓存模式设置，设置为缓存模式时，接收数据将缓存在模组中，请求完成时上报提示，用户手动读取。

    - `timeout`: 超时时间设置，包含连接超时、响应超时、数据输入超时。

    - `encoding`: 输入输出数据编码设置。

    - `ssl`: SSL使能设置，用于HTTPS。

    - `cid`: PDP上下文cid设置。

    - `fragment`: 数据输出流控设置，用于数据输出打印时控制分包输出。

    - `urlencode`: URL编码设置，使能后，模组将自动对请求的path进行编码，不对字母数字以及-_.!~*''();/?:@&=+$,#进行编码。


    `<httpid>`客户端实例id，AT+MHTTPCREATE创建成功后返回，0-3。


    `<header>`通用报头，应用于实例生命周期，设置时需按key: value的形式分字段进行设置，模组会保存所有设置字段。


    `<chunked_mode>`传输模式，默认0。


    - `0`: content_length模式

    - `1`: chunked模式


    `<cached>`缓存模式，默认0。


    - `0`: 非缓存模式

    - `1`: 缓存模式


    `<cache_lenght>`缓存空间，默认4K。


    `<conn_timeout>`连接超时时间，0~180s，默认60s。


    `<rsp_timeout>`服务器响应超时时间，0-60s，默认0s（不超时）。


    `<input_timeout>`数据输入超时时间，0-180s，默认10s。（AT命令输入数据，并采用>模式输入时。）


    `<input_format>`数据输入编码模式，默认0。模组将按设置的编码格式把输入数据转换为原始数据。


    - `0`: ASCII字符串（原始数据）

    - `1`: HEX字符串

    - `2`: 带转义的字符串


    `<output_format>`数据输出编码模式，默认0。模组将按设置的编码格式把原始数据转换为指定编码格式数据然后输出。


    - `0`: ASCII字符串（原始数据）

    - `1`: HEX字符串


    `<ssl_enable>`SSL使能，默认0。


    - `0`: 不使用SSL（普通连接，HTTP）。

    - `1`: 使用SSL（安全连接，HTTPS）。


    `<ssl_id>`SSL上下文索引号，指定当前实例使用的SSL上下文。


    `<cid>`PDP上下文id，指定当前实例使用的PDP上下文。


    `<frag_size>`接收到数据后，数据上报的最大分包大小，0-1024，默认0（实际接收包大小输出）。


    `<interval>`接收到数据后，数据分包输出的时间间隔，0-2000ms，默认0（无间隔）。


    `<urlencode_mode>`URL编码使能，默认0。


    - `0`: 不编码

    - `1`: 编码（不对字母数字以及进行-_.!~*''();/?:@&=+$,#编码）'
  examples:
  - 'AT+MHTTPCFG=?+MHTTPCFG: ("header","chunked","cached","timeout","encoding","ssl","cid","fragment","urlencode"),(0-3),

    OK'
  source: MR880A 5G LAN功能使用指南 (developmentdomain/5glanfunctionusageguide/reusable/r_at_commands_sample.dita)

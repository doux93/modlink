- cmd: AT+BLESTATE
  syntax: AT+BLESTATE?
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLESTATE 获取BLE协议栈状态
  doc: '该命令用于查询BLE协议栈状态。


    参数：

    `<state>`整型。BLE 协议栈当前状态。


    - `0`: 关闭状态

    - `1`: 开启状态


    - `2`: 关闭过程中

    - `3`: 启动过程中

    - `4`: 初始化过程中

    - `5`: 广播中

    - `6`: 连接中

    - `7`: RF 被 NB-ToT 抢占'
  examples:
  - 'AT+BLESTATE?

    +BLESTATE:1

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blestate.dita)
  models:
  - MN328
  - MN328-BX

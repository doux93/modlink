- cmd: AT+MBAND
  syntax: AT+MBAND=<key>,n[,n[,n[…]]]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MBAND 设置支持的BAND及优先级
  doc: '该命令用于网络频段相关功能项的配置及查询。


    参数：

    `<key>`字符串，模组制式，不区分大小写。（注：MR880A/MF572E/MR380M/MR380R：仅支持LTE、NR。）


    - `GSM`: GSM制式

    - `WCDMA`: WCDMA制式

    - `TDSCDMA`: TDSCDMA制式

    - `LTE`: LTE制式

    - `eMTC`: eMTC制式

    - `NBIOT`: NB-IoT制式

    - `CDMA`: CDMA制式

    - `NR`: NR制式


    `<n>`整型，BAND号。


    GSM制式：


    - `0`: 恢复所有BAND

    - `1`: GSM450

    - `2`: GSM480

    - `3`: GSM750

    - `4`: GSM850

    - `5`: GSM P900

    - `6`: GSM E900

    - `7`: GSM R900

    - `8`: GSM1800

    - `9`: GSM1900


    NB-IoT制式：（注：MN316/MN316-S/MN316A/MN326A/MN326：参数`<n>`不支持0。


    MN319/MN319-A-DL：参数`<n>`仅支持0、5、8；


    MN319-A-XL-EM：参数`<n>`仅支持0、3、5、8、20。）


    - `0`: 恢复所有BAND


    - `1`: BAND 1

    - `3`: BAND 3

    - `5`: BAND 5

    - `8`: BAND 8

    - `20`: BAND 20

    - `28`: BAND 28


    LTE制式：（注：MR880A/MR380R/MR380M：仅支持0,1,3,5,8,34,38,39,40,41。


    MF572E：仅支持1,3,5,8,34,38,39,40,41。


    MR380M最多支持配置8个BAND，如需恢复默认配置为默认值配置为0即可。）（注：ML307M/ML307N：仅支持1,3,5,8,34,39,40,41。


    ML307X/ML307Y/ML307B：仅支持0,1,3,5,8,34,38,39,40,41。


    ML307H-MU：仅支持0,3,8,34,38,39,40,41。）


    - `0`: 恢复所有BAND


    - `1`: BAND_LTE_1

    - `2`: BAND_LTE_2

    - `3`: BAND_LTE_3

    - `4`: BAND_LTE_4

    - `5`: BAND_LTE_5

    - `6`: BAND_LTE_6

    - `7`: BAND_LTE_7

    - `8`: BAND_LTE_8

    - `9`: BAND_LTE_9

    - `...`: ...

    - `64`: BAND_LTE_64


    NR制式：（注：MR880A：仅支持0,1,3,5,8,28,41,78,79。


    MF572E：仅支持1,3,5,8,28,40,41,77,78,79。


    MR380R：仅支持0,1,3,5,8,28,40,41,78。


    MR380M：仅支持0,1,3,5,8,28,41,78，最多仅支持配置8个BAND，如需恢复默认配置为默认值配置为0即可。）


    - `0`: 恢复所有BAND

    - `1`: BAND_NR_1

    - `2`: BAND_NR_2

    - `3`: BAND_NR_3

    - `4`: BAND_NR_4

    - `5`: BAND_NR_5

    - `6`: BAND_NR_6

    - `7`: BAND_NR_7

    - `8`: BAND_NR_8

    - `9`: BAND_NR_9

    - `...`: ...

    - `128`: BAND_'
  examples:
  - 'AT+MBAND=?

    +MBAND:(3,5,8)

    OK'
  source: 扩展AT用户手册 (developmentdomain/extendedatcommandusermanual/topics/r_at_mband.dita)

- cmd: AT+NSOST
  syntax: AT+NSOST=<socket>,<remote_addr>,<remote_port>,<length>,<data>[,<sequence>[,<flag>]]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NSOST 发送消息（仅限UDP）
  doc: '该命令用于发送UDP数据。


    参数：

    `<socket>`整型， 由`AT+NSOCR`返回的 socket 编号。范围：0~6。


    `<remote_addr>`字符串，IP 地址。


    `<remote_port>`整型， 接收消息的远端端口。范围：0~65535。


    `<length>`整型。表示要发送数据的十进制长度。默认最大长度为 1358 字节，实际取决于网 络下发的 MTU 值。


    `<data>`十六进制字符串。要传输的数据。


    `<sequence>`整型，数据的序列。范围：1~255。如果省略，则不会上报数据发送状态。如果不省略， 当数据通过 RF 发送或丢弃时，将上报以下结果：`+NSOSTR:<socket>,<sequence>,<status>`


    `<status>`整型， 数据报状态。


    - `0`: 错误

    - `1`: 已发送


    `<flag>`整型。指定消息传输类型。此参数的值为十六进制格式。 释放指示不支持 UP 模式。若未指定 ，则参数值将设置为 0。


    - `0x100`: 异常消息：发送具有高优先级的消息

    - `0x200`: 释放指示：指示该条消息发送后释放

    - `0x400`: 释放指示：表示收到该消息的回复后释放'
  examples:
  - 'AT+NSOST=1,192.158.5.1,1024,2,AB30,1

    1,2

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nsost.dita)

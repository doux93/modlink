- cmd: AT+MIPLNOTIFY
  syntax: AT+MIPLNOTIFY=<ref>,<mid>,<objid>,<insid>,<resid>,<type>,<len>,<value>,<index>,<flag>[,<ackid>[,<contentType>]]
  category: lwm2musermanual
  kind: command
  risk: none
  title: AT+MIPLNOTIFY 上报数据
  doc: '该命令用于向平台上报指定资源的数据。


    参数：

    `<ref>`整型，LwM2M设备实例ID。


    `<mid>`uint16类型，该resource所属的instance observe操作时下发的mid。上报时会自动搜索当前可用资源， 故置0即可。


    `<objid>`uint16类型，Object ID。


    `<insid>`uint16类型，Instance ID。


    `<resid>`uint16类型，Resource ID。


    `<type>`整型，指定上报资源的数据类型。


    - `1`: String

    - `2`: Opaque（注：Opaque类型2为透传类型，通过AT命令输入16进制字符串将被模组转换为ASCII码后上传至平台。）

    - `3`: Integer

    - `4`: Float

    - `5`: Bool

    - `6`: Hex str（注：Hex_str类型6为16进制字符串，输入的16进制将被模组转换为ASCII码后以string类型1上传至平台。）


    `<len>`整型，value的值的长度。模组会依据当前的值的范围上报报文做优化算法，无需指定`<len>`。（注：ML307C：最大长度1024字节。）


    `<value>`字符串，上报的数据值。`<value>`参数为string类型时必须两端加双引号，其他类型可选。（注：ML307C：最大传入1024字节字符串。）


    `<index>`整型，命令序号。若某个notify操作需要N条报文组合为一完整命令，则index从N-1至0降序编号，当index编号为0时表示本次notify命令结束。直接置0亦可。


    `<flag>`整型，消息标识。`<flag>`参数不为0时，当前报文暂不发送；当`<flag>`为0时，会将同一object下同一instance下的未发送resource一起组包上报。`<flag>`为0x200或0x400时为release
    indicator模式上报。此时 报文为将`<flag>`置0送并附带释放连接的功能。DTLS模式下`<flag>`不支持0x200、0x400，命令设置该值将 默认`<flag>`为0进行发送。（注：MN319/MN319-A/MR880A：不支持`<flag>`设置0x200、0x400，对以上`<flag>`值当作0处理。


    ML305A/ML307A/ML307R/ML307B/ML307C/ML307M/ML307N/ML307X/ML307Y：不支持`<flag>`设置0x200、0x400。）


    - `1`: 第一条报文

    - `2`: 中间报文

    - `0`: 最后一条报文

    - `0x200`: 发送后模组进入IDLE态

    - `0x400`: 接收到应答报文后模组进入IDLE态


    `<ackid>`uint16类型，可选参数。若被设置，平台在接收到该上报报文后将下发ACK报文。模组收到ACK报文后向MCU上报以下消息`+MIPLEVENT: <ref>,<event_id>,<ackid>`。`<ackid>`参数被设置的情况下，平台侧收
    到数据会执行ACK回复操作； 如果缺省，平台侧不会有ACK回复消息。`<ackid>`参数仅在该报文为发送报文 时(即`<flag>`为0)有效。


    `<contentType>`整型，可选参数。设置上报报文的编码格式，未设置时采用平台默认的格式。`<contentType>`参数设置后，该资源后续应保持相同的contentType类型。（注：仅TLV格式支持`<flag>`设置为'
  examples:
  - 'AT+MIPLNOTIFY=0,0,3200,0,5500,5,1,"0",2,1

    OK

    AT+MIPLNOTIFY=0,0,3200,0,5501,3,3,"-12",1,2

    OK

    AT+MIPLNOTIFY=0,0,3200,0,5750,1,4,"test",0,0

    OK

    AT+MIPLNOTIFY=0,0,3200,0,5505,2,10,"E309C82FE6",0,0x400,278

    OK

    +MIPLEVENT: 0,26,278'
  source: LwM2M用户手册 (developmentdomain/lwm2musermanual/topics/r_at_miplnotify.dita)

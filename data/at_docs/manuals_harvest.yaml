- cmd: AT+MIPOPEN
  syntax: AT+MIPOPEN=<connect_id>,<proto_type>,<address>,<remote_port>[,<timeout>[,<access_mode>[,<local_port>]]]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPOPEN 建立TCP/IP连接
  doc: '该命令用于建立TCP或UDP连接。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-EMN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。


    MR880A：范围0~9。）


    `<proto_type>`字符串，连接类型。


    - `TCP`: TCP连接

    - `UDP`: UDP连接


    `<address>`字符串，服务器地址。


    `<remote_port>`整型，服务器端口号，范围：0~65535。


    `<timeout>`整型，连接超时时间，范围：1~180；单位：s。默认值60s。（注：MN316/MN316-S/MN326：该参数不生效。）


    `<access_mode>`整型，数据收发模式，默认值0。（注：M5310-E/MN327/MN328/MN316/MN316-S/MN316A/MN326A/MN318/MN319/MN319-A/MN326：不支持`<access_mode>`=1透传模式。


    ML302A/ML305A/ML307A/ML307X/ML307Y/ML302S/ML307S/ML305U/ML305M/ML307M/ML307N/ML307R/ML307B/ML307G/MR880A/ML307H/ML307C：SSL协议数据需要解密，故流缓存模式下需要将当前数据读取完后才能收到后续数据。）


    - `0`: 普通模式（数据接收：接收到的数据加URC前缀后串口直接输出，数据发送：通过`AT+MIPSEND`命令。）

    - `1`: 透传模式（数据接收：接收到的数据串口直接输出，数据发送：输入串口的数据直接发送。）

    - `2`: 流缓存模式（TCP连接支持，数据接收：只上报数据接收提示，数据发送：同普通模式。）

    - `3`: 包缓存模式（UDP连接支持，数据接收：只上报数据接收提示，数据发送：同普通模式。）


    `<local_port>`整型，客户端端口号，范围：0~65535。默认值0。


    - `0`: 系统自动分配本地端口号

    - `1-65535`: 指定的本地端口号，建议配置5 位以上的端口且不使用特殊协议默认的端口。


    `<result>`整型，TCP、UDP连接结果。


    - `0`: 连接成功

    - `其他`: 连接失败（注：NB系列返回1；其他系列模组返回值`<err>`参考附录错误码表。）'
  examples:
  - 'AT+MIPOPEN=?

    +MIPOPEN: (0-4),,,(0-65535),(1-180),(0-3),(0-65535)

    OK'

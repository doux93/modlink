- cmd: AT+MGPIO
  syntax: AT+MGPIO=<pin>[,<control>[,<pull>]]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MGPIO 控制GPIO
  doc: '该命令用于配置GPIO模式和输出电平，读取GPIO状态。


    参数：

    `<pin>`整型，GPIO对应的模组引脚。（注：MN316/MN316-S：MN316-S-DLVS支持Pin 16和Pin 17；Pin 16默认下拉输入，Pin 17默认上拉输入。其余型号支持Pin
    34和Pin35；Pin 34默认下拉输入，Pin 35默认上拉输入。


    MN316A/MN326A：支持Pin 34和 Pin35；默认均为下拉输入。


    M5310-E：支持Pin 9、Pin 14、Pin 17、Pin20及Pin 22，默认为上拉输入。M5311-E：支持Pin 34、Pin 35。


    MN318：支持Pin11、Pin16、Pin18、Pin19、Pin33、Pin34、Pin35、Pin39、Pin40、Pin41、Pin42，默认为上拉输入。


    MN319/MN319-A：支持Pin7、Pin34、Pin35，默认下拉输入。）（注：ML302S：支持Pin2、Pin7、Pin31、Pin35、Pin 42~Pin 46。


    ML302A：支持0~14（实际pin脚为：41、42、43、44、50、51、78、89、90、91、92、96、135、136、137）。


    ML307A/ML307R-DC/ML307B/ML307R-DL/ML307M-DL/ML307M-DH：支持0~3（实际pin脚为：76、77、86、87）。


    ML307C：支持0~2（实际pin脚为76、86、87）。


    ML307M-DA：支持0、1、3 (实际pin脚为：76、77、87)。


    ML307R-BC/ML307R-BL：支持0~4。


    ML305U：支持0~15（实际pin脚为：1、2、3、4、10、14、16、56、57、60、62、63、64、65、66、67）。


    ML305M：支持1、2、7~10（实际pin脚为：10、12、63、65、66、67）。


    ML307G-DL/ML307N：支持0~3（实际pin脚为：76、77、86、87）；ML307G-BL支持0、1（实际pin脚为34、35）。


    ML307H-GU：支持0~2(实际pin脚为76、86、87)；ML307H-DU/ML307H-MU/ML307X/ML307Y：支持0~3(实际引脚为76、77、86、87)。）（注：MF308C：支持Pin153~Pin156。


    MR880A：仅支持Pin23。


    MF572E：仅支持Pin0~Pin24。


    MR380M：支持Pin0~Pin6。


    MR380R：支持Pin0~Pin14。）


    `<control>`整型，引脚控制。（注：MR880A：仅支持1、2。）


    - `0`: 读取输入

    - `1`: 输出低电平

    - `2`: 输出高电平

    - `3`: 高阻态（注：MN316/MN316-S/MN316A/MN326A/M5311-E/MN319/MN319-A：不支持。）（注：ML302S/ML302A/ML307A/ML307R/ML307C/ML305M/ML307G/ML307H/ML307X/ML307Y/ML307M/ML307N：不支持。）（注：MF308C/MF572E/MR380M/MR380R：不支持。）


    `<pull>`整型，引脚模式，默认值0。（注：MN316-S：MN316-S-DLVS的Pin 16不支持2，Pin 17不支持1。


    MN316：Pin 34不支持2，Pin 35不支持1。


    M5311-E：'
  examples:
  - 'AT+MGPIO=?

    +MGPIO: (0-49),(0-3),(0-2)

    OK'

  doc: '该命令用于设置客户端实例相关的通用配置参数。


    参数：

    `<cmd>`命令标识符。（注：MN318/MN328/ML307H-GU：不支持"ssl"设置，不支持ssl加密传输。


    MN316/MN326：不支持"cid"设置。


    MN327：不支持"ssl"设置。


    MN319/MN319-A/MN316A/MN326A/M5310-E：不支持"ssl"和"cid"设置，不支持ssl加密传输。）


    目前仅ML307B支持"wtcp"设置。


    - `header`: 通用报头设置，应用于实例生命周期，设置时需按`key: value`的形式分字段进行设置，模组会保存所有设置字段。

    - `chunked`: 传输模式设置。普通模式（Content-Length模式）与Chunked模式的使用流程存在差异。普通模式先设置content数据，后发送请求；Chunked模式先发送请求，后设置content数据。


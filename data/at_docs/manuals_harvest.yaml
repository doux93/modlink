- cmd: AT+MAUDRECFILE
  syntax: AT+MAUDRECFILE=?
  category: audiousermanual
  kind: command
  risk: none
  title: AT+MAUDRECFILE 录制音频文件
  doc: '该命令用于录制音频文件。


    参数：

    `<filename>`字符串，录音文件保存的文件名（最大长度64字节；不带文件格式后缀，例如：`AT+MAUDRECFILE="test"`；仅使用文件名，不带路径，录音完成的文件保存在“/audio/”路径下，例如：“/audio/test.amr”）。


    `<state>`整型，录音状态。


    - `0`: 空闲

    - `1`: 正在录音

    - `2`: 录音完成

    - `3`: 录音中断（异常中断）


    `<file/path>`字符串，录音文件路径及文件名。


    `<file/size>`整型，录音文件大小。'

- cmd: AT+MIPMODE
  syntax: AT+MIPMODE=<connect_id>[,<access_mode>[,<packet_size>,<waittm>]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPMODE 切换数据模式
  doc: '该命令用于切换已有连接的数据模式。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-E/MN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。


    MR880A：范围0~9。）


    `<access_mode>`整型，数据收发模式，默认值由`AT+MIPOPEN`命令中的参数`<access_mode>`配置。（注：MN316/MN316-S/MN316A/MN326A/MN318/MN319/MN319-A/MN326/M5310-E/MN327/MN328：暂不支持透传模式。）


    - `0`: 普通模式（数据接收：接收到的数据加URC前缀后串口直接输出，数据发送：通过`AT+MIPSEND`命令。）

    - `1`: 透传模式（数据接收：接收到的数据串口直接输出，数据发送：输入串口的数据直接发送。）

    - `2`: 流缓存模式（TCP连接支持，数据接收：只上报数据接收提示，数据发送：同普通模式。）

    - `3`: 包缓存模式（UDP连接支持，数据接收：只上报数据接收提示，数据发送：同普通模式。）


    `<packet_size>`整型，透传模式下，指定单次发送的最大数据长度，范围：512~1460；单位：字节。默认值1024。（注：ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML305U/ML305M/ML307M/ML307N/ML307R/ML307C/ML307X/ML307Y：不支持配置。）


    `<waittm>`整型，透传模式下，传入数据未达到`<packet_size>`指定长度时，超过`<waittm>`时间后直接发送，范围：0~2000；单位：ms。默认值200。（注：ML302A/ML305A/ML307A/ML302S/ML307S/ML307G/ML305U/ML305M/ML307M/ML307N/ML307R/ML307C/ML307X/ML307Y：不支持配置。）'
  examples:
  - 'AT+MIPMODE=?

    +MIPMODE: (0-4),(0-3),(512-1460),(100-2000)

    OK'
  source: TCP/IP用户手册 (developmentdomain/tcp_ipusermanual/topics/r_at_mipmode.dita)

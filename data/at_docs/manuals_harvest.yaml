- cmd: AT+MHTTPDLFILE
  syntax: AT+MHTTPDLFILE=<url>,<local_path>[,<progind>[,<range>[,<eof>[,<ssl_id>]]]]
  category: http_httpsusermanual
  kind: command
  risk: none
  title: AT+MHTTPDLFILE HTTP下载文件
  doc: '该命令用于下载数据到文件系统，无需创建实例。


    参数：

    `<url>`资源路径，包含host、端口以及path，例如 "http://example.com/abc.txt"或"http://example.com:8080/abc.txt"。（注：ML307G：如果没有指定https或者http，则默认https。）


    `<local_path>`本地文件路径，长度范围与文件系统相关。（注：ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML307R/ML307B/ML307C/MR380R/MR380M：若`<local_path>`第一位为正斜杠("/")则将下载文件存储在用户输入的路径下，否则将下载文件存储在`/etc/http_file/`路径下。


    ML305U/ML305M/ML307X/ML307Y：若`<local_path>`仅含有正斜杠("/")则将下载文件存储在用户输入的路径下，若`<local_path>`仅含有反斜杠("\")或者不包含斜杠则将下载文件存储在`/etc/http_file/`路径下。）


    `<progind>`下载进度上报提示长度，下载的数据每达到指定长度时上报一次进度提示URC，默认值0，不上报中间进度，只上报最后结果。


    `<range>`资源下载范围（需服务器支持），参考RFC2616关于Range字段的说明，字符串格式，如"bytes=500-900"代表传输文件的第500到900，共401字节。


    `<eof>`文件写入方式，默认值0。（注：当`<range>`不设置时，`<eof>`设置为1时，模组内部将自动实现断点续传，即如下载过程异常中断，下一次请求同一文件时，模组内部将继续下载上次内容之后的数据。如果文件已下载完成，请不要按此方式重复下载，否则可能导致下载异常，可删除文件后或按覆盖方式下载。使用断点续传功能之前，请确保已下载的数据是从第一位开始下载的。）


    - `0`: 覆盖方式写入（清空当前文件后写入）

    - `1`: 追加方式写入（在当前文件尾继续写入）


    `<ssl_id>`SSL上下文索引号，指定当前实例使用的SSL上下文，范围可参见文档《SSL用户手册》，该参数不设置时，不使能SSL，设置时即使能SSL。（注：ML302A/ML305A/ML307A/ML307G/ML307S/ML305U/ML305M/ML307R/ML307B/ML307C/ML307X/ML307Y：`<ssl_id>`参数范围0~5。）


    `<downloaded>`已下载长度。


    `<content_length>`本次下载总长度，如果请求响应为Chunked模式，中间结果上报时将显示为0。


    `<percent>`下载进度百分比，如果请求响应为Chunked模式，中间结果上报时将显示为0，传输完成时提示100。


    `<entity_length>`下载文件的总长度，当指定`<range>`且服务器回复Content-Range字段时有效。'
  examples:
  - 'AT+MHTTPDLFILE="http://120.27.12.119:10080/get","/test.txt"

    OK

    +MHTTPURC: "header",0,200,225,HTTP/1.1 200 OK

    Server: nginx/1.18.0

    Date: Wed, 28 Jul 2021 02:46:45 GMT

    Content-Type: application/json

    Content-Length: 145

    Connection: keep-alive

    Access-Control-Allow-Origin: *

    Access-Control-Allow-Credentials: true

    +MHTTPDLFILE: 145,145,100'
  source: HTTP/HTTPS用户手册 (developmentdomain/http_httpsusermanual/topics/r_at_mhttpdlfile.dita)

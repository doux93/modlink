- cmd: AT+CSCON
  syntax: AT+CSCON=<n>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CSCON 信令链接状态
  doc: '该命令用户查询当前的信令连接状态。


    参数：

    `<n>`整型，禁止或使能连接状态上报。默认值0。


    - `0`: 禁止状态上报。

    - `1`: 使能状态上报：`+CSCON: <mode>`。

    - `2`: 使能状态上报：`+CSCON: <mode>[,<state>]`。

    - `3`: 使能状态上报：`+CSCON:<mode>[,<state>[,<access>]]`。


    `<mode>`整型。表示信令连接状态。


    - `0`: 空闲

    - `1`: 已连接


    `<state>`整型，指示连接态时MT的状态。当前模组固定返回7。


    - `0`: UTRAN URA_PCH 状态

    - `1`: UTRAN Cell_PCH 状态

    - `2`: UTRAN Cell_FACH 状态

    - `3`: UTRAN Cell_DCH 状态

    - `4`: GERAN CS 已连接状态

    - `5`: GERAN PS 已连接状态

    - `6`: GERAN CS 和 PS 已连接状态

    - `7`: E-UTRAN 已连接状态

    - `8`: NG-RAN 已连接状态

    - `9`: NG-RAN 非活动状态


    `<access>`整型，指示当前无线电接入类型。当前模组固定返回4。


    - `0`: GERAN

    - `1`: UTRAN TDD

    - `2`: UTRAN FDD

    - `3`: E-UTRAN TDD

    - `4`: E-UTRAN FDD

    - `5`: NR'
  examples:
  - 'AT+CSCON=1

    OK

    AT+CSCON?

    +CSCON:1,1

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cscon.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cscon.dita)
  variants: []
  topic_id: 5ff6d47f9810b921

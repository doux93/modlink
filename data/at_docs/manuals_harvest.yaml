- cmd: AT+MAGNSSREFLOC
  syntax: AT+MAGNSSREFLOC=<ref_latitude>,<ref_longtitude>[,<mode>]
  category: gnssusermanual
  kind: command
  risk: none
  title: AT+MAGNSSREFLOC 参考坐标设置
  doc: '该命令用于设置UE辅助定位的参考坐标。


    参数：

    `<ref_latitude>`浮点型，北纬。-90至90，单位度，小数点后超过8位会导致精度丢失。


    `<ref_longtitude>`浮点型，东经。-180至180，单位度,小数点后超过8位会导致精度丢失。


    `<mode>`整型，模式。（注：MF308C：仅支持`<mode>`参数为2。）（注：ML302A/ML307A/ML307C/ML307N：仅支持`<mode>`参数为2。）


    - `0`: 单次有效（辅助定位成功后自动清除）

    - `1`: 持续有效（辅助定位成功后不清除）

    - `2`: 允许UE根据位置信息自动更新'
  examples:
  - 'AT+MAGNSSREFLOC=90,90

    OK'

- cmd: AT+MDMPCFGEX
  syntax: AT+MDMPCFGEX="url"[,<host>,<port>]
  category: operator_self_registration_usermanual
  kind: command
  risk: none
  title: AT+MDMPCFGEX 配置移动DM平台扩展参数
  doc: '配置和查询CMDMP所需的扩展信息，配置成功后，重启生效。


    参数：

    `<cmd>`字符串，命令标识符。（注：MN316/MN316-S/MN319/MN319-A/MN318/MN316A/MN326A/MN326/ML305M/ML307M/ML307H/MR880A/ML307X/ML307Y/ML307N/ML307B：不支持"app"参数。）


    - `url`: 服务器地址和端口

    - `app`: 应用信息

    - `hw`: 硬件信息

    - `sw`: 软件信息

    - `net`: 网络信息

    - `prod`: 产品信息

    - `dev`: 外设信息


    `<host>`字符串型，CMDMP服务器IP地址或域名地址，最大字符串长度为48字节，默认地址为“m.fxltsbl.com”。


    `<port>`整型，CMDMP服务器端口，默认端口为5683。


    `<appInfo>`字符串型，表示终端应用程序信息，最大字符串长度为255字节。它是应用程序信息的集合，每个信息块用分号分隔，内容包含应用程序名称、包名称、应用程序使用时间（单位：毫秒）、应用程序打开次数，并且每部分内容以“|”分隔。如果没有相关信息，请将其设置为"NULL"。


    `<tmType>`终端类型，默认值0。（注：MF572E中该参数默认值为1。）


    - `0`: 接口

    - `1`: Linux

    - `2`: Android


    `<mac>`字符串型，表示终端的MAC地址，最大字符串长度为48字节。


    `<cpu>`字符串型，表示终端的CPU信息，最大字符串长度为16字节。


    `<ram>`字符串型，表示终端的RAM信息，最大字符串长度为8字节。


    `<rom>`字符串型，表示终端的ROM信息，最大字符串长度为8字节。


    `<gpu>`字符串型，表示终端的GPU信息，最大字符串长度为16字节。


    `<board>`字符串型，表示终端的主板信息，最大字符串长度为16字节。


    `<osver>`字符串型，表示终端操作系统版本，最大字符串长度为16字节。


    `<firmver>`字符串型，表示终端的固件版本，最大字符串长度为16字节。


    `<firmName>`字符串型，表示终端的固件名称，最大字符串长度为16字节。


    `<nettype>`字符串型，表示终端网络类型，最大字符串长度为16字节。


    `<volte>`字符串型，表示终端VoLTE状态，最大字符串长度为8字节。


    `<phonenum>`字符串型，表示终端的电话号码，最大字符串长度为16字节。


    `<account>`字符串型，表示终端的宽带信息，最大字符串长度为16字节。


    `<location>`字符串型，表示终端的位置信息，最大字符串长度为16字节。


    `<rtMac>`字符串型，表示终端路由MAC信息，最大字符串长度为48字节。


    `<btMac>`字符串型，表示终端蓝牙MAC信息，最大字符串长度为48字节。


    `<brand>`字符串型，表示终端品牌信息，最大字符串长度为16字节。


    `<model>`字符串型，表示终端型号信息，最大字符串长度为32字节。


    `<tmplid>`字符串型，表示终端模板ID信息，最大字符串长度为16字节。


    `<batcap>`字符串型，表示终端电池容量信息，最大字符串长度为16字节。


    `<scrnsz>`字符串型，表示终端屏幕大小信息，最大字符串长度为16字节。


    `<resolution>`字符串型，表示终端屏幕分辨率信息，最大字符串长度为16字节。


    `<wearing>`整型'

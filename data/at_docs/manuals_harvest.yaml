- cmd: AT+MFPUT
  syntax: AT+MFPUT=<fname>,<fsize>[,<data>]
  category: filesystemusermanual
  kind: command
  risk: none
  title: AT+MFPUT 上传文件
  doc: '该命令用于直接写入数据到文件，文件不存在时直接创建，文件存在时将删除后创建。


    参数：

    `<fname>`字符串型，文件名，最大128字节。（注：ML302A-DCLM/ML302A-GCLM/ML305A-DC/ML305A-DL/ML307A-DCLN/ML307A-GCLN/ML307A-DL/ML307R/ML307C：最大96字节。


    ML305U：路径长度最大为128字节，但目录长度和文件名长度最大为63字节。


    ML307B：最大64字节，仅支持最多三层目录结构（包含根目录）。


    ML307N: 文件系统不支持同目录下相同命名的文件和文件夹。）


    `<fsize>`整型，待写入数据大小，单位：字节。


    `<data>`字符串型，待写入数据，数据格式受`AT+MFCFG`命令影响。


    `<upload_size>`整型，实际写入数据长度，单位：字节。'
  examples:
  - 'AT+MFPUT="/usr/test/2/3.txt",10,"1234567890"

    +MFPUT: 10

    OK


    AT+MFPUT="/usr/test/2/3.txt",0

    >

    1234567890 //写入数据

    +MFPUT: 10

    OK'

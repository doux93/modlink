- cmd: AT+NMSTATUS
  syntax: AT+NMSTATUS=?
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NMSTATUS 消息注册状态
  doc: '该命令用于查询注册状态。


    参数：

    `<registration_status>`字符串型。当前注册状态。


    - `UNINITIALISED`: 未初始化

    - `MISSING_CONFIG`: 配置丢失

    - `INIITIALISING`: 初始化中

    - `INIITIALISED`: 初始化完成

    - `INIT_FAILED`: 初始化失败

    - `REGISTERING`: 注册中

    - `REGISTERED`: 已注册

    - `DEREGISTERED`: 已注销

    - `SUBSCRIBING`: 订阅中

    - `MO_DATA_ENABLED`: 使能数据发送

    - `NO_UE_IP`: 无UE IP

    - `REJECTED_BY_SERVER`: 服务器拒绝

    - `TIMEOUT_AND_RETRYING`: 超时并重试

    - `REG_FAILED`: 注册失败

    - `DEREG_FAILED`: 注销失败'

- cmd: AT+QSETBSPSK
  syntax: AT+QSETBSPSK=<pskid>,<psk>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+QSETBSPSK 配置PSK ID和PSK到Bootstrap
  doc: '该命令用于配置Bootstrap服务器的PSK。


    参数：

    `<pskid>`PSK 索引。十进制数字。固定长度为 15 位数。该值必须和设备 IMEI 值相同。另外， 该值也必须和 LwM2M 物联网平台设置的值保持一致。若`<pskid>`被设置为 0，则
    IMEI 被用作 PSKID。


    `<psk>`预置密钥，固定长度为 16 字节的十六进制数字，需和 LwM2M 物联网平台保持一致 。'
  examples:
  - 'AT+QSETBSPSK=201703230000024,0123456789ABCDEF0123456789ABCDEF

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_qsetbspsk.dita)
  models:
  - MN328
  - MN328-BX
  sources:

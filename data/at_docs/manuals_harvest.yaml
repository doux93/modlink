- cmd: AT+MBLEADVCFG
  syntax: AT+MBLEADVCFG=<adv_int_min>,<adv_int_max>,<adv_type>,<own_addr_type>,<channel_map>[,<adv_filter_policy>[,<peer_addr_type>,<peer_addr>]]
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEADVCFG 设置BLE广播参数
  doc: '该命令用于设置BLE广播功能相关参数（从机端）。


    参数：

    `<adv_int_min>`整型，最小广播间隔，单位timeslot (1 timeslot=625μs)，范围32~16384，对应的时间范围20ms~10.24s。不能大于最大间隔，初始默认值0x800，1.28s。


    `<adv_int_max>`整型，最大广播间隔，单位timeslot (1 timeslot=625μs)，范围32~16384，对应的时间范围20ms~10.24s。初始默认值0x800，1.28s。


    `<adv_type>`整型，广播类型，初始默认值0。（注：`<adv_type>`为1或4时，`<adv_filter_policy>`悬空不设置，或设置无效，`<peer_addr_type>`、`<peer_addr>`必须设置；`<adv_type>`为其他值时，`<peer_addr_type>`、`<peer_addr>`不设置，或设置无效；`<adv_type>`为1时，`<adv_int_min>`、`<adv_int_max>`设置无效，间隔固定3.75ms，并且广播时长最大1.28s（高占空比定向广播类型有特殊的时序要求）。）


    - `0`: 可连接可扫描非定向广播

    - `1`: 可连接的定向广播（高占空比）

    - `2`: 可扫描的非定向广播

    - `3`: 不可连接的非定向广播

    - `4`: 可连接的定向广播（低占空比）


    `<own_addr_type>`整型，本地地址类型，初始默认值0。（注：M5310-E/MN318：目前只支持设置0和2。）


    - `0`: 未加密公用设备地址（Public Address）

    - `1`: 未加密随机设备地址（Random Device Address）

    - `2`: 加密公用设备地址（RPA Public Address）（注：ML302/ML305不支持该参数。）

    - `3`: 加密随机设备地址（RPA Random Device Address）（注：ML302/ML305不支持该参数。）


    `<channel_map>`整型，使用的广播信道，3bit位分别指示3个信道，可组合使用，初始默认值7。


    - `Bit0`: 广播信道37

    - `Bit1`: 广播信道38

    - `Bit2`: 广播信道39


    `<adv_filter_policy>`整型，过滤规则，缺省默认为0。


    - `0`: 允许任意设备扫描和连接。

    - `1`: 允许白名单设备扫描，允许任意设备连接。

    - `2`: 允许任意设备扫描，只允许白名单设备连接。

    - `3`: 只允许白名单设备扫描和连接。


    `<peer_addr_type>`整型，对方BLE地址类型。


    - `0`: 公用设备地址（Public Address）

    - `1`: 随机设备地址（Random Address）


    `<peer_addr>`6字节十六进制字符串，对方BLE地址，"xx:xx:xx:xx:xx:xx"格式。'
  examples:
  - 'AT+MBLEADVCFG=50,50,0,0,4,0,0,"12:34:45:78:66:88"

    OK'

- cmd: AT+MTTSCFG
  syntax: AT+MTTSCFG="encoding"[,<encoding>]
  category: audiousermanual
  kind: command
  risk: none
  title: AT+MTTSCFG TTS通用设置
  doc: '该命令用于设置TTS相关的通用配置参数。


    参数：

    `<cmd>`字符串，命令标识符。


    - `encoding`: 中文文本编码方式

    - `rdn`: 数字播放模式

    - `speed`: TTS转换时语速

    - `pitch`: 音调

    - `volume`: TTS转换时音量

    - `voice`: 发音人音效

    - `channel`: 播放通道

    - `oauth`: 在线TTS认证URL/key/秘钥


    `<encoding>`整型，中文文本编码方式（baidu/阿里云/腾讯云等在线TTS默认为UTF-8编码）。（注：ML305A/ML302A/ML307A在线TTS仅支持百度，文本模式仅支持汉字为UTF-8格式，其它配置无效。


    ML305A/ML302A/ML307A讯飞离线TTS中文本模式仅支持汉字为UTF-8格式，其它配置无效。


    ML307N-DC/ML307N-GC讯飞离线TTS中文本模式支持汉字为UTF-8格式、GBK格式，其它配置无效。）


    - `0`: 文本模式（普通字符为ASCII格式，汉字为UCS2编码格式）

    - `1`: 文本模式（普通字符为ASCII格式，汉字为GBK格式）

    - `2`: 文本模式（普通字符为ASCII格式，汉字为UTF-8格式）

    - `3`: 文本模式（普通字符为ASCII格式，汉字为GB2312格式）


    `<rdn>`整型，数字播放模式，默认为0。（注：百度在线TTS，仅支持自动模式，其它配置无效；


    讯飞离线TTS，支持自动模式、完全数值模式和数字字符串，不支持数字字符串优先。）


    - `0`: 自动模式

    - `1`: 完全数值模式，123读一百二十三。

    - `2`: 数字字符串，123读一二三。

    - `3`: 数字字符串优先


    `<speed>`整型，语速，范围：0~15。（注：ML305A/ML302A/ML307A讯飞离线TTS 转换时语速配置对于英文字母播放无效。


    ML307N-DC/ML307N-GC讯飞离线TTS默认为8，语速配置对于英文字母播放无效。）


    `<pitch>`整型，音调，范围：0~15。（注：ML305A/ML302A/ML307A讯飞离线TTS不支持该项配置。


    ML307N-DC/ML307N-GC讯飞离线TTS支持该配置，默认为8，音调配置对于英文字母播放无效。）


    `<volume>`整型，TTS转换时音量，范围：0~15。（注：ML307N-DC/ML307N-GC：讯飞离线TTS默认为8 。）


    `<voice>`整型，发音人音效。（注：离线TTS版本不支持该项配置。）


    - `0`: 度小美

    - `1`: 度小宇

    - `2`: 度小宇

    - `3`: 度逍遥

    - `4`: 度丫丫


    `<channel>`整型，播放通道。（注：ML305A/ML302A/ML307A/ML307N-DC/ML307N-GC：仅支持扬声器通道，其他配置无效。）


    - `0`: 听筒

    - `1`: 耳机

    - `2`: 扬声器

    - `3`: 远端（通话过程中在对端播放）


    `<url>`字符串，在线TTS认证URL。（注：ML305A/ML302A/ML307A在线TTS仅支持百度，配置其他url无效，可省略该参数。）


    `<appKey>`字符串，在线TTS认证apiKey。


    `<appSecret>`字符串，在线TTS认证秘钥。'
  examples:
  - 'AT+MTTSCFG=?

    +MTTSCFG: "encoding",2

    +MTTSCFG: "rdn",0

    +MTTSCFG: "speed",(0-15)

    +MTTSCFG: "pitch",(0-15)

    +MTTSCFG: "volume",(0-15)

    +MTTSCFG: "voice",(0-4)

    +MTTSCFG: "channel",2

    +MTTSCFG: "oauth",,

    OK'

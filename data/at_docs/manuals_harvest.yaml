- cmd: AT+MPDSREGCFG
  syntax: AT+MPDSREGCFG="url"[,<url>]
  category: operator_self_registration_usermanual
  kind: command
  risk: none
  title: AT+MPDSREGCFG 电信自注册参数配置
  doc: '配置电信物联网自注册参数，配置成功后，重启生效。


    参数：

    `<cmd>`命令标识符。（注：MN316/MN316-S/ML307X/ML307Y：不支持tmodel、tswver、tuetype、tmacid、tosver、timei、tstate。）


    - `url`: 服务器地址

    - `meid`: 模组串号

    - `model`: 模组型号

    - `swver`: 模组软件版本号

    - `tmodel`: 终端型号

    - `tswver`: 终端软件版本号

    - `tuetype`: 终端类型

    - `tmacid`: 终端Mac地址

    - `tosver`: 终端操作系统版本号

    - `timei`: 终端IMEI号

    - `state`: 模组电信自注册状态

    - `tstate`: 终端电信自注册状态


    `<url>`字符串型，最大长度64，电信自注册服务器地址。模组默认地址为“http://zzhc.vnet.cn:9999/”，终端默认地址为“http://zzhc.vnet.cn:9998/”。


    `<meid>`字符串型，最大长度32，表示模组串号。如果没有相关信息，请将其设置为"NULL"。


    `<model>`字符串型，最大长度20，表示模组型号。如果没有相关信息，请将其设置为"NULL"。


    `<swver>`字符串型，最大长度60，表示模组的软件版本号。如果没有相关信息，请将其设置为"NULL"。


    `<tmodel>`字符串型，最大长度20，表示终端型号。该选项为终端自注册必须参数。


    `<tswver>`字符串型，最大长度60，表示终端软件版本号。该选项为终端自注册必须参数。


    `<tuetype>`字符串型，最大长度4，表示终端类型。默认为99。


    `<tmacid>`字符串型，最大长度48，终端Mac地址。如果没有相关信息，请将其设置为"NULL"。


    `<tosver>`字符串型，最大长度32，终端操作系统版本号。如果没有相关信息，请将其设置为"NULL"。


    `<timei>`字符串型，最大长度15，终端IMEI号。如果没有相关信息，请将其设置为"NULL"。


    `<state>`整型。模组电信自注册状态。


    - `0`: 初始状态

    - `1`: 注册中

    - `2`: 注册成功

    - `3`: 注册失败


    `<tstate>`整型。终端电信自注册状态。


    - `0`: 初始状态

    - `1`: 注册中

    - `2`: 注册成功

    - `3`: 注册失败


    `<iccid>`ICCID号。


    > 注意：ML305U/ML551Z/ML305M/MR880A/ML307H/ML307M/MF572E/ML307N/ML307C：不支持此命令。'
  examples: []

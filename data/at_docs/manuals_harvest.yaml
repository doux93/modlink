- cmd: AT+NCONFIG
  syntax: AT+NCONFIG=<function>,<value>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NCONFIG 配置UE行为
  doc: '该命令用于配置UE。


    参数：

    `<function>`字符串， 要配置的 UE 功能 。


    - `AUTOCONNECT`: 控制 UE 在开机或重启后是否会自动尝试连接 网络。当启用此功能时，它将设置`AT+CFUN=1`并从 USIM 中读取 PLMN。并且将使用网络提 供的 APN。

    - `COMBINE_ATTACH`: 联合附着

    - `CELL_RESELECTION`: 小区重选

    - `ENABLE_BIP`: 启用/禁用 BIP

    - `MULTITONE`: 多路

    - `NAS_SIM_POWER_SAVING_ENABLE`: USIM 卡省电模式

    - `BARRING_RELEASE_DELAY`: 从禁止开始延时释放的时间。范围：0~1800。 单位：秒。

    - `RELEASE_VERSION`: 发布版本。仅支持版本 R13、R14、R15。当 UE 不使用功率等级 6 时应设置为 13。

    - `RPM`: RPM。如果 USIM 上存在 RPM 文件，USIM 设置将具有优先权。

    - `SYNC_TIME_PERIOD`: 来自 eNB 的同步时间周期。范围：0~65535。 单位：分钟。0 表示关闭时间同步。

    - `IPV6_GET_PREFIX_TIME`: 设置获取 IPv6 前缀的最长时间。范围： 0~65535。单位：秒。0 表示立即获取 IPv6 前 缀，65535 表示不获取 IPv6 前缀。

    - `NB_CATEGORY`: 配置 NB-IoT 类别。目前只支持 1 和 2。

    - `RAI`: 启用/禁用 RAI，不支持 UP 模式。

    - `HEAD_COMPRESS`: 头压缩。

    - `RLF_UPDATE`: “FALSE”表示当无线链路失败时，NAS 将立 即 TAU。“TRUE”表示当无线链路失败时， 在 TAU 之前期望会发出 ACK。

    - `CONNECTION_REESTABLISHMENT`: 启用/禁用 CP 重建连接。

    - `TWO_HARQ`: 双 HARQ

    - `PCO_IE_TYPE`: PCO 类型。支持"PCO"和"EPCO"。

    - `T3324_T3412_EXT_CHANGE_REPORT`: 启用/禁用当`<Active-Time>`和/或`<Periodic-TAU>`的 NAS 计时器更改时，`AT+CEREG=5`的
    URC 显示。

    - `NON_IP_NO_SMS_ENABLE`: TRUE”表示`<PDP_type>`为 Non-IP 时，不 支持 SMS。

    - `SUPPORT_SMS`: 启用/禁用 SMS。

    - `HPPLMN_SEARCH_ENABLE`: 启用/禁用 HPPLMN 搜索。

    - `SINR_MEAS_CONTROL`: SINR 测量控制

    - `RELAXED_MONITORING`: 轻松监控

    - `ALL_R14_FEATURES`: 启用/禁用所有 R14 特性。

    - `ALL_R15_FEATURES`: 启用/禁用所有 R15 特性。

    - `OTDOA_ENABLE`: 启用/禁用 OTDOA。

    - `PS_DATA_OFF`: 开启/关闭 PS Data Off。

    - `POWER_OFF_GUARD_TIME`: 设置关机保护时间。单位：秒，默认值：10； 范围：10~85。

    - `SUSPEND_UICC`: 启用/禁用 UICC 挂起。


    `<value>`配置的 UE 功能值 。 与`<function>`对应的值如'
  examples:
  - 'AT+NCONFIG?

    +NCONFIG:AUTOCONNECT,TRUE

    +NCONFIG:CR_0354_0338_SCRAMBLING,TRUE

    +NCONFIG:CR_0859_SI_AVOID,TRUE

    +NCONFIG:COMBINE_ATTACH,FALSE

    +NCONFIG:CELL_RESELECTION,TRUE

    +NCONFIG:ENABLE_BIP,FALSE

    +NCONFIG:MULTITONE,TRUE

    +NCONFIG:NAS_SIM_POWER_SAVING_ENABLE,TRUE

    +NCONFIG:BARRING_RELEASE_DELAY,64

    +NCONFIG:RELEASE_VERSION,14

    +NCONFIG:RPM,FALSE

    +NCONFIG:SYNC_TIME_PERIOD,0

    +NCONFIG:IPV6_GET_PREFIX_TIME,15

    +NCONFIG:NB_CATEGORY,2

    +NCONFIG:RAI,TRUE

    +NCONFIG:HEAD_COMPRESS,FALSE

    +NCONFIG:RLF_UPDATE,TRUE

    +NCONFIG:CONNECTION_REESTABLISHMENT,TRUE

    +NCONFIG:TWO_HARQ,TRUE

    +NCONFIG:PCO_IE_TYPE,EPCO

    +NCONFIG:T3324_T3412_EXT_CHANGE_REPORT,FALSE

    +NCONFIG:NON_IP_NO_SMS_ENABLE,FALSE

    +NCONFIG:SUPPORT_SMS,FALSE

    +NCONFIG:HPPLMN_SEARCH_ENABLE,TRUE

    +NCONFIG:SINR_MEAS_CONTROL,TRUE

    +NCONFIG:RELAXED_MONITORING,TRUE

    +NCONFIG:ALL_R14_FEATURES,TRUE

    +NCONFIG:ALL_R15_FEATURES,FALSE

    +NCONFIG:OTDOA_ENABLE,TRUE

    +NCONFIG:PS_DATA_OFF,TRUE

    +NCONFIG:POWER_OFF_GUARD_TIME,10

    +NCONFIG:SUSPEND_UICC,FALSE

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nconfig.dita)

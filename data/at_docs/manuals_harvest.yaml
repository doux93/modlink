- cmd: AT+MQTTCFG
  syntax: AT+MQTTCFG="version",<connect_id>[,<version>]
  category: mqttusermanual
  kind: command
  risk: none
  title: AT+MQTTCFG 配置连接参数
  doc: '该命令用于配置或查询MQTT参数，使用时应注意参数范围。模组掉电后配置参数不保存。


    参数：

    `<connect_id>`整型，MQTT客户端标识ID。范围：0~5。（注：MN316A/MN326A/MN319/MN319-A范围：0~2。）


    `<version>`整型，MQTT协议版本。默认值4。（注：当前仅支持`<version>`=4（MQTT协议v3.1.1）。）


    - `3`: MQTT协议v3.1

    - `4`: MQTT协议v3.1.1


    `<cid>`整型，MQTT客户端待使用PDP，范围与平台相关，默认不指定。（注：MN316/MN316A/MN326A/MN318/MN319/MN319-A/MN326/MR880A/M5310-E/MN327/MN328：不支持该参数配置。


    ML302A/ML305A/ML307A/ML302S/ML307S/ML307R/ML307C范围：1~15，默认值1。


    ML307B范围 0~4，默认值0。


    ML307G/ML307H范围：1~5，默认值1。


    ML305U范围：1~7，默认值1。


    ML305M/ML307M/ML307N范围：1~8，默认不指定，指定时需保证支持cid已激活。


    ML307X/ML307Y范围：1~15，默认不指定，指定时需保证支持cid已激活。


    MR380M范围：2~10，默认值2。）


    `<ssl_enable>`整型，配置MQTT SSL模式。默认值0。（注：MN316A/MN326A/MN318/MN319/MN319-A/M5310-E/MN327/MN328/ML307H-GU：不支持该参数配置。）


    - `0`: 使用普通TCP连接

    - `1`: 使用SSL TCP连接


    `<ssl_id>`整型，SSL上下文索引，范围可参见文档《SSL用户手册》。（注：MN316A/MN326A/MN318/MN319/MN319-A/M5310-E/MN327/MN328/ML307H-GU：不支持该参数配置。


    ML302A/ML305A/ML307A/ML302S/ML307S/ML305U/ML307R/ML307B/ML307C/ML305M/ML307G/MR880A/ML307H-DU/ML307H-MU/ML307M/ML307N/ML307X/ML307Y范围：0~5。）


    `<keepalive_time>`整型，保活时间。范围：0或60~65535；默认值120；单位：s。服务器会根据该参数定义从客户端接收消息的最大间隔时间，不同服务器由于内部机制不同，该时间的设置规则也会不同，若服务器超过最大间隔时间仍未从客户端收到消息，则默认客户端发送了
    DISCONNECT消息，因此服务器会断开客户端连接。


    - `0`: 标识不断开连接

    - `≥60`: 保活时间


    `<clean_session>`整型，配置会话类型。默认值0。


    - `0`: 服务端必须根据当前的会话状态恢复与客户端的通信

    - `1`: 服务端必须清除之前的会话启动一个新的会话与客户端通信


    `<retrans_interval>`整型，数据包重传初始间隔时间。范围：20~60；单位：s。默认值20。每次传输超时的总时间为`<retrans_interval>`*（2^<retry_times>+1-1）。


    `<retry_times>`整型，数据包传输超时后重发次数。范围：0~3，默认值0，重传时模组自动填充`<dup>`重传标志。


    `<will_flag>`整型，'
  examples:
  - 'AT+MQTTCFG="pingresp",1,1

    OK

    AT+MQTTCFG="encoding",0

    +MQTTCFG: "encoding",0,0

    OK'

- cmd: AT+NSOSTF
  syntax: AT+NSOSTF=<socket>,<remote_addr>,<remote_port>,<flag>,<length>,<data>[,<sequence>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NSOSTF 发送带标志的消息（仅限UDP）
  doc: '该命令用于发送带标记的UDP数据。


    参数：

    `<socket>`整型， 由`AT+NSOCR`返回的 socket 编号。范围：0~6。



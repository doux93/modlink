- cmd: AT+HRCOAPNEW
  syntax: AT+HRCOAPNEW=<host>,<port>[,<dtls_enable>]
  category: custom_coapusermanual
  kind: command
  risk: none
  title: AT+HRCOAPNEW 创建CoAP设备
  doc: '该命令用于创建CoAP设备实例。


    参数：

    `<host>`字符串，服务器地址或域名。


    `<port>`整型，服务器端口号。


    `<dtls_enable>`整型，是否建立DTLS加密连接。


    - `0`: 明文模式

    - `1`: DTLS加密模式


    `<err>`错误码，详见附录。'
  examples:
  - '//明文

    AT+HRCOAPNEW="223.240.117.24",5706

    +HRCOAPNEW:0 //创建成功

    OK


    //DTLS加密

    AT+HRCOAPNEW="223.240.117.24",5704,1 //DTLS加密前需使用HRCOAPSETPSK设置密钥

    +HRCOAPNEW:0 //创建成功

    OK

    +HRCOAPEVENT:2,0 //DTLS握手成功'
  source: 合肥燃气定制版本 CoAP用户手册 (developmentdomain/custom_coapusermanual/topics/r_at_hrcoapnew.dita)
  models:
  - MN316
  - MN316-DBRD-MHRH1S03
  - MN316-DLVD-MHRH0S03
  sources:
  - 合肥燃气定制版本 CoAP用户手册 (developmentdomain/custom_coapusermanual/topics/r_at_hrcoapnew.dita)
  variants: []

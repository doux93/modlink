- cmd: AT+MNTP
  syntax: AT+MNTP[=<server>[,<port>,[<sync>,[<timeout>]]]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MNTP 网络时间同步
  doc: '该命令用于同步网络时间。


    参数：

    `<server>`字符串，NTP服务器IP地址或域名，默认服务器"ntp1.aliyun.com"，最大长度255字节。（注：ML307X/ML307Y：默认服务器"ntp7.aliyun.com"。）


    `<port>`整型，NTP服务器端口，范围：0~65535。默认值123。


    `<sync>`整型，是否更新本地RTC计时器的时间。默认值1。


    - `0`: 不更新

    - `1`: 更新


    `<timeout>`整型，请求超时，范围：1~300；单位：s。默认值20s。（注：ML302A/ML305A/ML307A/ML307G/ML302S/ML307S/ML307R/ML307H/ML307C：默认值30s。）


    `<time>`字符串，NTP时间获取结果。格式为"yy/MM/dd,hh:mm:ss±zz”，格式与`AT+CCLK?`返回结果相同，其中zz代表时区的4倍。


    `<result>`整型，返回结果码。（注：ML307N：仅支持0、3。）


    - `0`: 成功

    - `1`: DNS错误

    - `2`: 超时

    - `3`: 时间同步失败'
  examples:
  - 'AT+MNTP="cn.ntp.org.cn",123,0

    OK

    +MNTP: 0,"19/02/21,07:29:20+32"

    AT+MNTP="cn.ntp.org.cn",123,1,30 //同步网络时间至本地

    OK

    +MNTP: 0,"19/02/21,07:35:02+32"

    AT+CCLK?

    +CCLK: 19/02/21,07:35:03+32 //本地时间同步成功

    OK'
  source: TCP/IP用户手册 (developmentdomain/tcp_ipusermanual/topics/r_at_mntp.dita)

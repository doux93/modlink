- cmd: AT+MLBSLOC
  syntax: AT+MLBSLOC
  category: lbsusermanual
  kind: command
  risk: none
  title: AT+MLBSLOC 获取LBS定位信息
  doc: '该命令用于获取LBS定位信息。


    参数：

    `<stat>`整型，定位结果状态码。


    - `100`: 定位成功。

    - `其他`: 详见定位结果状态码（4.1章节stat定位结果状态码（引用：`r_status_codes_of_stat_locating.dita`））。


    `<longitude>`整型，经度，范围：-180.00000000~180.00000000。


    `<latitude>`整型，纬度，范围：-90.00000000~90.00000000。


    `<radius>`整型，定位精度，单位:米。


    `<descr>`字符串型，具体位置信息描述，受`<descr_mode>`影响。


    `<err>`整型，错误码（详见5.2章节 错误码（引用：`r_navi_error_codes.dita`））。'
  examples:
  - 'AT+MLBSLOC

    OK

    +MLBSLOC: 100,106.49899330,29.61772980,550,"重庆市 渝北区 黄杨路 靠近D3大楼"'

- cmd: AT+MAUDPLCFG
  syntax: AT+MAUDPLCFG="volume"[,<volume>]
  category: audiousermanual
  kind: command
  risk: none
  title: AT+MAUDPLCFG 播放音频通用设置
  doc: '该命令用于设置音频播放器相关的通用配置参数。


    参数：

    `<volume>`整型，播放音量。范围：0~100。 不同平台默认值不同。（注：ML307N-DC/ML307N-GC：该命令仅在播放通道为CODEC时生效；默认值为75；为适配各种PA，当前0~100音量均匀分布在ES8311可提供的全量音量增益上。）


    `<path>`整型，播放通道，默认为0。（注：ML307N：该参数需要存NV，重启生效。其中，ML307N-DL/ML307N-GL/ML307N-BL/ML307N-ML仅支持0：DAC。）


    - `0`: DAC

    - `1`: CODEC


    `<method>`整型，控制PA的方式，默认为3。（注：ML307N：该参数需要存NV，重启生效。ML307N支持0~3（实际pin脚为：76、77、86、87），请参阅《扩展AT用户手册》中的`AT+MGPIO`的`<pin>`参数。）


    `<pa_on_delay>`整型，PA启动稳定时间。范围：0~10000000us。默认为120000us。（注：ML307N：该参数存NV且实时生效。）


    `<pa_off_delay>`整型，PA关断稳定时间。范围：0~10000000us。默认为80000us。（注：ML307N：该参数存NV且实时生效。）'
  examples:
  - 'AT+MAUDPLCFG=?

    +MAUDPLCFG: "volume",(0-100)

    OK'
  source: 音频用户手册 (developmentdomain/audiousermanual/topics/4g_topics/r_4g_at_maudplcfg.dita)

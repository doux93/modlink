- cmd: AT+MDGNSSEN
  syntax: AT+MDGNSSEN=<enable>[,<cycle>]
  category: gnssusermanual
  kind: command
  risk: none
  title: AT+MDGNSSEN 开启/关闭差分定位功能
  doc: '该命令用于开启或关闭差分定位功能。开启差分定位功能后，将会提升UE的定位精度，定位过程中会持续消耗数据流量。


    参数：

    `<enable>`整型。（注：MF308C：默认打开差分定位功能，不支持配置该参数。）（注：ML302A/ML307A/ML307C/ML307N：不支持差分定位功能，不支持配置该参数。）


    - `0`: 关闭DGNSS功能

    - `1`: 开启DGNSS功能


    `<state>`整型。


    - `0`: DGNSS模式已关闭

    - `1`: DGNSS模式已开启


    `<cycle>`整型；(1-30)秒，本地定位数据上报间隔。（注：MF308C不支持该参数的配置。）（注：ML302A/ML307A：不支持差分定位功能，不支持配置该参数。）'
  examples:

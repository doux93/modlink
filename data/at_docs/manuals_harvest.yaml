- cmd: AT+BLEGATADDC
  syntax: AT+BLEGATADDC=<gsrvID>,<gchrID>,<chrUUID>,<chrpermission>[,<chr_val>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLEGATADDC 添加特征
  doc: '该命令用于向指定服务添加特征。


    参数：

    `<gsrvID>`整型。在添加服务时指定的，该特征所属服务的唯一标识。范围：0~65535。


    `<gchrID>`整型。特征在特定服务中的唯一标识。添加特征时要保证每个服务下的每个特征的 ID 值唯一。范围：0~65535。


    `<chrUUID>`不带双引号的十六进制字符串类型。特征的 UUID。该参数是一个 16 位或 128 位 的数。对应的字符串为 4 字节或 32 字节，并且前面不能添加 0x 或者 0X。


    `<chrpermission>`不带双引号的十六进制字符串类型。特征权限。使用 bit 位表示可对该特征进行哪 些操作。该参数是一个 16 位的数。


    - `0x01`: 广播（如果设置，则允许广播特征值，则服务器特征配置描述符应存在。）

    - `0x02`: 读（如果设置，允许client读取特征值。）

    - `0x04`: 写（如果设置，允许client在无响应的情况下写入特征值。）

    - `0x08`: 写（如果设置，允许client在有响应的情况下写入特征值。）

    - `0x10`: 通知（如果设置，则允许使用`AT+MBLEGATSNTFY`在不确认的情况下通知特征值。如果设置，则需设置UUID为2902的特征描述符应，并使能通知。）

    - `0x20`: 指示（如果设置，允许使用`AT+MBLEGATSIND`在确认的情况下显示特征值。如果设置，则需设置UUID为2902的特征描述符应，并使能指示。）

    - `0x40`: 经过身份验证的签名写入（如果设置，允许使用 Bluetooth Core Specification V5.0 | Vol 3, Part G ,The program defined
    in Section 4.9.2。）

    - `0x80`: 扩展属性（如果设置，则需设置UUID为2900的特征描述符。）

    - `0x0100`: 数据访问需要链接加密且无需身份验证。

    - `0x0300`: 数据访问需要链接加密和身份验证。

    - `0x0500`: 数据访问需要链接加密和身份验证，需要安全连接。


    `<chr_val>`不带双引号的十六进制字符串类型。特征属性的初始值。该值为可选项，如果不下 发该值，默认为空。长度必须为偶数且超过 512 字节。'
  examples:
  - 'AT+BLEGATADDS=0,181b,1

    OK

    AT+BLEGATADDC=0,0,2a06,0x3a

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blegataddc.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blegataddc.dita)
  variants: []

- cmd: AT+MIPLWRITERSP
  syntax: AT+MIPLWRITERSP=<ref>,<mid>,<result>
  category: lwm2musermanual
  kind: command
  risk: none
  title: AT+MIPLWRITERSP 写操作请求响应
  doc: '该命令用于接收到+MIPLWRITE消息后，回复模组WRITE操作的结果。


    参数：

    `<ref>`整型，LwM2M设备实例ID。


    `<mid>`uint16类型，该resource所属的instance observe操作时下发的`<mid>`。


    `<result>`整型，操作结果。（注：操作结果正确`<result>`返回2；其他返回值都表示操作错误，一般返回11。）


    - `2`: Changed

    - `11`: Bad Request

    - `12`: Unauthorized

    - `13`: Not Found

    - `14`: Method Not Allowed'
  examples:

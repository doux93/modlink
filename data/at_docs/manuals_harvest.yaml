- cmd: AT+QDNS
  syntax: AT+QDNS=<mode>[,<hostname>][,<retry>][,<timeout>]]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+QDNS 触发DNS域名解析
  doc: '该命令用于DNS域名解析。


    参数：

    `<mode>`整型。


    - `0`: DNS 域名解析。此时必须指定`<hostname>`

    - `1`: 清除解析数据。若指定`<hostname>`，则清除内存中的主机名解析数据和 KV。若不 指定`<hostname>`，则将清除所有解析数据。


    `<hostname>`字符串型。域名。


    `<retry>`整型。重试次数，范围 1~3，默认值3。


    `<timeout>`整型。超时时间，单位：秒，范围 10~100，默认值100。


    `<result>`字符串型。域名解析的结果。 域名解析成功则为相应的 IP 地址，若失败则为 FAIL。'
  examples:
  - 'AT+QDNS=0,www.baidu.com

    OK

    +QDNS:111.13.100.91'

- cmd: AT+QLWULDATAEX
  syntax: AT+QLWULDATAEX=<length>,<data>,<mode>[,<seq_num>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+QLWULDATAEX 发送CON/NON消息
  doc: '该命令用于使用RAI标识向平台发送需要确认的数据（CON）或者不需要确认的数据（NON）。


    参数：

    `<length>`整型。表示发送数据的长度。最大值：1024。单位：字节。


    `<data>`十六进制格式字符串型。最大发送数据长度为 1024 字节。


    `<mode>`消息发送模式。


    - `0x0000`: 表示发送 NON 消息。

    - `0x0001`: 表示发送带有 RELEASE 释放辅助提示的 NON 消息。

    - `0x0010`: 表示发送带有 RELEASE_AFTER_REPLY 释放辅助提示的 NON 消息。

    - `0x0100`: 表示发送 CON 消息。

    - `0x0101`: 表示发送带有 RELEASE_AFTER_REPLY 释放辅助提示的 CON 消息。


    `<seq_num>`数据序列号。范围：0~255。如果使用非 0 的`<seq_num>`发送 CoAP 数据，且当前有携带相同`<seq_num>`的 NON 或者 CON 类型 CoAP 数据未发送完成，那么会将数据丢弃并返回错误。若`<seq_num>`为
    0，则被忽略。'
  examples:
  - 'AT+QLWULDATAEX=3,AA34BB,0x0001

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_qlwuldataex.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_qlwuldataex.dita)

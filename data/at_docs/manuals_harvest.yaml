- cmd: AT+MIPLISTEN
  syntax: AT+MIPLISTEN=<sid>,<protocol>,<port>[,<type>[,<access_mode>]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPLISTEN 进入服务器监听模式
  doc: '该命令用于打开服务器监听模式。


    参数：

    `<sid>`整型，服务器实例id，用于标识操作的服务器实例。范围：0~3。


    `<protocol>`字符串，协议类型。


    - `TCP`: TCP协议

    - `UDP`: UDP协议


    `<port>`整型，监听端口。范围：1~65535。


    `<type>`字符串，IP类型。设置的类型需与当前UE获取到的IP类型匹配，否则报错。例如，无IPv6地址设置IPv6时将报错。


    - `IP`: IPv4类型

    - `IPV6`: IPv6类型


    `<access_mode>`整型，客户端连接后的默认数据收发模式。


    - `0`: 普通模式（数据接收：接收到的数据加URC前缀后串口直接输出。数据发送：通过`AT+MIPSEND`命令。）

    - `1`: 透传模式（服务器模式，不支持。）

    - `2`: 流缓存模式（TCP连接支持。数据接收：只上报数据接收提示。数据发送：同普通模式。）

    - `3`: 包缓存模式（UDP连接支持。数据接收：只上报数据接收提示。数据发送：同普通模式。）'
  examples:
  - 'AT+MIPLISTEN=?

    +MIPLISTEN: (0-3),("tcp","udp"),(1-65535),("ip","ipv6"),(0,2,3)

    OK'

- cmd: AT+MFCFG
  syntax: AT+MFCFG="timeout"[,<timeout>]
  category: filesystemusermanual
  kind: command
  risk: none
  title: AT+MFCFG 文件系统通用设置
  doc: '该命令用于设置文件系统通用设置。


    参数：

    命令标识符（第一个参数）。（注：MR880A/MR380M/MR380R：不支持"fragment"设置。）（注：ML307N：不支持"fragment"设置。）


    - `timeout`: 数据输入超时时间

    - `fragment`: 数据输出分包参数设置

    - `encoding`: 输入输出数据编码设置


    `<timeout>`整型，数据输入超时时间。范围：1~120，单位：秒，默认值10（影响`AT+MFWRITE`、`AT+MFPUT`）。


    `<frag_size>`整型，数据输出最大分包字节大小，单位：字节，范围：0~65535，默认值8192，影响`AT+MFREAD`、`AT+MFGET`。（注：ML302S/ML307S/ML302A/ML305A/ML307A/ML305U/ML307R/ML307C/ML307G/ML307X/ML307YMR880A/MR380M/MR380R：仅支持默认值。）


    `<frag_interval>`整型，数据输出分包时间间隔，单位：ms，范围：0~65535，影响`AT+MFREAD`、`AT+MFGET`，仅`<frag_size>`为非0时有效，默认值200。（注：ML302S/ML307S/ML302A/ML305A/ML307A/ML305U/ML307R/ML307C/ML307G/ML307X/ML307YMR880A/MR380M/MR380R：仅支持默认值。）


    `<input_format>`整型，数据输入编码模式，默认值0，影响`AT+MFWRITE`、`AT+MFPUT`。（注：MR880A：不支持2。


    ML380R：该参数缺省时，保留上次配置。）


    - `0`: ASCII字符串

    - `1`: HEX 字符串


    - `2`: 转义字符串


    `<output_format>`整型，数据输出编码模式，默认值0，影响`AT+MFREAD`、`AT+MFGET`。（注：MR380R：该参数缺省时，保留上次配置。）


    - `0`: 原始数据

    - `1`: HEX 字符串'
  examples:
  - 'AT+MFCFG="encoding"

    +MFCFG: "encoding",0,0

    OK'

- cmd: AT+MIPSEND
  syntax: AT+MIPSEND=<connect_id>[,<send_length>[,<data>[,<rai>[,<seq>[,<pri_flag>]]]]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPSEND 发送数据
  doc: '该命令用于TCP或UDP连接发送数据。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-E/MN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。


    MR880A：范围0~9。）


    `<send_length>`整型，发送的数据长度，命令中直接输入数据时的范围：0~1460。数据模式下的范围：1~8192。单位：字节。（注：ML307H：建立连接后发送的首个数据包，最大只能发送16K字节，后续单个数据包能支持发送的最大长度，根据拥塞窗口变化逐渐增加。


    ML307N：设置命令带数据内容参数为hex输入时，数据长度受平台单条命令长度限制（1600字节），数据内容过长时建议使用数据模式。数据模式下的范围：1~62780。


    MN327：命令直接输入模式下，单条命令最大长度为2048，超过将报错。


    MN319-A：命令直接输入模式下，单条命令最大长度为1560，超过将报错。）


    以">"模式输入数据时，`<send_length>`不能设置为0。命令中直接输入数据时：当`<send_length>`等于0 或缺省，不对数据长度进行校验；当`<send_length>`大于0，将对输入数据的长度进行校验（ASCII字符串和带转义的字符串输入模式下：校验实际命令中输入字符串长度是否与指定长度相等。HEX字符串输入模式下：校验实际命令中输入字符串长度是否是指定长度的两倍）。


    以">"模式输入数据时，`<data>`之后的参数无法设置。数据发送单包长度受MTU限制，超过长度时IP层将自动分包，对于UDP协议，数据分包会增加组包后整包丢包的概率，因此建议使用时单包不超过最大长度。IPv4
    TCP单包最大长度为MTU-40，IPv4 UDP 单包最大长度为MTU-28，IPv6 TCP单包最大长度为MTU-60， IPv6 UDP单包最大长度为MTU-48。


    `<data>`字符串，发送的数据内容。


    `<rai>`整型，列举帮助信息。默认值0。（注：MN316/MN316-S/MN316A/MN326A/MN318/MN326/M5310-E/ MN327/MN328：TCP不支持 RAI。


    4G系列/MN319/MN319-A/MR880A/MR380M/MR380R：不支持RAI；MN319A：`<rai>`参数配置不生效。）


    - `0`: 无信息

    - `1`: 终端发送一个上行包

    - `2`: 终端发送一个上行包，并期望接收到一个下行包。


    `<seq>`整型，UDP空口回传序列号，仅UDP连接支持，范围：1~255。（注：4G系列/MR880A/MR380M/MR380R：不支持。


    MN316A/MN326A/MN319/MN319-A：当配置参数时，IPv6数据包长度最大仅支持MTU-48，MTU根据网络决定，范围为1280~1500，建议IPv6数据发送长度不超过1232，否则超过MTU-48，`AT+MIPSEND`将报错。）


    `<pri_flag>`整型，优先级标志。默认值0。（注：暂不支持该参数设置。）


    - `0`: IPTOS 可靠性

    - `1`: IPTOS 低延时

    - `2`: IPTOS 吞吐量

    - `3`: IPTOS 低消耗'
  examples:
  - 'AT+MIPSEND=?

    +MIPSEND: (0-4),(0-1460),,(0-2),(1-255)

    OK'

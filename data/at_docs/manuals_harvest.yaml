- cmd: AT+MHTTPCREATE
  syntax: AT+MHTTPCREATE=<host>
  category: http_httpsusermanual
  kind: command
  risk: none
  title: AT+MHTTPCREATE 创建HTTP实例
  doc: '该命令用于创建HTTP实例，初始化实例相关内容。


    参数：

    `<host>`服务器域名或者IP地址，格式如"http://domain.com"或"http://domain.com:80"。":80"是指定的服务器端口号，当不指定端口号时，HTTP默认端口80，HTTPS默认端口443。


    `<httpid>`客户端实例id，0~3。（注：MN319/MN319-A/MN316A/MN326A：`<httpid>`参数范围0~1。）'
  examples:
  - 'AT+MHTTPCREATE="http://www.baidu.com:80"

    +MHTTPCREATE: 0

    OK'

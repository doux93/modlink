- cmd: AT+MIPSTATE
  syntax: AT+MIPSTATE=<connect_id>
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPSTATE 查询TCP/IP连接状态
  doc: '该命令用于查询TCP、UDP连接状态信息。


    参数：

    `<connect_id>`整型，客户端连接实例id，范围：0~5。（注：M5310-E/MN316/MN316-S/MN326：范围0~4。


    MN316A/MN326A/MN319/MN319-A：范围0~3。


    MR880A：范围0~9。）


    `<service_type>`字符串，连接类型。


    - `TCP`: TCP连接

    - `UDP`: UDP连接


    `<address>`字符串，服务器地址。


    `<remote_port>`整型，服务器端口号，范围：0~65535。


    `<state>`字符串，连接状态。


    - `INITIAL`: 未建立连接

    - `CONNECTING`: 正在建立连接

    - `CONNECTED`: 已建立连接

    - `CLOSING`: 正在关闭连接

    - `CLOSED`: 连接已关闭'
  examples:

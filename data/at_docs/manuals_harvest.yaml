- cmd: AT+MEMMTIMER
  syntax: AT+MEMMTIMER=<enable>
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MEMMTIMER 使能/禁用EMM定时器URC上报
  doc: '该命令用于设置EMM定时器的URC上报功能。


    参数：

    `<enable>`整型，使能/禁用URC上报，默认值0。


    - `0`: 禁用上报

    - `1`: 使能上报


    `<backoff_timerId>`整型，使能/禁用URC上报，默认值0。（注：T3346用于 EMM拥塞控制和APN拥塞控制，用于记录在`Attach Reject/TAU Reject/RAU
    Reject/Service Reject`之后，到终端再次发起 Attach/TAU/RAU/Service请求的时间。T3448用于控制面传送用户数据的拥塞控制，Attach Accept、TAU
    Accept、Service Accept消息携带了非零的定时器T3448。SERVICE REJECT消息携带的原因为`EMM cause #22 “Congestion”`，以及携带了非零的定时器T3448。T3396如果ESM原因是`＃26“资源不足”`，则网络可能包含此IE。


    ML307G/ML307H/ML307B：仅支持T3346/T3396。）


    - `0`: T3346

    - `1`: T3347

    - `2`: T3348

    - `3`: T3396


    `<event>`整型，指示对应定时器发生的事件。（注：ML307X/ML307Y：仅支持参数值0、1、2。）


    - `0`: 启动定时器

    - `1`: 停止定时器

    - `2`: 定时器超时

    - `3`: 去使能定时器，仅适用于T3346和T3396。


    `<period>`整型，定时器的时间。单位：毫秒。


    `<remaining>`整型，定时器停止时剩余的时间。单位：毫秒。'
  examples:
  - 'AT+MEMMTIMER=?

    +MEMMTIMER: (0-1)

    OK'

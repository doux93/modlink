- cmd: AT+MFTPSTOR
  syntax: AT+MFTPSTOR=<connect_id>,<file_name>[,<eof>[,<length>[,<data>]]]
  category: ftpusermanual
  kind: command
  risk: none
  title: AT+MFTPSTOR 向服务器覆盖写入文件
  doc: '本命令用于向FTP服务器新建或覆盖方式写入文件操作。


    参数：

    `<connect_id>`整型，FTP连接通道ID，范围：0~5。


    `<file_name>`字符串，上传到服务器的文件命名，最大长度255字节。


    `<local_file_name>`字符串，最大长度255字节。（注：ML307B：最大长度64字节。）


    - `+MFTPCFG命令中"local_fs"为0`: 本参数域段无效

    - `+MFTPCFG命令中"local_fs"为1`: 模组本地的文件名称


    `<eof>`整型，范围：0~1。


    - `0`: 表示当前发送数据包不是最后一包，后续还有数据包输入。

    - `1`: 表示当前发送数据包为最后一包。


    `<length>`整型，范围：1~4096。


    - `<eof>存在<length>、<data>缺省`: 后续回显’>’，提示用户输入data内容，以ctrl+z结束。

    - `1~4096`: 后续回显’>’，提示用户输入data内容，当数据长度达到`<length>`值时表示内容结束。


    `<data>`字符串，FTP服务器中指定文件写入的数据内容，单位：字节。（注：数据模式输入`<data>`时`<data>`长度范围为1~4096；普通模式输入`<data>`时`<data>`长度范围为1~1024。）


    `<result_code>`整型， 结果码。


    - `0`: 操作成功

    - `其他`: 操作失败


    `<sent_length>`整型，上传的文件长度。'
  examples:
  - 'AT+MFTPSTOR=0,"test1.txt",1,5

    >BBBBB

    OK

    +MFTPSTOR: 0,0,5'

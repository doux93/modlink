- cmd: AT+QLWULDATASTATUS
  syntax: AT+QLWULDATASTATUS?
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+QLWULDATASTATUS 查询CON消息发送状态
  doc: '该命令用于查询CON消息发送状态。


    参数：

    `<status>`整型。表示 CON 数据发送状态。


    - `0`: 未发送

    - `1`: 已发送，等待 LwM2M 物联网平台响应

    - `2`: 发送失败

    - `3`: 超时

    - `4`: 成功

    - `5`: 收到 RESET 消息


    `<seq_num>`数据序列。范围：0~255。若`<seq_num>`为 0 则被忽略。'
  examples:
  - 'AT+QLWULDATASTATUS?

    +QLWULDATASTATUS:4

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_qlwuldatastatus.dita)

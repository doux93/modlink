- cmd: AT+MIPSENDTO
  syntax: AT+MIPSENDTO=<connect_id>,<addr>,<port>[,<send_length>[,<data>[,<rai>[,<seq>[,<pri_flag>]]]]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPSENDTO UDP指定地址发送数据
  doc: '该命令用于UDP连接向指定IP地址发送数据。


    参数：

    `<connet_id>`整型，客户端连接实例id，范围：0~5。（注：MR880A：范围 0~9。）


    `<addr>`字符串，对端IP地址。


    `<port>`整型，对端端口，范围：1~65535。


    `<send_length>`整型，发送的数据长度，命令中直接输入数据时的范围：0~1460，数据模式下的范围：1~8192，单位：字节。


    `<data>`字符串，发送的数据内容。


    `<rai>`整型，列举帮助信息。默认值0。（注：MR880A：不支持设置。）


    - `0`: 无信息

    - `1`: 终端发送一个上行包

    - `2`: 终端发送一个上行包，并期望接收到一个下行包。


    `<seq>`整型，UDP空口回传序列号，仅UDP连接支持，范围：1~255。（注：MR880A：不支持设置。）


    `<pri_flag>`整型，优先级标志。默认值0。（注：MR880A：暂不支持该参数设置。）


    - `0`: IPTOS可靠性

    - `1`: IPTOS低延时

    - `2`: IPTOS吞吐量

    - `3`: IPTOS低消耗'
  examples:
  - 'AT+MIPSENDTO=0,8.137.154.246,2045,,1

    +MIPSENDTO: 0,1

    OK'

- cmd: AT+MIPCALL
  syntax: AT+MIPCALL=<operation>[,<cid>,]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MIPCALL 建立模组数据连接
  doc: '注意：- ML302A/ML307A/ML307R/ML307C/ML302S/ML307S/ML307G/ML307H/ML307M/ML307N/ML307X/ML307Y/ML307B：设置命令不支持参数`<cid>`缺损。


    参数：

    `<cid>`整型，指定连接所属PDP上下文（范围根据实际确定）。（注：MR880A：仅支持配置7。


    MR380M：网卡模式下支持范围为2-10，默认`<cid>`为2。路由模式下仅支持配置2。）


    （注：ML307B：支持范围为0-4， 默认`<cid>`为0。）


    `<operation>`整型，操作类型。


    - `0`: 断开连接

    - `1`: 建立连接


    `<IP1>`字符串，建立连接后本地对应的IPv4地址。


    `<IP2>`字符串，建立连接后本地对应的IPv6地址。


    `<status>`整型，连接状态。


    - `0`: 断开连接

    - `1`: 已连接'
  examples:
  - 'AT+MIPCALL=?

    +MIPCALL: (0-1),(0-16)

    OK'
  source: 扩展AT用户手册 (developmentdomain/extendedatcommandusermanual/topics/r_at_mipcall.dita)

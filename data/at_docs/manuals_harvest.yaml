- cmd: AT+NSORF
  syntax: AT+NSORF=<socket>,<req_length>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NSORF 读取消息
  doc: '该命令用于读取socket下行数据。


    参数：

    `<socket>`整型， socket 编号。范围：0~6。


    `<req_length>`整型。读取的最大数据长度。十进制格式。单位：字节。最大请求数据长度为 1358 字节。


    `<remote_ip_addr>`字符串。表示发送消息的系统地址。 点分十进制 IPv4 地址，点分十进制。IP 地址可以以十进制，八进制或十六进制表 示。仅支持 IPv4。


    `<remote_port>`整型。表示发送消息的远端端口。范围：0~65535。


    `<length>`整型。表示返回的数据长度。十进制格式。


    `<remaining_length>`整型。未读取的消息剩余数据长度。十进制格式。单位：字节。剩余长度始终为 0 且剩余数据可读。


    `<data>`十六进制字符串型。表示接收的数据。最大的接收数据长度是 1358 字节。'
  examples:
  - 'AT+NSORF=1,10

    1,192.168.5.1,1024,2,ABAB,0

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nsorf.dita)
  models:
  - MN328
  - MN328-BX
  sources:

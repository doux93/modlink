- cmd: AT+MBLESMPCFG
  syntax: AT+MBLESMPCFG=<Bonding_Flags>,<MITM_Flags>,<SC_Flags>,<iocap>
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLESMPCFG 设置BLE配对加密能力
  doc: '该命令用于设置BLE设备配对及加密相关参数。


    参数：

    `<Bonding_Flags>`整型，配对绑定标志。


    - `0`: 不绑定

    - `1`: 绑定


    `<MITM_Flags>`整型，MITM保护标志。


    - `0`: 无MITM鉴权

    - `1`: MITM鉴权


    `<SC_Flags>`整型，安全连接标志，设置时进行加密连接配对，不设置时进行经典配对。


    - `0`: 无安全连接

    - `1`: 安全连接


    `<iocap>`整型，输入输出能力。输入输出能力所对应的配对方式，请参考Bluetooth Core Specification V5.0| Vol 3, Part H page 2313。


    - `0`: 设备只有显示能力，没有输入能力。

    - `1`: 设备有显示能力，有输入YES/NO的能力。

    - `2`: 设备没有显示能力，有输入数字的能力。

    - `3`: 设备没有输入输出能力。

    - `4`: 设备具有输入数字和显示的能力。'
  examples:
  - 'AT+MBLESMPCFG=1,1,1,1

    OK'
  source: BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mblesmpcfg.dita)

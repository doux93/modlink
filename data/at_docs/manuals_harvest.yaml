- cmd: AT+MGNSSCFG
  syntax: AT+MGNSSCFG="nmea/mask"[,<nmea_mask>]
  category: gnssusermanual
  kind: command
  risk: none
  title: AT+MGNSSCFG GNSS参数设置
  doc: '该命令用于设置客户端实例相关的通用配置参数。


    参数：

    `<nmea_mask>`NMEA输出配置（0-63），对应的bit置1表示开启对应输出，默认值0。NV存储。（注：MF308C：无GLL信息上报。）


    - `bit0`: GGA信息

    - `bit1`: GSV信息

    - `bit2`: GSA信息


    - `bit3`: RMC信息


    - `bit4`: VTG信息

    - `bit5`: GLL信息


    `<nmea_cycle>`NMEA输出周期（1-60）秒，默认值1，整型。NV存储。


    `<nmea_port>`调整NMEA数据输出接口（整型），默认值2。（注：MF308C：仅支持NMEA数据层USB口输出。）（注：ML302A/ML307A：不支持此参数配置。


    ML307C：暂不支持1。


    ML307N：仅支持2，即NMEA数据层UART0口输出。）


    - `0`: NMEA数据从USB AT口输出

    - `1`: NMEA数据从USB GPS口输出

    - `2`: NMEA从UART0口输出


    `<agnss_url>`AGNSS辅助定位服务器url，字符串（hostname:port，≤64字节）NV存储。（注：MF308C：默认已配置辅助定位服务器url，不支持配置该参数。）（注：ML302A/ML307A/ML307C：默认已配置辅助定位服务器url，不支持配置该参数。


    ML307N：不支持AGNSS，不支持此参数配置。）


    `<agnss_interval>`AGNSS辅助定位数据自动更新间隔，整型，单位分钟。NV存储。（注：MF308C：会自动检测并更新辅助定位数据，不支持配置该参数。）（注：ML302A/ML307A/ML307C/ML307N：默认值：0，辅助数据有效时间为120分钟。）


    - `0`: 禁止自动更新

    - `30-240`: 自动更新间隔


    `<dgnss_url>`DGNSS差分定位服务器url，字符串（hostname:port，≤64字节）NV存储。（注：MF308C：默认打开差分定位功能，不支持配置该参数。）（注：ML302A/ML307A/ML307N/ML307C：不支持DGNSS，不支持配置该参数。）


    `<dgnss_user>`DGNSS差分定位用户名，字符串（≤64字节）。NV存储。（注：MF308C：默认打开差分定位功能，不支持配置该参数。）（注：ML302A/ML307A/ML307C：不支持DGNSS，不支持配置该参数。）


    `<dgnss_pwd>`DGNSS差分定位密码，字符串（≤64字节）。NV存储。（注：MF308C：默认打开差分定位功能，不支持配置该参数。）（注：ML302A/ML307A/ML307C：不支持DGNSS，不支持配置该参数。）


    `<mount_point>`DNGSS差分定位挂载点，字符串（≤64字节）。NV存储。（注：MF308C：默认打开差分定位功能，不支持配置该参数。）（注：ML302A/ML307A/ML307C：不支持DGNSS，不支持配置该参数。）


    `<mask>`GNSS搜星模式掩码，整型。（注：ML307N：使用此配置切换搜星选项后需要使用`AT+MGNSSRST=0`进行冷重启GNSS。）


    - `bit0:`: GPS

    - `bit1:`: BDS

    - `bit2:`: QZSS

    - `bit3:`: GLONASS

    - `bit4:`: Galileo'
  examples:
  - 'AT+MGNSSCFG=“nmea/mask”,63

    OK'
  source: GNSS用户手册 (developmentdomain/gnssusermanual/topics/r_at_mgnsscfg.dita)

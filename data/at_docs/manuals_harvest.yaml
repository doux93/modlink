  risk: none
  title: AT+MSSLCHECK 校验证书或密钥正确性
  doc: '本命令用于校验证书或密钥。


    参数：

    `<cert_name>`字符串型，证书名称，密钥名称或预共享密钥id。


    `<verify_alg>`整型，校验用加密算法，默认值0。（注：MN316A/MN316/MN326/ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML305U/ML305M/ML307M/MR880A/ML307X/ML307Y/ML307R/ML307B/ML307C/ML307H：只支持

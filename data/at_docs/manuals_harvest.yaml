- cmd: AT+MHTTPCONTENT
  syntax: AT+MHTTPCONTENT=<httpid>[,<eof>[,<length>[,<data>]]]
  category: http_httpsusermanual
  kind: command
  risk: none
  title: AT+MHTTPCONTENT 设置HTTP CONTENT数据
  doc: '该命令用于设置HTTP content数据。


    参数：

    `<httpid>`客户端实例id，0~3。（注：MN319/MN319-A/MN316A/MN326A：`<httpid>`参数范围0~1。）


    `<eof>`数据输入指示。


    - `0`: content输入结束标记，需请求完成或清空后才可再次输入。

    - `1`: 后续还有content数据输入。

    - `2`: 清空已有content内容，只对非Chunked模式有效。


    `<length>`输入数据长度，0~4096，数据模式下不可设置为0，命令中直接输入数据时，设置为0，不对数据长度进行校验，设置大于0，将对输入数据的长度进行校验（ASCII字符串和带转义的字符串输入模式下：校验实际命令中输入字符串长度是否与指定长度相等；HEX字符串输入模式下：校验实际命令中输入字符串长度是否是指定长度的两倍）。（注：MN327：命令直接输入模式下，单条命令最大长度为2048，超过将报错。


    ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML305M/ML307R/ML307B/ML307C/ML307M/ML307H/ML307N/MR380R/MR380M：数据模式下可设置为0。


    ML305U：数据模式下可设置为0，参数缺省时为0。


    ML307G：支持的content总长度为3*4096字节。）


    `<data>`content数据，单次请求有效，请求结束后自动清空。（注：`AT+MHTTPCFG="encoding"`中设置的`<input_format>`参数，只对直接命令中带`<data>`的输入模式有效，对数据模式输入无效，数据模式直接使用原始数据。


    ML302S/ML307S/ML302A/ML305A/ML307A/ML307G/ML305U/ML305M/ML307R/ML307B/ML307C/ML307M/ML307H/ML307N/ML307X/ML307Y：字符串参数内部不能包含引号，如果字符串参数内部一定要包含引号，需使用数据模式进行发送。


    MR380M：CONTENT内容不支持连续输入双引号和逗号。）'
  examples:
  - 'AT+MHTTPCONTENT=0,0,0,"{"id":"speed1"\r,"tags":["mobile"],"unit":"m/s"\r,"unit_symbol":"m/s"}"

    OK'

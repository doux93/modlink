- cmd: AT+MBLEGATSADDD
  syntax: AT+MBLEGATSADDD=<gsrvId>,<gchrId>,<gdesId>,<desUuid>,<desPermission>[,<length>[,<desVal>]]
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEGATSADDD GATTS 向特征添加特征描述符
  doc: '该命令用于向一个特征中添加一个特征描述符。


    参数：

    `<gsrvId>`整型，服务的唯一标识，0~65535。（注：ML302/ML305为0~65534。）


    `<gchrId>`整型，特征在服务中的唯一标识，0~65535。（注：ML302/ML305为0~65534。）


    `<gdesId>`整型，描述符在特定特征中的唯一标识。添加描述符时要保证在同一个特征下每个描述符的id是唯一的，0~65535。（注：ML302/ML305为0~65534。）


    `<descUuid>`十六进制字符串，描述符的UUID，该参数是一个16位或128位的数。对应的数串为4字节或32字节。


    `<descPermission>`整型，特征描述符权限。使用bit位表示可对该特征描述符进行哪些操作。


    - `Bit0`: 读

    - `Bit1`: 写

    - `Bit2`: 安全连接（如果设置，则需在配对完成后对端设备才可访问该特征描述符。）

    - `Bit3`: MITM 鉴权（如果设置，则需在配对完成后对端设备才可访问该特征描述符。）


    `<length>`整型，数据长度，单位字节，0~512。数据模式输入时，长度需大于0，命令中直接输入数据时，不校验数据长度以实际输入数据为准。


    `<descVal>`数据，特征描述符属性的初始值，最大512字节数据，数据格式由`AT+MBLECFG="encoding"`命令确定，默认为空。'
  examples:
  - 'AT+MBLEGATSADDD=1,1,4,2902,3,0,0300


  syntax: AT+MFREAD=<fhandle>[,<length>]
  category: filesystemusermanual
  kind: command
  risk: none
  title: AT+MFREAD 读文件
  doc: '该命令用于读取已打开的文件。


    参数：

    `<fhandle>`整型，文件句柄，范围：0~65535。


    `<length>`整型，待读取长度，单位：字节。



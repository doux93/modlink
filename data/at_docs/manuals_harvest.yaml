    `<state>`整型，AGNSS数据有效性。


    - `0`: 辅助数据无效

    - `1`: 辅助数据有效

    - `2`: 无法判断数据有效性（UE时间未同步时返回此项）

    - `255`: 辅助数据为空


    `<time>`yymmddhhmmss；辅助数据更新时间，年月日时分秒，各占2个字符。


    `<size>`整型；辅助数据大小，以字节为单位。（注：ML302A/ML307A：此参数值，不能作为下载辅助数据所消耗流量的参考依据。）'

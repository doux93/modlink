- cmd: AT+MDNSCFG
  syntax: AT+MDNSCFG="ip"[,<address1>[,<address2>]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MDNSCFG 设置域名解析服务器
  doc: '该命令用于配置模组域名解析服务器地址，配置成功将对涉及模组DNS服务请求的全部应用生效，影响范围包括：TCP/IP、HTTP、MQTT、LWM2M等。


    参数：

    `<address1>`字符串，解析服务器首选IP地址。如果配置为空字符串""，将清空NV，并按照如上优先级恢复默认配置，ipv4默认值为"119.29.29.29"，ipv6默认值为"2400:3200::1"。（注：NB系列：如SIM卡PLMN是46003、46005、460011，ipv4默认值是218.4.4.4。）


    `<address2>`字符串，解析服务器备用IP地址。如果配置为空字符串""，将清空NV，并按照如上优先级恢复默认配置，ipv4默认值为"114.114.114.114"，ipv6默认值为"2001:4860:4860::8888"。


    `<priority>`整型，解析协议优先级。默认值1。


    - `0`: IPV4优先

    - `1`: IPV6优先


    `<cached_mode>`整型，DNS缓存模式；使用缓存时，每次解析结果保存到缓存，下次解析时直接使用缓存结果，不再请求解析服务器。默认值0。（注：ML307G：默认值为1。）


    - `0`: 使用缓存

    - `1`: 不使用缓存


    `<cached_period>`整型，DNS缓存周期，每一组解析结果单独计算，到期后需要重新请求解析服务器。范围：1~65535；单位：s。默认3600s。


    `<time>`整型，DNS一次请求等待服务器响应的超时时间。范围：1~60；单位：s。NB模组默认30s， 4G、5G模组默认10s。


    `<retries>`整型，DNS最大请求次数，解析失败或超时后将进行重试请求，范围：1~9。默认值3。'
  examples:
  - 'AT+MDNSCFG=?

    +MDNSCFG: "ip",,

    +MDNSCFG: "ipv6",,

    +MDNSCFG: "priority",(0,1)

    +MDNSCFG: "cached",(0,1),(1-65535)

    +MDNSCFG: "timeout",(1-60),(1-9)

    OK'

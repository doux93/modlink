- cmd: AT+MDIALUPCFG
  syntax: AT+MDIALUPCFG="mode"[,<mode>]
  category: extendedatcommandusermanual
  kind: command
  risk: none
  title: AT+MDIALUPCFG 设置拨号协议
  doc: '该命令用于拨号功能相关设置及查询。


    参数：

    `<mode>`整型，拨号模式，默认值0。（注：ML302S/ML307S/ML302A/ML307A/ML307R/ML307C/ML305A/ML305U/ML305M/ML551Z/ML307G/ML307H/ML307M/ML307X/ML307Y/ML307B：不支持NCM拨号模式；其中ML307X/ML307Y默认值11，优先RNDIS；ML307M
    RNDIS仅支持上位机Windows系统拨号，ECM仅支持上位机Linux系统拨号。）（注：MR880A：默认值为2，配置该参数后，USB端口将会重新识别，需等待USB端口识别成功后再进行拨号，该参数保存至NV，如无需更改拨号模式，建议仅配置一次即可，RNDIS仅支持上位机Windows系统拨号，ECM及NCM仅支持上位机Linux系统拨号。Windows系统下的NCM拨号请设置为16。


    MR380R:不支持2。配置该值后，USB端口将重新枚举，枚举后需重新打开。如果出现设备USB-AT口无法打开情况，请参照《MR380R_维护诊断工具用户手册》-“安装USB驱动”章节重新安装驱动。）


    - `0`: RNDIS

    - `1`: ECM

    - `2`: NCM

    - `11(仅ML307X/ML307Y支持该模式。)`: 自适应（注：仅ML307X/ML307Y支持该模式。）


    - `11(仅MR380R支持该模式。)`: 自适应（注：仅MR380R支持该模式。）


    `<enable>`整型，开机自动拨号标识，默认0。


    - `0`: 关闭自动拨号

    - `1`: 打开自动拨号


    `<workmode>`整型，拨号工作模式，默认0。（注：ML302A/ML302S/ML305A/ML307A/ML307R/ML307C/ML307S/ML305M/ML551Z/ML307G/ML307H/ML307X/ML307Y/ML307M：不支持。）


    （注：MR880A/MR380M：默认值为1。


    MR380R/MR380M：不支持2。）


    - `0`: 路由模式

    - `1`: 网卡模式

    - `2`: 后路由模式


    `<nicmaxcnt>`整型，设置最大支持网卡数量，设置成功后重启生效，范围参考测试命令返回结果，默认值为1。（注：MR880A：只在网卡模式下支持多网卡。）（注：ML307C/ML307B：不支持`<nicmaxcnt>`参数配置。）


    `<conn_interface>`整型，自动拨号物理接口。（注：MR880A Mini-PCIe/MR880A M.2不支持网口拨号，同时只支持一种物理接口进行自动拨号，MR880A RGMII适配的PHY芯片请
    联系技术支持，网口拨号需使用`AT+MUECONFIG`命令使能后使用。MR880A/MR380R/MR380M：路由模式下，USB和网口共用一路PDP拨号，cid 1 拨号成功后，USB和网口均可使用，则路由模式下不支持设置网口自动拨号，设置USB自动拨号USB和网口可同时使用。）


    - `0`: USB

    - `1`: 网口(以太网卡)


    `<cid>`整型，pdp上下文标识符，范围见`AT+CGDCONT`命令。打开自动拨号时需设置，关闭自动拨号时不可设置。（注：ML302A/ML302S/ML305A/ML307A/ML307R/ML307C/ML307S/ML305M/ML551Z/ML307G/ML307H/ML307X/ML307Y/ML307M：不支持。


    ML307B：自动ND'
  examples:
  - 'AT+MDIALUPCFG="mode",1

    OK'

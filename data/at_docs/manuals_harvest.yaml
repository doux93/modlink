- cmd: AT+MHTTPHEADER
  syntax: AT+MHTTPHEADER=<httpid>[,<eof>[,<length>[,<header>]]]
  category: http_httpsusermanual
  kind: command
  risk: none
  title: AT+MHTTPHEADER 设置HTTP特定报头
  doc: '该命令用于设置特定报头。


    参数：

    `<httpid>`客户端实例id，0~3。（注：MN319/MN319-A/MN316A/MN326A：`<httpid>`参数范围0~1。）


    `<eof>`数据输入指示。


    - `0`: header输入结束标记，需请求完成或清空后才可再次输入。

    - `1`: 后续还有header数据输入。

    - `2`: 清空已有header内容。


    `<length>`输入数据长度，0~4096，数据模式下不可设置为0，命令中直接输入数据时，设置为0，不对数据长度进行校验，设置大于0，将对输入数据的长度进行校验（ASCII字符串和带转义的字符串输入模式下：校验实际命令中输入字符串长度是否与指定长度相等；HEX字符串输入模式下：校验实际命令中输入字符串长度是否是指定长度的两倍）。（注：MN327：命令直接输入模式下，单条命令最大长度为2048，超过将报错。


    ML302S/ML307S/ML305M/ML307M/ML307H/ML307N/ML307X/ML307Y/ML307B/MR380M：数据模式下可设置为0。


    ML302A/ML305A/ML307A/ML307G/ML307R/ML307C/MR380R：命令模式长度范围0~1024；数据模式长度范围0~4096，数据模式下可设置为0。


    ML305U：数据模式下可设置为0，参数缺省时为0。）


    `<header>`特定报头数据，单次请求有效，请求结束后自动清空，如果`AT+MHTTPCFG="header"`中 设置了同样的字段，模组内部将自动使用当前设置值。（注：ML302S/ML307S/ML302A/ML305A/ML307A/ML305U/ML305M/ML307R/ML307B/ML307C/ML307G/ML307M/ML307H/ML307N/ML307X/ML307Y：字符串参数内部不能包含引号，如果字符串参数内部一定要包含引号，需使用数据模式进行发送。）'
  examples:
  - 'AT+MHTTPHEADER=0,0,0,"api-key: FC9B69m4prHH2j7ljBbA=hHlbMI="

    OK'
  source: HTTP/HTTPS用户手册 (developmentdomain/http_httpsusermanual/topics/r_at_mhttpheader.dita)

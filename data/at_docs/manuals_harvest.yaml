- cmd: AT+MBLEINIT
  syntax: AT+MBLEINIT=<mode>
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEINIT BLE初始化
  doc: '该命令用于打开或关闭 BLE 协议栈。


    参数：

    `<mode>`整型，默认关闭。（注：M5310-E/MN318：只支持初始化为从机。）


    - `0`: 关闭 BLE 协议栈

    - `1`: 激活 BLE 协议栈，初始化为从机（slave）。

    - `2`: 激活 BLE 协议栈，初始化为主机（master）。


    `<state>`整型，协议栈状态。


    - `0`: 协议栈关闭

    - `1`: 协议栈打开

    - `2`: 协议栈关闭中

    - `3`: 协议栈打开中

    - `4`: 协议栈重启中

    - `7`: RF 被占用，协议栈关闭。（注：ML302/ML305不支持该参数。）'
  examples:
  - 'AT+MBLEINIT=1

    OK

    +MBLEGAPURC: "stack",1'
  source: BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mbleinit.dita)
  models:
  - ML302
  - ML302-ENLM
  - ML302-FNLM
  - ML302-GNLM
  - ML302-INLM
  - ML302-JNLM
  - ML302-MNLM
  - ML302-QNLM
  - ML305
  - ML305-RNLM
  - MN318
  - MN318-BX

- cmd: AT+QSECSWT
  syntax: AT+QSECSWT=<type>[,<NAT_type>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+QSECSWT 设置数据加密模式
  doc: '该命令用于设置加密模式。


    参数：

    `<type>`整型。加密模式类型。 默认值0。


    - `0`: 不加密

    - `1`: 标准 DTLS 加密模式

    - `2`: DTLS+加密模式


    `<NAT_type>`整型。启用或禁用 NAT 类型，仅在标准 DTLS 加密模式下有效。 默认值0。


    - `0`: 使能 NAT，重新协商间隔时间为 30 秒 。

    - `1`: 禁用 NAT 和重新协商 。'
  examples:
  - 'AT+QSECSWT=1,1

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_qsecswt.dita)
  models:
  - MN328
  - MN328-BX

- cmd: AT+MBLESCAN
  syntax: AT+MBLESCAN=<enable>[,<time>]
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLESCAN 使能BLE扫描
  doc: '该命令用于使能或关闭BLE扫描（主机端）。


    参数：

    `<enable>`整型，使能类型。


    - `0`: 关闭扫描

    - `1`: 开始扫描


    `<time>`整型，扫描时间，单位秒（s）,范围0~65535，缺省配置0，0表示不间断扫描。


    `<result>`整型，扫描结果。


    - `0`: 成功

    - `其他`: 见错误码


    `<addr>`6字节十六进制字符串，扫描到的设备地址，"xx:xx:xx:xx:xx:xx"格式。


    `<addr_type>`整形，地址类型。


    - `0`: 未加密公用设备地址（public address）

    - `1`: 未加密随机设备地址（random device address）

    - `2`: 加密公用设备地址（RPA public address）（注：ML302/ML305不支持该参数。）

    - `3`: 加密随机设备地址（RPA random device address）（注：ML302/ML305不支持该参数。）


    `<event_type>`整型，广播事件类型。


    - `0`: 可连接可扫描非定向广播

    - `1`: 可连接的定向广播

    - `2`: 可扫描非定向广播

    - `3`: 不可连接非定向广播

    - `4`: 扫描响应


    `<rssi>`整型，信号强度，-127~20dBm。


    `<data_len>`整型，数据长度。


    `<data>`数据，数据格式由`AT+MBLECFG="encoding"`命令确定。'
  examples:
  - 'AT+MBLESCAN=1

    OK'
  source: BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mblescan.dita)
  models:
  - ML302
  - ML302-ENLM
  - ML302-FNLM
  - ML302-GNLM
  - ML302-INLM
  - ML302-JNLM
  - ML302-MNLM
  - ML302-QNLM
  - ML305
  - ML305-RNLM
  - MN318
  - MN318-BX
  sources:

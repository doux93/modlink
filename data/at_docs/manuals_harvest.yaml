  risk: none
  title: AT+MIPLADDOBJ 添加OMA Object
  doc: '该命令用于为指定设备示例添加一个object及其所属的instance。


    参数：

    `<ref>`整型，LwM2M设备实例ID。


    `<objid>`uint16类型，Object ID。


    `<inscount>`整型，实例个数。


    `<bitmap>`字符串，实例位图，字符串格式，每一个字符表示为一个实例，其中1表示可用，0表示不可用。例如当前添加的object有5个实例，其中0，3可用，则实例位图为10010。


    `<atts>`整型，属性个数，默认0。


    `<acts>`整型，操作个数，默认0。'

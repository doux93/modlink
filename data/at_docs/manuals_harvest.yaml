- cmd: AT+BLEADVPWR
  syntax: AT+BLEADVPWR=<power_level>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLEADVPWR 设置广播链路功率级别
  doc: '该命令用于设置广播链路功率等级。


    参数：

    `<power_level>`整型。广播链路发射功率等级。共 8 个等级。范围：0~7。


    `<power_value>`整型。`<power_level>`对应的功率值。单位：dB。`<power_level>`和`<power_value>`对应关系如下：


    - `0`: -20

    - `1`: -16

    - `2`: -12

    - `3`: -9

    - `4`: -5

    - `5`: 0

    - `6`: 5

    - `7`: 10'
  examples:
  - 'AT+BLEADVPWR=2

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_bleadvpwr.dita)

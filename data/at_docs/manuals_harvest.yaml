- cmd: AT+CSQ
  syntax: AT+CSQ=?
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CSQ 获取信号强度指示
  doc: '该命令用户查询信号强度。


    参数：

    `<rssi>`整型，信号强度。


    - `0`: 小于等于-113 dBm

    - `1`: -111 dBm

    - `2..30`: -109. . . -53 dBm

    - `31`: 大于等于-51 dBm

    - `99`: 未知或无法检测


    `<ber>`整型，信号误码率。暂不支持，始终返回99。


    - `0. . . 7`: 作为 RxQual 值

    - `99`: 未知或无法检测'
  examples:
  - 'AT+CSQ

    +CSQ:31,99

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_csq.dita)
  models:
  - MN328
  - MN328-BX
  sources:

    `<max_interval>`整型，最大连接间隔，单位时间1.25ms，范围6~3200，即时间范围7.5ms~4s。


    `<latency>`整型，从机延时，即从机在无数据发送时最多忽略的主机数据包个数，范围0~499。


    `<timeout>`整型，监控超时时间，单位时间10ms，范围10~3200，对应时间100ms~32s，如果在该时间段内，双方没有数据交互，就会断开连接。



- cmd: AT+MIPLNMI
  syntax: AT+MIPLNMI=<ref>,<nnmi>,<nsmi>
  category: lwm2musermanual
  kind: command
  risk: none
  title: AT+MIPLNMI 消息上报控制
  doc: '该命令用于控制平台下发请求消息上报，模组数据发送结果消息上报。目前仅OneNET支持相关功能。


    参数：

    `<ref>`整型，LwM2M设备实例ID。


    `<nnmi>`整型，接收消息上报模式。


    nnmi被置为2时，平台下发消息时模组不会有任何信息传递至MCU；


    nnmi被置为1,2时，模组队列最多保存40个下发操作，队列满后，将丢弃最先进入队列的下发操作；


    nnmi被置为1,2时，模组缓存最多保存的write、execute操作信息所带数据不超过2K，否则将会丢弃当前接收的下发操作。


    - `0`: 直接上报操作至MCU，默认模式。

    - `1`: 仅通知MCU平台有操作下发，通知格式为`+MIPLNMI`。

    - `2`: 模组不做任何通知与上报处理。


    `<nsmi>`整型，是否开启发送消息上报。


    - `0`: 关闭

    - `1`: 开启'
  examples:
  - 'AT+MIPLNMI=0,1,1

    OK'
  source: LwM2M用户手册 (developmentdomain/lwm2musermanual/topics/r_at_miplnmi.dita)

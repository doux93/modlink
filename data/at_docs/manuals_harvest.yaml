- cmd: AT+MBLEADDR
  syntax: AT+MBLEADDR=<addr_type>,<addr>
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEADDR 读取BLE设备地址
  doc: '该命令用于读取本地 BLE 设备地址。


    参数：

    `<addr_type>`整型，地址类型。（注：M5310-E/MN318：只存在公用设备地址。）


    - `0`: 公用设备地址（Public Address）

    - `1`: 随机设备地址（Random Address）


    `<addr>`6 字节十六进制字符串，设备地址格式为“xx:xx:xx:xx:xx:xx”。


    `<result>`整型，执行结果。


    - `0`: 成功

    - `其他`: 见错误码'
  examples:
  - 'AT+MBLEADDR?


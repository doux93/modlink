- cmd: AT+MBLEADV
  syntax: AT+MBLEADV=<mode>[,<duration>]
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEADV 设置BLE广播
  doc: '该命令用于使能或关闭BLE广播功能（从机端）。


    参数：

    `<mode>`整型。


    - `0`: 关闭广播

    - `1`: 开启广播


    `<duration>`整型，广播持续时间，单位毫秒（ms）,0~180000，0为持续广播，缺省默认值0。如果广播类型是高占空比定向广播，那么最多只能广播1.28s。


    `<result>`整型，执行结果。


    - `0`: 主动执行成功

    - `1`: 主动执行失败

    - `2`: 连接建立，广播中断。（连接断开后自动恢复）

    - `3`: 广播恢复

    - `4`: 广播时间到，停止广播。

    - `5`: 未知错误，停止广播。


    `<state>`整型，广播状态。


    - `0`: 广播关闭

    - `1`: 广播开启'
  examples:
  - 'AT+MBLEADV=1,1280

    OK

    +MBLEADV: 0,1'
  source: BLE用户手册 (developmentdomain/bleusermanual/topics/r_at_mbleadv.dita)

    - `1`: ADC1

    - `2`: ADC2

    - `3`: ADC3（注：仅ML302A支持ADC3。）

    - `4`: ADC4

    - `5`: ADC5

    - `6`: ADC6


    `<voltage>`整型，ADC读取电压值，单位：mV，取值范围根据不同平台而定。'

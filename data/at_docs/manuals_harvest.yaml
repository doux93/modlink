- cmd: AT+MQTTREAD
  syntax: AT+MQTTREAD=<connect_id>
  category: mqttusermanual
  kind: command
  risk: none
  title: AT+MQTTREAD 读取消息
  doc: '该命令用于缓存模式下，读取缓存中的消息。


    参数：

    `<connect_id>`整型，MQTT客户端标识。范围：0~5。


    `<count>`整型，读取消息条数。范围：1~当前缓存消息条数。


    `<store_msgs>`整型， 表示缓存中有n条数据。


    - `0`: 无缓存消息

    - `n>0`: 缓存区有n条数据


    `<total_len>`整型，表示当前已缓存数据长度。


    `<mid>`整型，数据包标识。范围：0~65535。


    `<topic>`字符串， 接收到的主题名。


    `<payload_len>`整型，本次读取到的payload长度。


    `<payload>`字符串，本次读取到的payload内容。


    > 注意：NB-IoT模组暂不支持该命令。'

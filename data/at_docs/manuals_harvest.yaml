- cmd: AT+MPING
  syntax: AT+MPING=<host>[,<timeout>[,<ping_num>[,<packet_len>[,<cid>]]]]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MPING PING服务器
  doc: '该命令用于发送ICMP包到服务器。


    参数：

    `<host>`字符串，服务器地址，字符串形式的域名或IP，最大长度255字节。


    `<timeout>`整型，ping超时时间，范围：1~60；单位：s。默认值10s。（注：MR380M：此参数不生效，仅做配置兼容。）


    `<ping_num>`整型，ping次数，范围：1~65535。默认值4。


    `<packet_len>`整型，ping包大小，范围：1~1400；单位：字节。默认值16。（注：MR380M：此参数不生效，仅做配置兼容。）


    `<cid>`整型，PDP上下文索引号，范围与`AT+CGDCONT`命令支持的范围相同，默认不指定，指定时需保证指定cid已激活。（注：M5310-E/MN316/MN316-S/MN316A/MN326A/MN319/MN319-A/MN326/ML307H/MR880A：暂不支持`<cid>`参数的配置，默认不指定。


    MN327：范围1~7，默认不指定，指定时需保证指定cid已激活。


    4G系列：默认为1。其中，ML307B：默认不指定，指定时需要保证指定cid已激活。


    MR380M：此参数不生效，仅做配置兼容。）


    `<result>`整型，每次ping的结果。


    - `0`: 成功

    - `1`: DNS 解析失败

    - `2`: DNS 解析超时

    - `3`: 响应错误

    - `4`: 响应超时

    - `5`: 其他错误


    `<ip>`字符串，服务器IP地址。


    `<time>`整型，ping包响应时长，单位：ms。


    `<ttl>`整型，ping包路由跳转次数。


    `<sent>`整型，发送ping包次数。


    `<lost>`整型，丢包次数。


    `<rtt_min>`整型，最小响应时间，单位：ms。


    `<rtt_max>`整型，最大响应时间，单位：ms。


    `<rtt_avg>`整型，平均响应时间，单位：ms。'
  examples:
  - 'AT+MPING=?

    +MPING: ,(1-60),(1-65535),(1-1400)

    OK'
  source: TCP/IP用户手册 (developmentdomain/tcp_ipusermanual/topics/r_at_mping.dita)

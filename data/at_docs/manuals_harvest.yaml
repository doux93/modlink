- cmd: AT+NPING
  syntax: AT+NPING=<remote_address>[,<p_size>][,<timeout>[,<cid>[,<count>[,<flag>]]]]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NPING 测试到远程主机的IP网络连接
  doc: '该命令用于发送ICMP包到指定服务器。


    参数：

    `<remote_address>`字符串型。发送消息的对端地址。支持 IPv4、IPv6 类型的 IP 地址。


    `<p_size>`整型。回显数据包有效负载的字节大小。若地址为 IPV4，范围为 12~1480； 若地址为 IPV6，范围为 12~1460。默认值是 12。


    `<timeout>`整型。等待回显回复响应的最大时间。范围：10~600000；单位：毫秒；默认 值：10000。


    `<cid>`整型。用于 Ping 的上下文 ID。（请参考`AT+CGDCONT`）。范围：0~10。


    `<count>`整型。发送 Ping 的次数。范围：1~5。


    `<ttl>`整型。响应包中收到的 TTL。


    `<rtt>`整型。从发送包到收到响应所经过的时间。单位：毫秒。


    `<err>`整型。提供有关 Ping 请求失败原因的相关信息。


    - `1`: 在超时期间远端主机没有响应

    - `2`: 发送 Ping 请求失败


    `<flag>`整型。指定消息传输类型。此参数的值为十六进制格式。释放指示不支持 UP 模式。若未指定，则参数值将设置为 0。


    - `0x200`: 释放指示：表示该条消息发送后释放

    - `0x400`: 释放指示：表示收到该消息的回复后释放'
  examples: []
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nping.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nping.dita)

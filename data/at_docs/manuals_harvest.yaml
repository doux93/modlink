- cmd: AT+CPSMS
  syntax: AT+CPSMS=[<mode>[,<Requested_Periodic-RAU>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CPSMS 设置省电模式
  doc: '该命令用于设置UE省电模式。


    参数：

    `<mode>`整型， 禁用或使能 UE 的 PSM。 默认值1。


    - `0`: 禁用 PSM。

    - `1`: 启用 PSM。

    - `2`: 禁用 PSM 并删除 PSM 的所有参数，如果有默认参数，则重置为默认。


    `<Requested_Periodic-RAU>`NB-IoT不涉及，忽略该参数。


    `<Requested_GPRS-READY-timer>`NB-IoT不涉及，忽略该参数。


    `<Requested_Periodic-TAU>`字符串， 8 位格式的一个字节。表示请求的将在 E-UTRAN 分配给 UE 的扩展周期性 TAU 值（T3412），且被编码为 GPRS Timer
    3 信息的一个 字节（octet 3）（例如，“01000111”等于 70 小时）。 第 5 位到第 1 位表示二进制编码定时器值。 第 6 位到第 8 位定义了定时器值的单位 。默认值 为 10
    小时 。


    `<Requested_Active-Time>`字符串， 8 位格式的一个字节。表示将分配给 UE 的请求激活时间值 （T3324），且被编码为 GPRS Timer 2 信息的一个字节（octet
    3）（例 如，“00100100”等于 4 分钟）。 第 5 位到第 1 位表示二进制编码定时器值。 第 6 位到第 8 位定义了 GPRS 定时器值的有效时间值单位 。默认值为10秒。'
  examples:
  - 'AT+CPSMS=1,,,"00100011","00100010"

    OK

    AT+CPSMS?

    +CPSMS:1,,,"00100011","00100010"

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cpsms.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cpsms.dita)

- cmd: AT+CCLK
  syntax: AT+CCLK=<time>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+CCLK 返回当前日期和时间
  doc: '该命令用于查询或设置模组时间。


    参数：

    `<time>`字符串。 格式为“yy/MM/dd,hh:mm:ss±zz”，各字符分别表示年（最后两位数字）、月、日、 时、分、秒及时区（表示当地时间与 GMT 的时差，以 15 分钟为单位，范围为-96~+96）。
    例如，1994 年 5 月 6 日，22:10:00 GMT+2 小时相当于"94/05/06,22:10:00+08"。'
  examples:
  - 'AT+CCLK?

    +CCLK:24/01/09,05:36:42+32

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_cclk.dita)
  models:
  - MN328
  - MN328-BX

- cmd: AT+MBLEWHITELIST
  syntax: AT+MBLEWHITELIST=<mode>[,<addr_type>,<addr>]
  category: bleusermanual
  kind: command
  risk: none
  title: AT+MBLEWHITELIST 设置白名单
  doc: '该命令用于设置本地设备白名单。


    参数：

    `<mode>`整型，设置为 0 和 1 时，后续参数必须设置。


    - `0`: 添加设备至白名单。

    - `1`: 从白名单中删除该设备。

    - `2`: 清空白名单。


    `<addr_type>`整型，地址类型。


    - `0`: 公用设备地址（Public Address）

    - `1`: 随机设备地址（Random Address）


    `<addr>`6 字节十六进制字符串，设备地址，需按照“xx:xx:xx:xx:xx:xx”格式输入。


    `<write_size>`整型，已设置的白名单数量。


    `<total_size>`整型，可设置的白名单总数量。


    `<result>`整型，执行结果。


    - `0`: 成功

    - `其他`: 见错误码'
  examples:
  - 'AT+MBLEWHITELIST=0,1,"f8:7f:24:87:1c:f7"

    OK'

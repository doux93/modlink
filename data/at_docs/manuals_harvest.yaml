- cmd: AT+MIPLREADRSP
  syntax: AT+MIPLREADRSP=<ref>,<mid>,<result>[,<objid>,<insid>,<resid>,<type>,<len>,<value>,<index>,<flag>]
  category: lwm2musermanual
  kind: command
  risk: none
  title: AT+MIPLREADRSP 读操作请求响应
  doc: '该命令用于在接收到`+MIPLREAD`消息后，返回所读取到的资源值。


    参数：

    `<ref>`整型，LwM2M设备实例ID。


    `<mid>`uint16类型，该resource所属的instance observe操作时下发的`<mid>`。


    `<result>`整型，操作结果。


    - `1`: Content OK

    - `11`: Bad Request

    - `12`: Unauthorized

    - `13`: Not Found

    - `14`: Method Not Allowed

    - `15`: Not Acceptable


    `<objid>`uint16类型，Object ID。


    `<insid>`uint16类型，Instance ID。


    `<resid>`uint16类型，Resource ID。


    `<type>`整型，指定响应资源的数据类型。


    - `1`: String

    - `2`: Opaque（注：Opaque类型2为透传类型，通过AT命令输入16进制字符串将被模组转换为ASCII码后上传至平台。）

    - `3`: Integer

    - `4`: Float

    - `5`: Bool

    - `6`: Hex str（注：Hex_str类型6为16进制字符串，将被模组转换为ASCII码后以string类型1上传至平台。）


    `<len>`整型，value的值的长度。模组会依据当前的值的范围上报报文做优化算法，无需指定`<len>`。（注：ML307C：最大长度1024字节。）


    `<value>`字符串，上报的数据值。（注：ML307C：最大传入1024字节字符串。）


    `<index>`整型，命令序号。若某个READRSP操作需要N条报文组合为一完整命令，则index从N-1至0降序编号，当index编号为0时表示本次READRSP命令结束。直接置0亦可。


    `<flag>`整型，消息标识。`<flag>`参数为1和2时，当前报文暂不发送；当`<flag>`为0时，会将同一object下同一instance下的未发送resource一起组包上报。


    - `1`: 第一条报文

    - `2`: 中间报文

    - `0`: 最后一条报文'
  examples:
  - '+MIPLREAD:0,18172,3200,0,5750

    AT+MIPLREADRSP=0,18172,11

    OK

    +MIPLREAD:0,18172,3200,0,-1

    AT+MIPLREADRSP=0,18172,1,3200,0,5500,5,1,"0",2,1

    OK

    AT+MIPLREADRSP=0,18172,1,3200,0,5501,3,3,"-12",1,2

    OK

    AT+MIPLREADRSP=0,18172,1,3200,0,5750,1,4,"test",0,0

    OK'
  source: LwM2M用户手册 (developmentdomain/lwm2musermanual/topics/r_at_miplreadrsp.dita)

    +MIPSTATE: 0,"TCP","120.27.12.119",2040,"CONNECTED"

    +MIPSTATE: 1,"TCP","120.27.12.119",2040,"CONNECTING"

    +MIPSTATE: 2,,,,"INITIAL"

    +MIPSTATE: 3,"UDP","120.27.12.119",2040,"CONNECTED"

    +MIPSTATE: 4,,,,"INITIAL"

    OK'

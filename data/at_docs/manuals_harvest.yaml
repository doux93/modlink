- cmd: AT+BLEPAIRCFG
  syntax: AT+BLEPAIRCFG=<io_cap>,<bond_able>,<secure_mode>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLEPAIRCFG 配对能力配置
  doc: '该命令用于设置配对能力。


    参数：

    `<io_cap>`整型。设备输入输出能力。 默认值0。


    - `0`: 设备只有显示能力，没有输入能力（DISPLAYONLY）

    - `1`: 设备有显示能力，有输入 YES/NO 的能力（DISPLAYYESNO）

    - `2`: 设备没有输出能力，有输入数字的能力（KEYBOARDONLY）

    - `3`: 设备没有输出输入能力（NOINPUTNOOUTPUT）

    - `4`: 设备具有输入数字和显示的能力（KEYBOARDDISPLAY）


    `<bond_able>`整型。配对后是否需要绑定。 默认值0。


    - `0`: 不需要绑定

    - `1`: 需要绑定


    `<secure_mode>`整型。链路安全等级。


    - `0`: 链路不加密传输（NO_ENCRYPTION）

    - `1`: 链路加密传输，但没有鉴权（ENCRYPTION_NO_MITM）

    - `2`: 链路加密鉴权传输（ENCRYPTION_WITH_MITM）

    - `3`: 链路使用 ECDH 加密鉴权传输（SC_ENCRYPTION_WITH_MITM）'
  examples:
  - 'AT+BLEPAIRCFG=0,0,0

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blepaircfg.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_blepaircfg.dita)

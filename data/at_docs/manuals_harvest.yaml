  content_hash: ca46e834dbaae40057e65757db9c7078a92c7c557dd1d37db32c7db3322373f9
- cmd: AT+BLEPARAMUPDATE
  syntax: AT+BLEPARAMUPDATE=<conn_hdl>,<interval_min>,<interval_max>,<slave_latency>,<sup_timeout>
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+BLEPARAMUPDATE 更新连接参数
  doc: '该命令用于更新连接参数。


    参数：

    `<conn_hdl>`整型。BLE 连接句柄。


    `<interval_min>`整型。连接事件间隔最小值。范围：6~3200；单位：1.25 毫秒；对应的时间范围： 7.5 毫秒~4 秒。


    `<interval_max>`整型。连接事件间隔最大值。范围：6~3200；单位：1.25 毫秒；对应的时间范围： 7.5 毫秒~4 秒。


    `<interval>`整型。连接事件间隔值。单位：1.25 毫秒。


    `<slave_latency>`整型。从设备延时对应的`<interval>`的数目，即从设备最多忽略主设备数据包的个 数。范围：0~499。


    `<sup_timeout>`整型。监控超时时间。如果在该时间段内，双方没有数据交互，就会断开连接。 取值范围：10~3200；单位：10 毫秒；对应的时间范围：100 毫秒~32 秒。'
  examples:
  - 'AT+BLEPARAMUPDATE=64,480,480,5,3200

    OK

    +BLEPARAMUPDATE:64,480,5,3200'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_bleparamupdate.dita)
  models:
  - MN328
  - MN328-BX
  sources:

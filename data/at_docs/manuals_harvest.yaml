- cmd: AT+MIPSRVCLOSE
  syntax: AT+MIPSRVCLOSE=<sid>[,<mode>]
  category: tcp_ipusermanual
  kind: command
  risk: none
  title: AT+MIPSRVCLOSE 关闭服务器模式
  doc: '该命令用于关闭服务器。


    参数：

    `<sid>`整型，服务器实例id，用于标识操作的服务器实例。范围：0~3。


    `<mode>`整型，仅对TCP有效，socket关闭模式，默认值0。（注：MR880A：不支持`<mode>`参数配置，关闭方式为模式4，其中MSL=30s。）


    - `0`: 等待发送缓存区数据发送完毕后（不等待2MSL），关闭TCP连接。

    - `1`: 立即关闭不等待缓存区数据发送完毕（不等待2MSL）。

    - `2`: 不等待发送缓存区数据发送完毕，等待 2MSL（Maximum Segment Lifetime，最大分段报文生存周期） 后关闭。如果建立连接时未指定本地端口，关闭连接时等待的时间将不影响下一次创建，可忽略该等待时间；如果建立连接时指定了本地端口，关闭连接时该端口将在2MSL后才可使用。该等待的起始时间为最后一次数据交互的时间，所以资源释放等待时间为小于等于2MSL。

    - `3`: 向服务器发送RST消息重置连接后关闭。

    - `4`: 等待发送缓存区数据发送完毕后，再等待 2MSL（Maximum Segment Lifetime，最大分段报文生存周期） 后关闭。等待2MSL策略与模式2相同。'
  examples:
  - 'AT+MIPCLOSE=0

    OK'
  source: TCP/IP用户手册 (developmentdomain/tcp_ipusermanual/topics/r_at_mipsrvclose.dita)

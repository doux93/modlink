- cmd: AT+NMGS
  syntax: AT+NMGS=<length>,<data>[,<seq_num>]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NMGS 发送消息
  doc: '该命令用于向平台发送数据。


    参数：

    `<length>`整型。消息的长度。十进制。最大值：1024。单位：字节。


    `<data>`十六进制字符串型。待传输的数据。


    `<seq_num>`数据序列号。范围：0~255。如果使用非 0 的`<seq_num>`发送 CoAP 数据，且当前有携带相同`<seq_num>`的 NON 类型 CoAP 数据未发送完成，那么会将数据丢弃并返回错误。若`<seq_num>`为
    0 则被忽略 。'
  examples:
  - 'AT+NMGS=3,AA11BB

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nmgs.dita)

- cmd: AT+NSOSD
  syntax: AT+NSOSD=<socket>,<length>,<data>[,<flag>[,<sequence>]]
  category: customproject_atcommandsreferenceguide
  kind: command
  risk: none
  title: AT+NSOSD 发送消息（仅限TCP）
  doc: '该命令用于发送TCP数据。


    参数：

    `<socket>`整型， socket 编号。范围：0~6。


    `<length>`整型。表示发送的数据长度。十进制格式。默认最大长度为 1358 字节，实际取决 于网络下发的 MTU 值。


    `<data>`十六进制字符串型。要传输的数据。


    `<flag>`整型。指定消息传输的类型。此参数的值为十六进制格式。 当前不支持。 释放指示不支持 UP 模式。若未指定 ，则参数值将设置为 0。


    - `0x100`: 异常消息：发送具有高优先级的消息

    - `0x200`: 释放指示：指示该条消息发送后释放

    - `0x400`: 释放指示：表示收到该消息的回复后释放


    `<sequence>`整型。数据的序列。范围：0~255。如果省略，则不会上报数据发送状态；如果不省略，当服务器应答数据帧或 UE 丢弃数据帧时，将上报以下结果：`+NSOSTR:<socket>,<sequence>,<status>`'
  examples:
  - 'AT+NSOSD=1,2,AB30

    1,2

    OK'
  source: MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nsosd.dita)
  models:
  - MN328
  - MN328-BX
  sources:
  - MN328-BX AT命令用户手册 (developmentdomain/customproject_atcommandsreferenceguide/topics/r_at_nsosd.dita)

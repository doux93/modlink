- cmd: AT+MQTTPUB
  syntax: AT+MQTTPUB=<connect_id>,<topic>,<qos>,<retain>,<dup>,<msg_len>[,<message>]
  category: mqtt
  kind: command
  risk: none
  title: AT+MQTTPUB 发布消息
  doc: '该命令用于向服务器发送指定topic的消息，使用时根据消息性质选择QoS等级。


    参数：

    `<connect_id>`整型，MQTT客户端标识。范围：0~5。（注：MN316A/MN326A/MN319/MN319-A范围：0~2。）


    `<topic>`字符串，发布的主题。（注：ML302A/ML305A/ML307A/ML302S/ML307S/ML307R/ML307B/ML307C/ML305M/ML307G/MR880A/ML307M/ML307N/ML307H：长度最大为256。）


    `<qos>`整型，发布消息质量等级。范围：0~2。


    `<retain>`整型，服务器是否存储该消息。


    - `0`: 服务器不存储该消息

    - `1`: 服务器储存该消息，并向新订阅者发送最新订阅消息。


    `<dup>`整型， 重发标志，范围：0~1。数据发送失败后用户主动重发数据请置1，发送新消息一般设置为0。


    `<msg_len>`整型，待发布消息长度。当输入模式设置为Hex字符串时，消息长度为转换后的长度；设置为其他模式即表示原始输入的数据长度；长度设置为0时，按照实际输入的数据发送。（注：ML302A/ML305A/ML307A/ML302S/ML307S/ML307R/ML307B/ML307C/ML305M/ML307G/ML307M/ML307N/ML307H命令中直接输入数据和数据模式下的范围：0~1024；单位：字节。


    MR880A命令中直接输入数据时的范围：0~2048；数据模式下的范围：0~8192；单位：字节。


    ML307X/ML307Y命令中直接输入数据时的范围：0~2048；数据模式下的范围：0~4000；单位：字节。）


    `<message>`字符串，待发布消息，当此参数省略时进入数据模式。（注：M5310-E/MN327/MN328/MN326A/MN316/MN316-S/MN316A/MN318/MN319/MN319-A/MN326：不支持进入数据模式。


    ML307X/ML307Y：在数据模式下，输入数据达到指定长度或超过10s时自动发送数据。


    MR880A：在数据模式下，输入数据达到指定长度或超过10s后自动发送数据，`<msg_len>`设置为0时，输入`ctrl+z`也将发送数据。数据模式最大发送长度为8192，当配置的`<msg_len>`超过8192时按照8192截取计算。）


    `<mid>`整型，数据包标识。范围：0~65535。


    `<length>`整型，已发送MQTT报文长度。'
  examples:
  - 'AT+MQTTPUB=0,"world",0,0,0,4,"3242"

    +MQTTPUB: 0,18797,13

    OK'
  - 'AT+MQTTPUB=0,"world",1,0,0,4,"3242"

    +MQTTPUB: 0,18798,15

    OK

    +MQTTURC: "puback",0,18798,0'

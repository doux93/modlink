- cmd: +MQTTURC
  syntax: +MQTTURC
  category: mqtt
  kind: urc
  risk: none
  title: MQTT URC信息上报
  doc: 'MQTT URC信息上报集合。


    参数：

    命令标识（第一个参数）


    - `"conn"`: MQTT连接状态发生变化事件上报。

    - `"pubnmi"`: 新数据包上报（New Message Indication），提示从缓存区读取数据包。

    - `"drop"`: 提示接收缓存区满，丢掉数据。

    - `"publish"`: 接收到的MQTT Publish数据。

    - `"pingresp"`: 配置心跳回显时，上报心跳包响应结果。

    - `"timeout"`: 数据发送超时事件上报（仅上报订阅、取消订阅、发布最终超时结果，重传包超时不上报）。

    - `"suback"`: 收到服务器订阅ACK信息上报。

    - `"unsuback"`: 收到服务器取消订阅ACK信息上报。

    - `"puback"`: QoS1模式下的发布响应ACK信息上报。

    - `"pubrec"`: QoS2模式下的发布响应Receive上报。

    - `"pubcomp"`: QoS2模式下的发布响应Complete上报。


    `<connect_id>`整型，MQTT客户端标识。范围：0~5。（注：MN316A/MN326A/MN319/MN319-A范围：0~2。）


    `<mid>`整型，数据包标识。范围：0~65535。


    `<conn_state>`整型，当前连接状态。


    - `0`: MQTT连接成功

    - `1`: 正在重连

    - `2`: 断开：用户主动断开

    - `3`: 断开：拒绝连接（协议版本、标识符、用户名或密码错误）

    - `4`: 断开：服务器断开

    - `5`: 断开：Ping包超时断开（若服务器未在1.5倍保活时间内接收到客户端的消息，则相当于客户端发送了 DISCONNECT消息，服务器会断开与客户端的连接，此时会上报该URC。）

    - `6`: 断开：网络异常断开

    - `255`: 断开：未知错误

    - `7~254`: 保留


    `<code>`整型，服务器反馈码。多条消息订阅时，按照订阅顺序返回对应的结果。


    - `0`: 订阅成功QoS=0

    - `1`: 订阅成功QoS=1

    - `2`: 订阅成功QoS=2

    - `128`: 订阅失败


    `<data_len>`整型，接收数据长度。


    `<dropped_length>`整型，丢弃的数据长度。


    `<topic>`字符串，订阅的主题。


    `<total_len>`整型，负载总长度。


    `<payload_len>`整型，当前输出负载信息的长度。


    `<payload>`字符串，当前输出的负载信息。


    `<ping_ret>`整型，心跳上报结果。


    - `0`: 心跳上报成功

    - `1`: 心跳上报超时


    `<dup>`整型，重发标志。


    - `0`: 非重发数据

    - `1`: 重发数据


    > 注意：ML302A/ML305A/ML307A/ML307R/ML307B/ML307C/ML307X/ML307Y/ML307N：publish的URC中`topic+msg`总长度超过512字节会进行分包。'

  - ML307N
  - ML307R
  - ML307X
  - MR880A
  sources:
  - developmentdomain/ftpusermanual/topics/r_at_mftpstor.dita
- cmd: AT+MFTPSTATE
  syntax: AT+MFTPSTATE=<connect_id>
  category: ftp
  kind: command
  risk: none
  title: AT+MFTPSTATE 查询FTP状态
  doc: '本命令用于查询当前FTP连接状态。


    参数：

    `<connect_id>`整型，FTP连接通道ID，范围：0~5。


    `<state>`整型，范围：0~3。


    - `0`: FTP连接处于未建立状态

    - `1`: FTP连接处于已建立状态

    - `2`: 正在进行FTP文件下载

    - `3`: 正在进行FTP文件上传'
  examples:
  - 'AT+MFTPSTATE=0

    +MFTPSTATE: 0,1

    OK'
  source: developmentdomain/ftpusermanual/topics/r_at_mftpstate.dita
  models:

commands:
- cmd: AT+MFTPCFG
  syntax: AT+MFTPCFG=<connect_id>[,"data_type"[,<data_trans_type>]]
  category: ftp
  kind: command
  risk: none
  title: AT+MFTPCFG 配置FTP参数
  doc: '本命令用于配置FTP相关操作的参数配置。


    参数：

    `<connect_id>`整型，FTP连接通道ID，范围：0~5。


    `<data_trans_type>`整型，FTP数据传输类型，范围：0~1，默认值0。


    - `0`: Binary

    - `1`: ASCII


    `<trans_mode>`整型，FTP传输模式。范围：0~1，默认值1。（注：ML302A/ML305A/ML307A/ML305U/ML307R/ML307B/MR880A/ML307N/ML307X/ML307C：只支持被动模式。）


    - `0`: 主动模式

    - `1`: 被动模式


    `<timeout>`整型，FTP命令超时响应时间。范围：2~30；单位：s。默认值10。


    `<ssl_mode>`整型，FTP客户端SSL模式。范围：0~2，默认值0。（注：ML302A/ML305A/ML307A/ML305U/ML307R/ML307B/MR880A/ML307N/ML307X/ML307C：只支持通用FTP。）


    - `0`: 通用FTP

    - `1`: 隐式FTPS

    - `2`: 显式FTPS


    `<ssl_id>`整型，默认值0。


    - `0~5`: SSL索引ID


    `<fs_trans_type>`整型，FTP文件传输方式。范围：0~1，默认值0。


    - `0`: 通过串口输入输出方式传输

    - `1`: 通过本地文件系统方式传输


    `<pdp_cid>`整型，FTP的PDP索引id。范围：1~15，默认值1。（注：ML305U范围：1~7。


    ML307X：默认不指定`<pdp_cid>`，指定时需保证`<pdp_cid>`已激活。


    ML307B：默认不指定`<pdp_cid>`，指定时需保证`<pdp_cid>`已激活，范围：0~4。


    MR880A/ML307N：不支持cid配置。）'
  examples:
  - 'AT+MFTPCFG=0,"ssl",0,0

    OK'
  - 'AT+MFTPCFG=0,"data_type",1

    OK'
  source: developmentdomain/ftpusermanual/topics/r_at_mftpcfg.dita
  models:
  - ML302A
  - ML305A
  - ML305U
  - ML307A
  - ML307B
  - ML307C
  - ML307N
  - ML307R
  - ML307X
  - MR880A
  sources:
  - developmentdomain/ftpusermanual/topics/r_at_mftpcfg.dita
- cmd: AT+MFTPCONN
  syntax: AT+MFTPCONN=<connect_id>,<ip/hostname>[,<username>[,<password>[,<port>]]]
  category: ftp
  kind: command
  risk: none
  title: AT+MFTPCONN 建立FTP连接
  doc: '本命令通过配置连接通道ID，远端服务器ip地址，远端服务器端口号，用户名与密码来建立FTP连接。


    参数：

    `<connect_id>`整型，FTP连接通道ID，范围：0~5。


    `<ip/hostname>`字符串，目标IP或者主机名，最大长度255字节。


    `<username>`字符串，登录用户名，最大长度255字节。


    `<password>`字符串，登录密码或鉴权信息，最大长度255字节。


    `<port>`整型，默认值21。


    - `0~65535`: 目标端口号


    `<result_code>`整型，结果码。


    - `0`: 连接成功

    - `其他`: 连接失败'
  examples:
  - 'AT+MFTPCONN=0,"2001:608:c00:180::1:ea"

    OK

    +MFTPCONN: 0,0'
  - 'AT+MFTPCONN=1,"115.29.109.79","uftp","12341",21

    OK

    +MFTPCONN: 1,0'
  source: developmentdomain/ftpusermanual/topics/r_at_mftpconn.dita
  models:
  - ML302A
  - ML305A
  - ML305U
  - ML307A
  - ML307B
  - ML307C
  - ML307N
  - ML307R
  - ML307X
  - MR880A
  sources:
  - developmentdomain/ftpusermanual/topics/r_at_mftpconn.dita

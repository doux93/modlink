    `<result_code>`整型， 结果码。


    - `0`: 断开连接成功

    - `其他`: 断开连接失败'
  examples:
  - 'AT+MFTPDISC=?

    +MFTPDISC: (0-5)

    OK'
  - 'AT+MFTPDISC=0

    OK

    +MFTPDISC: 0,0

    +MFTPURC: 0,"conn",0'

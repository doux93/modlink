  title: +MFTPURC URC信息上报
  doc: '该命令为FTP相关URC上报提示，包含连接状态变化事件。


    参数：

    `<connect_id>`整型，FTP连接通道ID，范围：0~5。


    `<state_code>`整型，状态连接码。


    - `0`: FTP已断开'

- cmd: AT+MFTPRETR
  syntax: AT+MFTPRETR=<connect_id>,<file_name>[,<local_file_name>[,<offset>[,<length>]]]
  category: ftp
  kind: command
  risk: none
  title: AT+MFTPRETR 从服务器获取文件
  doc: '本命令用于从FTP服务器获取文件操作。


    参数：

    `<connect_id>`整型，FTP连接通道ID，范围：0~5。


    `<file_name>`字符串，需要获取的文件名称，最大长度255字节。


    `<local_file_name>`字符串，最大长度255字节。（注：ML307B：最大长度64字节。）


    - `+MFTPCFG命令中"local_fs"为0`: 本参数域段无效

    - `+MFTPCFG命令中"local_fs"为1`: 本参数域段表示为保存在模组本地的文件名称，必须存在。


    `<offset>`整型，需要获取的文件起始偏移位置，最大长度建议不超过文件的大小，默认值0。


    `<length>`整型，从起始偏移开始，需获取文件的内容长度。与`<offset>`之和建议不超过文件大小，默认值为从`<offset>`位置开始文件剩余内容大小。（注：ML307C：默认值为
    0，表示从`<offset>`位置开始获取文件剩余全部内容。）


    `<result_code>`整型， 结果码。


    - `0`: 操作成功

    - `其他`: 操作失败


    `<sum_size>`整型，已下载文件数据的累计长度。


    `<recv_size>`整型，当前获取的文件数据的长度。


    `<data>`字符串，当前获取的文件数据内容。'
  examples:
  - 'AT+MFTPRETR=0,"test1.txt"

    OK

    +MFTPRETR: 0,0,23,23,BBBBBbbbbb+MFTPAPP TEST

    AT+MFTPRETR=0,"test1.txt",,5

    OK

    +MFTPRETR: 0,0,18,18,bbbbb+MFTPAPP TEST

    AT+MFTPRETR=0,"test1.txt",,5,5

    OK

    +MFTPRETR: 0,0,5,5,bbbbb'
  - 'AT+MFTPRETR=0,"test1.txt","/usr/1.txt"

    OK

    +MFTPRETR: 0,0,23,23'
  source: developmentdomain/ftpusermanual/topics/r_at_mftpretr.dita
  models:
  - ML302A
  - ML305A
  - ML305U
  - ML307A
  - ML307B
  - ML307C
  - ML307N
  - ML307R
  - ML307X
  - MR880A
  sources:
  - developmentdomain/ftpusermanual/topics/r_at_mftpretr.dita
- cmd: AT+MFTPAPPE
  syntax: AT+MFTPAPPE=<connect_id>,<file_name>[,<eof>[,<length>[,<data>]]]
  category: ftp
  kind: command
  risk: none
  title: AT+MFTPAPPE 向服务器上传文件
  doc: '本命令用于向FTP服务器上传文件操作。


    参数：

    `<connect_id>`整型，FTP连接通道ID，范围：0~5。


    `<eof>`整型，范围：0~1。


    - `0`: 表示当前发送数据包不是最后一包，后续还有数据包输入。

    - `1`: 表示当前发送数据包为最后一包。


    `<length>`整型，范围：1~4096。


    - `<eof>存在<length>、<data>缺省`: 后续回显’>’，提示用户输入data内容，以ctrl+z结束。

    - `1~4096`: 后续回显’>’，提示用户输入data内容，当数据长度达到length值时表示内容结束。


    `<file_name>`字符串，上传到服务器的文件命名，最大长度255字节。


    `<data>`字符串，FTP服务器中指定文件写入的数据内容，单位：字节。（注：数据模式输入`<data>`时`<data>`长度范围为1~4096；普通模式输入`<data>`时`<data>`长度范围为1~1024。）


    `<result_code>`整型，结果码。


    - `0`: 操作成功

    - `其他`: 操作失败


    `<sent_length>`整型， 上传的文件长度上报。


    `<local_file_name>`字符串，最大长度255字节。（注：ML307B：最大长度64字节。）


    - `+MFTPCFG指令中"local_fs"为0`: 本参数域段无效

    - `+MFTPCFG指令中"local_fs"为1`: 模组本地的文件名称'
  examples:
  - 'AT+MFTPAPPE=0,"test1.txt",1,5

    >BBBBB

    OK

    +MFTPAPPE: 0,0,5'
  - 'AT+MFTPAPPE=0,"test1.txt",1

    >bbbbb(ctrl+z)

    OK

    +MFTPAPPE: 0,0,5'
  source: developmentdomain/ftpusermanual/topics/r_at_mftpappe.dita
  models:
  - ML302A
  - ML305A
  - ML305U
  - ML307A
  - ML307B
  - ML307C
  - ML307N
  - ML307R
  - ML307X
  - MR880A
  sources:
  - developmentdomain/ftpusermanual/topics/r_at_mftpappe.dita
- cmd: AT+MFTPSTOR
  syntax: AT+MFTPSTOR=<connect_id>,<file_name>[,<eof>[,<length>[,<data>]]]
  category: ftp
  kind: command
  risk: none
  title: AT+MFTPSTOR 向服务器覆盖写入文件

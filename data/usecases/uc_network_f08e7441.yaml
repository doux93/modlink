schema: modulink/diagflow@1
id: uc_network_f08e7441
name: 网络配置 · PSM模式配置与查询
kind: usecase
category: network
source: MN316-S 通信流程示例
verified: false
applies_to:
- m5310-e
- m5311-e
- mn316
- mn316-s
- mn316a
- mn318
- mn319-a
- mn326
- mn326a
- mn327
steps:
- id: s1
  title: AT+CPSMS=1,,,"00101111","00100010"
  send:
  - AT+CPSMS=1,,,"00101111","00100010"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: AT+CEREG=5
  send:
  - AT+CEREG=5
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: AT+CEREG?
  send:
  - AT+CEREG?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CEREG\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CEREG（final={final}）
    abort: true

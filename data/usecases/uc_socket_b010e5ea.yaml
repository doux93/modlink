schema: modulink/diagflow@1
id: uc_socket_b010e5ea
name: IPv6入网配置 · 确认IPv6入网
kind: usecase
category: socket
source: MF308C 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 配置PDP类型为"IPv4v6"双栈模式
  send:
  - AT+CGDCONT=1,"IPV4V6",""
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: AT+CGDCONT?
  send:
  - AT+CGDCONT?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGDCONT\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGDCONT（final={final}）
    abort: true
- id: s3
  title: 更改PDP类型为“IPv6”单栈模式
  send:
  - AT+CGDCONT=1,"IPV6",""
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s4
  title: AT+CGDCONT?
  send:
  - AT+CGDCONT?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGDCONT\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGDCONT（final={final}）
    abort: true
- id: s5
  title: AT+COPS?
  send:
  - AT+COPS?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+COPS\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +COPS（final={final}）
    abort: true
- id: s6
  title: 建立业务连接
  send:
  - AT+MIPCALL=1,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPCALL\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPCALL（final={final}）
    abort: true
- id: s7
  title: AT+COPS?
  send:
  - AT+COPS?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+COPS\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +COPS（final={final}）
    abort: true
- id: s8
  title: 建立业务连接
  send:
  - AT+MIPCALL=1,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPCALL\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPCALL（final={final}）
    abort: true

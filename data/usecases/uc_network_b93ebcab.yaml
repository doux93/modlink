schema: modulink/diagflow@1
id: uc_network_b93ebcab
name: 网络配置 · eDRX模式配置与查询
kind: usecase
category: network
source: MN316-S 通信流程示例
verified: false
applies_to:
- m5311-e
- mn316-s
- mn316a
- mn318
- mn319-a
- mn326
- mn326a
- mn327
steps:
- id: s1
  title: AT+MPTWEDRXS=1,5,"0001","0011"
  send:
  - AT+MPTWEDRXS=1,5,"0001","0011"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: AT+CEDRXRDP
  send:
  - AT+CEDRXRDP
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CEDRXRDP\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CEDRXRDP（final={final}）
    abort: true

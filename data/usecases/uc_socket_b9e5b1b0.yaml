schema: modulink/diagflow@1
id: uc_socket_b9e5b1b0
name: UDP/TCP数据接收 · UDP数据接收
kind: usecase
category: socket
source: MN316 通信流程示例
verified: false
applies_to:
- mn316
- mn316a
steps:
- id: s1
  title: 提示0# socket接收到30 Bytes数据。
  send:
  - AT+NSORF=<socket>,<req_length>
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSONMI\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSONMI（final={final}）
    abort: true
- id: s2
  title: 读取接收到的30 Bytes数据。
  send:
  - AT+NSORF=0,30
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSORF\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSORF（final={final}）
    abort: true

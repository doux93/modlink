schema: modulink/diagflow@1
id: uc_mqtt_16a6237e
name: MQTT示例 · 断开连接-销毁参数配置
kind: usecase
category: mqtt
source: MQTT用户手册
verified: false
applies_to: []
steps:
- id: s1
  title: 断开连接
  send:
  - AT+MQTTDISC
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MQTTDISC\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MQTTDISC（final={final}）
    abort: true
- id: s2
  title: 释放资源，之后可以再次使用+MQTTCFG进行配置。
  send:
  - AT+MQTTDEL
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

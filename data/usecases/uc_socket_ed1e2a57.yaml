schema: modulink/diagflow@1
id: uc_socket_ed1e2a57
name: IPv6入网配置
kind: usecase
category: socket
source: ML307G 通信流程示例
verified: false
applies_to:
- ml307g
- ml307h
- ml307n
steps:
- id: s1
  title: 去激活PDP
  send:
  - AT+MIPCALL=0,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPCALL\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPCALL（final={final}）
    abort: true
- id: s2
  title: 更改PDP类型为“IPV4V6”双栈模式
  send:
  - AT+CGDCONT=1,"IPV4V6",""
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 激活PDP
  send:
  - AT+MIPCALL=1,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPCALL\b
    timeout_ms: 15000
  evaluate:

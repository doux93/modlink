schema: modulink/diagflow@1
id: uc_socket_995e0836
name: UDP/TCP数据接收 · 数据多模式发送
kind: usecase
category: socket
source: ML302A 通信流程示例
verified: false
applies_to:
- ml302a
- ml302s
- mr880a
steps:
- id: s1
  title: 0#建立TCP连接，普通接收模式。
  send:
  - AT+MIPOPEN=0,"TCP","120.27.12.119",2016,60,0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPOPEN（final={final}）
    abort: true
- id: s2
  title: 输入配置为HEX模式
  send:
  - AT+MIPCFG="encoding",0,1,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: connect_id为0的连接发送HEX字符串01334537
  send:
  - AT+MIPSEND=0,4,"01334537"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPSEND\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPSEND（final={final}）
    abort: true
- id: s4
  title: 输入配置为转义字符模式
  send:
  - AT+MIPCFG="encoding",0,2,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s5
  title: www.baidu.com/ //connect_id为0的连接发送66字节转义字符数据
  send:
  - 'AT+MIPSEND=0,66,"GET https:'
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPSEND\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPSEND（final={final}）
    abort: true

schema: modulink/diagflow@1
id: uc_socket_7226bacc
name: IPv6入网配置 · 确认IPV6入网
kind: usecase
category: socket
source: 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 确认模组已附着上网络
  send:
  - AT+CEREG?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CEREG\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CEREG（final={final}）
    abort: true

schema: modulink/diagflow@1
id: uc_socket_7c2e1858
name: UDP/TCP休眠策略 · TCP休眠策略
kind: usecase
category: socket
source: MN319-A 通信流程示例
verified: false
applies_to:
- mn319-a
steps:
- id: s1
  title: 关闭深睡眠模式，并保存flash。
  send:
  - AT+MLPMCFG="sleepmode",1,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 1#建立TCP连接，普通接收模式。
  send:
  - AT+MIPOPEN=1,"TCP","120.27.12.119",2016,60,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 1#发送数据11Bytes。
  send:
  - AT+MIPSEND=1,11,"12345678900"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPSEND\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPSEND（final={final}）
    abort: true
- id: s4
  title: TCP流程结束，开启深睡眠模式，并保存flash。
  send:
  - AT+MLPMCFG="sleepmode",2,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MLPMENTER\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MLPMENTER（final={final}）
    abort: true

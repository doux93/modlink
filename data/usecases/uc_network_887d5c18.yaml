    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s6
  title: AT+CGDCONT=1,"Ethernet","APN1","",0,0,0,0,1,1
  send:
  - AT+CGDCONT=1,"Ethernet","APN1","",0,0,0,0,1,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s7
  title: AT+CGDCONT=2,"Ethernet","APN2","",0,0,0,0,1,1
  send:
  - AT+CGDCONT=2,"Ethernet","APN2","",0,0,0,0,1,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s8
  title: AT+MDIALUPCFG="workmode",1
  send:
  - AT+MDIALUPCFG="workmode",1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s9
  title: AT+MDIALUP=1,1
  send:
  - AT+MDIALUP=1,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MDIALUP\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MDIALUP（final={final}）
    abort: true
- id: s10
  title: AT+MDIALUP=2,1
  send:
  - AT+MDIALUP=2,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MDIALUP\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MDIALUP（final={final}）
    abort: true

schema: modulink/diagflow@1
id: uc_network_887d5c18
name: 5G LAN技术应用 · 5G LAN多路拨号
kind: usecase
category: network
source: MR880A 通信流程示例
verified: false
applies_to:
- mr880a
steps:
- id: s1
  title: AT+MDIALUPCFG="nicmaxcnt",2
  send:
  - AT+MDIALUPCFG="nicmaxcnt",2
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: at+mpsrat="NR"
  send:
  - at+mpsrat="NR"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: Windows系统下设置RNDIS拨号模式
  send:
  - AT+MDIALUPCFG="mode",0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s4
  title: Linux系统下设置ECM拨号模式
  send:
  - AT+MDIALUPCFG="mode",1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s5

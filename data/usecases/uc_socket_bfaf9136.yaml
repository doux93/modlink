schema: modulink/diagflow@1
id: uc_socket_bfaf9136
name: UDP/TCP休眠策略 · UDP休眠策略
kind: usecase
category: socket
source: MN326 通信流程示例
verified: false
applies_to:
- mn326
steps:
- id: s1
  title: 建立UDP连接。
  send:
  - AT+ZOPEN=1,39.106.55.121,2017
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+ZOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +ZOPEN（final={final}）
    abort: true
- id: s2
  title: 发送数据。
  send:
  - AT+ZSEND=0,6,"ascv12",5
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+ZSEND\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +ZSEND（final={final}）
    abort: true

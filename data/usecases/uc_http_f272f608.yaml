schema: modulink/diagflow@1
id: uc_http_f272f608
name: HTTP 服务器GET数据
kind: usecase
category: http
source: HTTP/HTTPS用户手册
verified: false
applies_to: []
steps:
- id: s1
  title: iot.10086.cn/"
  send:
  - 'AT+HTTPCREATE="http:'
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+HTTPCREATE\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +HTTPCREATE（final={final}）
    abort: true
- id: s2
  title: 'AT+HTTPHEADER=0,"User-Agent: Unkown\r\nConnection:'
  send:
  - 'AT+HTTPHEADER=0,"User-Agent: Unkown\r\nConnection: close\r\n"'
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: AT+HTTPSEND=0,0,"/page/index/name/culture"
  send:
  - AT+HTTPSEND=0,0,"/page/index/name/culture"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+HTTPNMIH\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +HTTPNMIH（final={final}）
    abort: true
- id: s4
  title: 'AT+HTTPHEADER=0,"User-Agent: Unkown\r\nConnection:'
  send:
  - 'AT+HTTPHEADER=0,"User-Agent: Unkown\r\nConnection: close\r\n"'
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s5
  title: 访问另一资源
  send:
  - AT+HTTPSEND=0,0,"/Public/Home/assets/image/chiMod_icon1.png"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+HTTPNMIH\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +HTTPNMIH（final={final}）
    abort: true
- id: s6
  title: 访问不存在的资源
  send:
  - AT+HTTPSEND=0,0,"/Public/Home/assets/image/chiMod_icon11.png"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+HTTPERR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +HTTPERR（final={final}）
    abort: true
- id: s7
  title: 使用完毕关闭HTTP实例，释放相关资源。
  send:
  - AT+HTTPCLOSE=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

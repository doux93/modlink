schema: modulink/diagflow@1
id: uc_socket_5d3bf58e
name: IPv6数据业务 · IPv6 UDP和TCP业务
kind: usecase
category: socket
source: MN316A 通信流程示例
verified: false
applies_to:
- mn316a
steps:
- id: s1
  title: 创建UDP Socket为IPv6类型
  send:
  - AT+NSOCR=DGRAM,17,100,1,AF_INET6
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 创建TCP Socket为IPv6类型
  send:
  - AT+NSOCR="STREAM",6,6003,1,AF_INET6
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

schema: modulink/diagflow@1
id: uc_network_5047301d
name: 网络配置
kind: usecase
category: network
source: MR880A 通信流程示例
verified: false
applies_to:
- mr880a
steps:
- id: s1
  title: AT+CGACT?
  send:
  - AT+CGACT?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGACT\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGACT（final={final}）
    abort: true
- id: s2
  title: 配置PDP上下文
  send:
  - AT+CGDCONT=7,"IPV4V6","cmnet"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 激活PDP，建立应用层拨号连接。
  send:
  - AT+MIPCALL=1,7
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPCALL\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPCALL（final={final}）
    abort: true
- id: s4
  title: 断开连接，需要断开网络时执行。
  send:
  - AT+MIPCALL=0,7
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPCALL\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPCALL（final={final}）
    abort: true

steps:
- id: s1
  title: AT+MPING="2A02:C207:3005:9207::6"
  send:
  - AT+MPING="2A02:C207:3005:9207::6"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MPING\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MPING（final={final}）
    abort: true
- id: s2

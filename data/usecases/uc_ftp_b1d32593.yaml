schema: modulink/diagflow@1
id: uc_ftp_b1d32593
name: FTP示例 · 获取/切换当前工作路径，新建目录，对目录或文件重命名/列出指定信息/删除
kind: usecase
category: ftp
source: FTP用户手册
verified: false
applies_to: []
steps:
- id: s1
  title: 连接并登录FTP服务器
  send:
  - AT+MFTPCONN=0,"<FTP_SERVER_IP>","<FTP_USER>","<FTP_PASSWORD>",21
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MFTPCONN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MFTPCONN（final={final}）
    abort: true
- id: s2
  title: 获取当前工作路径
  send:
  - AT+MFTPPWD=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 切换当前工作路径
  send:
  - AT+MFTPCWD=0,"/home/<FTP_USER>/test"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MFTPCWD\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MFTPCWD（final={final}）
    abort: true

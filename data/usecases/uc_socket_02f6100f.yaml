schema: modulink/diagflow@1
id: uc_socket_02f6100f
name: UDP/TCP数据接收 · TCP数据接收
kind: usecase
category: socket
source: M5310-E 通信流程示例
verified: false
applies_to:
- m5310-e
steps:
- id: s1
  title: 删除0连接
  send:
  - AT+NSOCL=0,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: Socket 0 输入模式为HEX，输出模式为HEX（系统默认值）。
  send:
  - AT+NSOCFG=0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOCFG\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOCFG（final={final}）
    abort: true
- id: s3
  title: 配置为输入转义字符串模式，输出原始数据模式。
  send:
  - AT+NSOCFG=0,0,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s4
  title: 在字符串输入模式下上报数据，此时length字段被忽略。
  send:
  - AT+NSOST=0,47.93.217.230,2008,10,30313233343536373839,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOSTR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOSTR（final={final}）
    abort: true
- id: s5
  title: 以转义字符串模式上报数据，length参数可忽略。
  send:
  - AT+NSOST=0,47.93.217.230,2008,,"AbC\r\npfE",1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOSTR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOSTR（final={final}）
    abort: true
- id: s6
  title: 配置为输入普通字符串模式，输出原始数据模式。
  send:
  - AT+NSOCFG=0,0,2
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s7
  title: 以普通字符串模式上报数据，length参数可忽略。
  send:
  - AT+NSOST=0,47.93.217.230,2008,,"AbC\r\npfE",1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOSTR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOSTR（final={final}）
    abort: true
- id: s8
  title: 读取数据。
  send:
  - AT+NSORF=0,512
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSORF\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSORF（final={final}）
    abort: true

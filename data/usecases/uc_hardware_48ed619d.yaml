schema: modulink/diagflow@1
id: uc_hardware_48ed619d
name: LED灯
kind: usecase
category: hardware
source: MF308C 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 使能模组网络状态灯
  send:
  - AT+MLED=0,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 关闭模组网络状态灯
  send:
  - AT+MLED=0,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

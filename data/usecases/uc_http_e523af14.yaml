schema: modulink/diagflow@1
id: uc_http_e523af14
name: HTTP示例 · POST请求
kind: usecase
category: http
source: HTTP/HTTPS用户手册
verified: false
applies_to: []
steps:
- id: s1
  title: content设置，ML302S/ML307S的字符串参数内部不能包含引号，如果字符串参数内部一定要包含引号，需使用数据模式进行发送。
  send:
  - AT+MHTTPCONTENT=0,0,0,"{"id":"speed1"\r,"tags":["mobile"],"unit":"m/s"\r,"unit_symbol":"m/s"}"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: POST请求
  send:
  - AT+MHTTPREQUEST=0,2,0,"/post"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

schema: modulink/diagflow@1
id: uc_socket_5c9450c1
name: IPv6入网配置 · 修改默认PDP类型
kind: usecase
category: socket
source: MN316 通信流程示例
verified: false
applies_to:
- mn316
- mn316a
steps:
- id: s1
  title: 去附着
  send:
  - AT+CGATT=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 更改默认PDP类型为“IPV4V6”的双栈模式
  send:
  - AT+CGDCONT= 0,"IPV4V6"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 或更改默认PDP类型为“IPV6”的单栈模式
  send:
  - AT+CGDCONT=0,"IPV6"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s4
  title: 附着网络
  send:
  - AT+CGATT=1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

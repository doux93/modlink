schema: modulink/diagflow@1
id: uc_http_df69c6c3
name: HTTPS示例 · 创建实例和参数配置
kind: usecase
category: http
source: HTTP/HTTPS用户手册
verified: false
applies_to: []
steps:
- id: s1
  title: 120.27.12.119:10443"
  send:
  - 'AT+MHTTPCREATE="https:'
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MHTTPCREATE\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MHTTPCREATE（final={final}）
    abort: true
- id: s2
  title: AT+MHTTPCFG="ssl",0,1,1 /*HTTPS使能，并指定使用SSL 1。*/
  send:
  - AT+MHTTPCFG="ssl",0,1,1 /*HTTPS使能，并指定使用SSL 1。*/
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

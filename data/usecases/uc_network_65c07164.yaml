schema: modulink/diagflow@1
id: uc_network_65c07164
name: 网络配置 · eDRX模式配置与查询
kind: usecase
category: network
source: M5310-E 通信流程示例
verified: false
applies_to:
- m5310-e
steps:
- id: s1
  title: AT+NPTWEDRXS=1,5,"0001","0011"
  send:
  - AT+NPTWEDRXS=1,5,"0001","0011"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: AT+CEDRXRDP
  send:
  - AT+CEDRXRDP
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CEDRXRDP\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CEDRXRDP（final={final}）
    abort: true

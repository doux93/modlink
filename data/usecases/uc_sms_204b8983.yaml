schema: modulink/diagflow@1
id: uc_sms_204b8983
name: PDU短信收发
kind: usecase
category: sms
source: MN319-A 通信流程示例
verified: false
applies_to:
- mn316a
- mn319-a
steps:
- id: s1
  title: 设置短消息格式为PDU模式
  send:
  - AT+CMGF=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 发送短信
  send:
  - AT+CMGS=25
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CMGS\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CMGS（final={final}）
    abort: true

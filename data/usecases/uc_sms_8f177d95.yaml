schema: modulink/diagflow@1
id: uc_sms_8f177d95
name: PDU短信收发
kind: usecase
category: sms
source: ML551Z 通信流程示例
verified: false
applies_to:
- ml551z
steps:
- id: s1
  title: 配置PDU模式(默认)
  send:
  - AT+CMGF=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 设置发送PDU编码为bit7。（可根据实际设置为bit8/bit16）
  send:
  - AT+CSMP=49,255,0,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 发送PDU短信，PDU长度23字节，数据以ctrl-z（0x1A）结尾。
  send:
  - AT+CMGS=23
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CMGS\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CMGS（final={final}）
    abort: true

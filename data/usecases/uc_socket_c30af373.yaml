schema: modulink/diagflow@1
id: uc_socket_c30af373
name: UDP/TCP数据发送 · UDP数据发送
kind: usecase
category: socket
source: M5310-E 通信流程示例
verified: false
applies_to:
- m5310-e
steps:
- id: s1
  title: UDP建立连接，开启数据自动上报。
  send:
  - AT+NSOCR="DGRAM",17,12,2
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 普通发送。
  send:
  - AT+NSOST=0,120.27.12.119,2022,2,0123
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 带空口回传功能
  send:
  - AT+NSOST=0,120.27.12.119,2022,2,0123,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOSTR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOSTR（final={final}）
    abort: true
- id: s4
  title: 快速释放
  send:
  - AT+NSOSTF=0,120.27.12.119,2022,0x200,2,0102
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

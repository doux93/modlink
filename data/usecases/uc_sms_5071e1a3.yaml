schema: modulink/diagflow@1
id: uc_sms_5071e1a3
name: 短信功能配置 · 短信默认配置
kind: usecase
category: sms
source: MF308C 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 配置接收到短信时自动上报
  send:
  - AT+CNMI=2,1,2,0,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 配置编码格式为IRA
  send:
  - AT+CSCS="IRA"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 设置文本模式参数为：有效期为相对时间格式，并且编码类型为GSM 7bit。
  send:
  - AT+CSMP=17,255,0,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

schema: modulink/diagflow@1
id: uc_socket_5d39bcbd
name: IPv6数据业务 · IPv6 TCPIP业务
kind: usecase
category: socket
source: M5311-E 通信流程示例
verified: false
applies_to:
- m5311-e
steps:
- id: s1
  title: 建立UDP连接，IPv6类型。
  send:
  - AT+MIPOPEN=0,"UDP","4E00:1900:1400:0:9227:71EF:F0B1",2016"2408:400a:16a:9700:d3af:3f8b:7c2b:8b84",9000
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPOPEN（final={final}）
    abort: true
- id: s2
  title: 建立TCP连接，IPv6类型。
  send:
  - AT+MIPOPEN=1,"TCP","4E00:1900:1400:0:9227:71EF:F0B1",2016"2408:400a:16a:9700:d3af:3f8b:7c2b:8b84",9000
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPOPEN（final={final}）
    abort: true

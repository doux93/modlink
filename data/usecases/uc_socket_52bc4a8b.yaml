schema: modulink/diagflow@1
id: uc_socket_52bc4a8b
name: UDP/TCP休眠策略 · UDP休眠策略
kind: usecase
category: socket
source: MN316-S 通信流程示例
verified: false
applies_to:
- mn316-s
- mn316a
- mn319-a
- mn326a
steps:
- id: s1
  title: 建立UDP连接。
  send:
  - AT+MIPOPEN=0,"UDP","120.27.12.119",2016
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPOPEN（final={final}）
    abort: true
- id: s2
  title: 发送数据11 Bytes。
  send:
  - AT+MIPSEND=0,11,"12345678900"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPSEND\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPSEND（final={final}）
    abort: true

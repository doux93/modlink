schema: modulink/diagflow@1
id: uc_hardware_76a14311
name: 串口波特率
kind: usecase
category: hardware
source: MN316A 通信流程示例
verified: false
applies_to:
- mn316a
steps:
- id: s1
  title: 配置波特率为115200bps立即生效。
  send:
  - AT+NATSPEED=115200,0,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 配置波特率为115200bps并保存NV，立即生效。
  send:
  - AT+NATSPEED=115200,0,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

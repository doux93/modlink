schema: modulink/diagflow@1
id: uc_network_4de051e6
name: 自动拨号配置
kind: usecase
category: network
source: MF308C 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 查询当前配置
  send:
  - AT+MUECONFIG=" autoconn"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MUECONFIG\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MUECONFIG（final={final}）
    abort: true
- id: s2
  title: 配置开启自动拨号功能
  send:
  - AT+MUECONFIG=" autoconn",1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 软重启模组
  send:
  - AT+MREBOOT
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MDIALUP\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MDIALUP（final={final}）
    abort: true

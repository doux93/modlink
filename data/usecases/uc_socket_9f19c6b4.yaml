schema: modulink/diagflow@1
id: uc_socket_9f19c6b4
name: IPv6入网配置
kind: usecase
category: socket
source: MN319-A 通信流程示例
verified: false
applies_to:
- mn319-a
steps:
- id: s1
  title: 去附着
  send:
  - AT+CFUN=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 更改PDP类型为“IPV4V6”双栈模式
  send:
  - AT+CGDCONT=0,"IPV4V6",""
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: AT+CGDCONT?
  send:
  - AT+CGDCONT?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGDCONT\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGDCONT（final={final}）
    abort: true
- id: s4
  title: 更改PDP类型为“IPV6”单栈模式
  send:
  - AT+CGDCONT=0,"IPV6",""
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s5
  title: AT+CGDCONT?
  send:
  - AT+CGDCONT?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGDCONT\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGDCONT（final={final}）
    abort: true

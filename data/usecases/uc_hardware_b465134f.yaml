schema: modulink/diagflow@1
id: uc_hardware_b465134f
name: GPIO
kind: usecase
category: hardware
source: ML302A 通信流程示例
verified: false
applies_to:
- ml302a
- ml307a
- ml307b
- ml307c
- ml307g
- ml307h
- ml307n
- ml307r
- ml307x
- ml307y
steps:
- id: s1
  title: 查询GPIO0配置
  send:
  - AT+MGPIO=0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MGPIO\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MGPIO（final={final}）
    abort: true
- id: s2
  title: 设置GPIO0输出高电平
  send:
  - AT+MGPIO=0,2
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 读取GPIO0的电平值
  send:
  - AT+MGPIO=0,0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MGPIO\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MGPIO（final={final}）
    abort: true

schema: modulink/diagflow@1
id: uc_network_efcc99b0
name: 命令同步网络时间
kind: usecase
category: network
source: MN316 通信流程示例
verified: false
applies_to:
- mn316
- mn316a
steps:
- id: s1
  title: AT+CMNTP[=<server>[,<port>,[<update_rtc>,[<timeout
  send:
  - AT+CMNTP[=<server>[,<port>,[<update_rtc>,[<timeout>]]]]
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 向默认的NTP服务器（ntp1.aliyun.com）请求网络时间，且更新本地时钟。
  send:
  - AT+CMNTP
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 本地时间已同步更新到NTP网络时间。
  send:
  - AT+CCLK?
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s4
  title: 向ntp1.aliyun.com服务器请求网络时间，且不更新本地时钟。
  send:
  - AT+CMNTP="ntp1.aliyun.com",123,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s5
  title: 由于AT+CMNTP未同步本地时钟，因此AT+CCLK?与AT+CMNTP返回结果存在一定误差。
  send:
  - AT+CCLK?
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

schema: modulink/diagflow@1
id: uc_network_472de1b0
name: 5G 切片技术应用
kind: usecase
category: network
source: MR880A 通信流程示例
verified: false
applies_to:
- mr880a
steps:
- id: s1
  title: AT+MDIALUPCFG="nicmaxcnt",1
  send:
  - AT+MDIALUPCFG="nicmaxcnt",1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: at+mpsrat="NR"
  send:
  - at+mpsrat="NR"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: Windows系统下设置RNDIS拨号模式
  send:
  - AT+MDIALUPCFG="mode",0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s4
  title: Linux系统下设置ECM拨号模式
  send:
  - AT+MDIALUPCFG="mode",1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s5
  title: Linux系统下设置NCM拨号模式
  send:
  - AT+MDIALUPCFG="mode",2
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s6
  title: AT+CGDCONT=1,"IP","APN","",,,0,0,0,0,0,,,,,,0,"all
  send:
  - AT+CGDCONT=1,"IP","APN","",,,0,0,0,0,0,,,,,,0,"allowed-s-nssai",0,,0,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s7
  title: AT+MDIALUP=1,1
  send:
  - AT+MDIALUP=1,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MDIALUP\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MDIALUP（final={final}）
    abort: true
- id: s8
  title: AT+CGPADDR=1
  send:
  - AT+CGPADDR=1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGPADDR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGPADDR（final={final}）
    abort: true

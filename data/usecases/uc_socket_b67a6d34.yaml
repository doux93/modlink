schema: modulink/diagflow@1
id: uc_socket_b67a6d34
name: UDP/TCP数据接收 · UDP包缓存模式
kind: usecase
category: socket
source: MN326 通信流程示例
verified: false
applies_to:
- mn326
steps:
- id: s1
  title: 配置下行数据缓存。
  send:
  - AT+ZNMI=1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 建立UDP连接。
  send:
  - AT+ZOPEN=1,39.106.55.121,2017
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+ZOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +ZOPEN（final={final}）
    abort: true
- id: s3
  title: 发送数据。
  send:
  - AT+ZSEND=0,6,"ascv12",5
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+ZSEND\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +ZSEND（final={final}）
    abort: true
- id: s4
  title: 读取缓存6Bytes数据。
  send:
  - AT+ZREAD=0,6
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+ZRECV\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +ZRECV（final={final}）
    abort: true
- id: s5
  title: 关闭连接。
  send:
  - AT+ZCLOSE=0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+ZSTATE\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +ZSTATE（final={final}）
    abort: true

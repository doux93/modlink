schema: modulink/diagflow@1
id: uc_http_4abd55c1
name: HTTP示例
kind: usecase
category: http
source: HTTP/HTTPS用户手册
verified: false
applies_to: []
steps:
- id: s1
  title: GET请求
  send:
  - AT+MHTTPREQUEST=0,1,0,"/get" /*GET请求*/
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MHTTPURC\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MHTTPURC（final={final}）
    abort: true
- id: s2
  title: 删除实例
  send:
  - AT+MHTTPDEL=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

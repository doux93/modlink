schema: modulink/diagflow@1
id: uc_socket_d890b839
name: IPv6入网配置 · 修改默认PDP类型
kind: usecase
category: socket
source: 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 去附着
  send:
  - AT+CFUN=0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 更改默认PDP类型为“IPV4V6”双栈模式
  send:
  - AT+MUECONFIG="defapn","IPV4V6",""
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: AT+MREBOOT
  send:
  - AT+MREBOOT
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s4
  title: AT+MUECONFIG="defapn"
  send:
  - AT+MUECONFIG="defapn"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MUECONFIG\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MUECONFIG（final={final}）
    abort: true
- id: s5

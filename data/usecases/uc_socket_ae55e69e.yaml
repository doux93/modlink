schema: modulink/diagflow@1
id: uc_socket_ae55e69e
name: UDP/TCP休眠策略 · UDP休眠策略
kind: usecase
category: socket
source: MN316A 通信流程示例
verified: false
applies_to:
- mn316a
steps:
- id: s1
  title: 创建本地UDP监听端口
  send:
  - AT+NSOCR="DGRAM",17,2334,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOCR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOCR（final={final}）
    abort: true
- id: s2
  title: 发送数据
  send:
  - AT+NSOST=0,114.116.144.151,2008,10,30313233343536373839
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOST\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOST（final={final}）
    abort: true

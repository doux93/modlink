schema: modulink/diagflow@1
id: uc_network_c16221ec
name: 数据透传模式
kind: usecase
category: network
source: 通信流程示例
verified: false
applies_to:
- mr880a
steps:
- id: s1
  title: 以透传模式建立一路TCP连接
  send:
  - AT+MIPOPEN=0,"TCP","www.6gforce.com",2012,,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 以普通模式建立一路TCP连接
  send:
  - AT+MIPOPEN=0,"TCP","www.6gforce.com",2012,,0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPOPEN（final={final}）
    abort: true
- id: s3
  title: connect_id为0的连接模式修改为透传模式
  send:
  - AT+MIPMODE=0,1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

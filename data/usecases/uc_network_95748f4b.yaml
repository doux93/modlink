schema: modulink/diagflow@1
id: uc_network_95748f4b
name: 驻网流程
kind: usecase
category: network
source: MF308C 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 查询SIM卡初始化状态
  send:
  - AT+CPIN?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CPIN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CPIN（final={final}）
    abort: true

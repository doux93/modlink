schema: modulink/diagflow@1
id: uc_socket_2a69456a
name: UDP/TCP数据接收 · TCP流缓存模式
kind: usecase
category: socket
source: MR880A 通信流程示例
verified: false
applies_to:
- mr880a
steps:
- id: s1
  title: 1#建立TCP连接，流缓存接收模式。
  send:
  - AT+MIPOPEN=1,"TCP","120.27.12.119",2016,60,2
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPOPEN\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPOPEN（final={final}）
    abort: true
- id: s2
  title: 1#发送数据11Bytes。
  send:
  - AT+MIPSEND=1,11,"12345678900"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MIPSEND\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MIPSEND（final={final}）
    abort: true
- id: s3

schema: modulink/diagflow@1
id: uc_sms_ff6c59f7
name: 文本短信收发
kind: usecase
category: sms
source: MF308C 通信流程示例
verified: false
applies_to: []
steps:
- id: s1
  title: 配置文本模式
  send:
  - AT+CMGF=1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 向号码13888888888发送短信
  send:
  - AT+CMGS="+8613888888888"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CMGS\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CMGS（final={final}）
    abort: true
- id: s3
  title: 向10086发送短信
  send:
  - AT+CMGS="10086"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CMGS\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CMGS（final={final}）
    abort: true
- id: s4
  title: 列举未读短信
  send:
  - AT+CMGL="REC UNREAD"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s5
  title: 再次列举，无未读短信。
  send:
  - AT+CMGL="REC UNREAD"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s6
  title: 读取编号为40的短信
  send:
  - AT+CMGR=40
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

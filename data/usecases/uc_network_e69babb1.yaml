steps:
- id: s1
  title: AT+C5GREG?
  send:
  - AT+C5GREG?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+C5GREG\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +C5GREG（final={final}）
    abort: true

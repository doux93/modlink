schema: modulink/diagflow@1
id: uc_socket_4519407d
name: IPv6入网配置 · 确认IPV6入网
kind: usecase
category: socket
source: M5310-E 通信流程示例
verified: false
applies_to:
- m5310-e
steps:
- id: s1
  title: AT+CGPADDR
  send:
  - AT+CGPADDR
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGPADDR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGPADDR（final={final}）
    abort: true
- id: s2
  title: AT+CGPADDR

schema: modulink/diagflow@1
id: uc_hardware_440eb92d
name: GPIO
kind: usecase
category: hardware
source: ML305U 通信流程示例
verified: false
applies_to:
- ml305u
steps:
- id: s1
  title: 查询Pin 5当前GPIO配置
  send:
  - AT+MGPIO=5
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MGPIO\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MGPIO（final={final}）
    abort: true
- id: s2
  title: 设置Pin 5为输出高电平
  send:
  - AT+MGPIO=5,2
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: 读取Pin 5的电平值
  send:
  - AT+MGPIO=5,0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+MGPIO\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +MGPIO（final={final}）
    abort: true

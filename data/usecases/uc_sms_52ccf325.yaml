schema: modulink/diagflow@1
id: uc_sms_52ccf325
name: 文本短信收发
kind: usecase
category: sms
source: ML307B 通信流程示例
verified: false
applies_to:
- ml307b
steps:
- id: s1
  title: 配置文本模式
  send:
  - AT+CMGF=1
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s2
  title: 7bit编码noclass短信
  send:
  - AT+CSMP?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CSMP\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CSMP（final={final}）
    abort: true
- id: s3
  title: 短信上报方式
  send:
  - AT+CNMI?
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CNMI\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CNMI（final={final}）
    abort: true
- id: s4
  title: AT+CMGS="10086"
  send:
  - AT+CMGS="10086"
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CMGS\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CMGS（final={final}）
    abort: true
- id: s5
  title: 以+CMT上报接收短信
  send:
  - AT+CNMI=2,2,0,0,0
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s6
  title: 列举未读短信
  send:
  - AT+CMGL="REC UNREAD"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s7
  title: 再次列举，无未读短信
  send:
  - AT+CMGL="REC UNREAD"
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s8
  title: 读取编号为5的短信
  send:
  - AT+CMGR=5
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s9
  title: 读取编号为7的短信
  send:
  - AT+CMGR=7
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

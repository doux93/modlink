schema: modulink/diagflow@1
id: uc_network_042af144
name: 清除存储频点
kind: usecase
category: network
source: MN316 通信流程示例
verified: false
applies_to:
- mn316
- mn316a
steps:
- id: s1
  title: AT+CFUN=0
  send:
  - AT+CFUN=0
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+CGEV\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +CGEV（final={final}）
    abort: true
- id: s2
  title: AT+NCSEARFCN
  send:
  - AT+NCSEARFCN
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true
- id: s3
  title: AT+NRB
  send:
  - AT+NRB
  timeout_ms: 8000
  evaluate:
  - when: final == 'OK'
    result: pass
  - default: true
    result: fail
    reason: 返回 {final}
    abort: true

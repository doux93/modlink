schema: modulink/diagflow@1
id: uc_socket_a1fe228f
name: UDP/TCP数据发送 · UDP数据发送
kind: usecase
category: socket
source: MN316 通信流程示例
verified: false
applies_to:
- mn316
- mn316a
steps:
- id: s1
  title: 创建本地UDP监听端口，开启数据到达自动上报。
  send:
  - AT+NSOCR="DGRAM",17,2334,1
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOCR\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOCR（final={final}）
    abort: true
- id: s2
  title: 向114.116.144.151,2008发送10个UDP数据。
  send:
  - AT+NSOST=0,114.116.144.151,2008,10,30313
  timeout_ms: 8000
  expect_urc:
    pattern: ^\+NSOST\b
    timeout_ms: 15000
  evaluate:
  - when: final == 'OK' && urc == 1
    result: pass
  - default: true
    result: fail
    reason: 未收到预期上报 +NSOST（final={final}）
    abort: true

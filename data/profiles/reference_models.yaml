# 由离线手册索引确认存在、但尚未完成实机命令集验证的型号画像。
# defaults 会在加载时合并到每个 profiles 条目；单型号字段覆盖默认值。
schema: modulink/profile-catalog@1
detect:
  command: "AT+CGMM"
  priority: 20
  allow_hyphen_suffix: true
defaults:
  schema: modulink/profile@1
  vendor: "中移物联"
  family: cellular
  capabilities: [cellular]
  support_level: reference
  ports:
    - role: at
      default_baud: 115200
  line_ending: "\r\n"
  urc_patterns:
    - id: cereg_urc
      pattern: '^\+CEREG: (?<stat>\d+)(,.*)?$'
      label: "网络注册"
      severity_field: stat
      severity_map: { "0": error, "1": info, "2": warning, "3": error, "5": info }
    - id: cpin_urc
      pattern: '^\+CPIN: (?<state>.+)$'
      label: "SIM 状态"
      severity: info
  at_commands:
    - cmd: "AT+CSQ"
      syntax: "AT+CSQ"
      category: network
      risk: none
      doc: "查询信号质量。rssi 0-31，99 表示无信号。"
    - cmd: "AT+CPIN"
      syntax: "AT+CPIN?"
      category: sim
      risk: none
      doc: "查询 SIM 状态。"
    - cmd: "AT+CEREG"
      syntax: "AT+CEREG? / AT+CEREG=<n>"
      category: network
      risk: none
      doc: "查询网络注册状态或设置状态变化上报。"
    - cmd: "AT+COPS"
      syntax: "AT+COPS? / AT+COPS=?"
      category: network
      risk: none
      doc: "查询当前运营商或扫描可用网络。"
    - cmd: "AT+CGDCONT"
      syntax: 'AT+CGDCONT=<cid>,"IP","<APN>"'
      category: pdp
      risk: none
      doc: "定义 PDP 上下文。"
    - cmd: "AT+CGACT"
      syntax: "AT+CGACT=<state>,<cid>"
      category: pdp
      risk: none
      doc: "激活或去激活 PDP 上下文。"
    - cmd: "AT+CGPADDR"
      syntax: "AT+CGPADDR=<cid>"
      category: pdp
      risk: none
      doc: "查询 PDP 分配的 IP 地址。"
    - cmd: "AT+CEER"
      syntax: "AT+CEER"
      category: debug
      risk: none
      doc: "查询最近一次错误的扩展原因。"
  diagnostics: [network_attach]
  error_code_tables: [cme_standard, cms_standard]
  intents:
    - phrases: ["查信号", "信号强度"]
      sequence: ["AT+CSQ"]
    - phrases: ["查卡", "SIM卡状态"]
      sequence: ["AT+CPIN?"]
    - phrases: ["注册状态", "入网了吗"]
      sequence: ["AT+CEREG?", "AT+COPS?"]


schema: modulink/profile@1
id: ml302
name: "ML302 (LTE Cat1)"
vendor: "中移物联"
family: cat1
model_codes: [ML302]
series: ML302
capabilities: [cellular, lte-cat1, mqtt]
support_level: verified
detect:
  command: "AT+CGMM"
  match: '(?:^|[^A-Z0-9-])ML302(?:-[A-Z0-9]+)*(?:[^A-Z0-9-]|$)'
  priority: 20
ports:
  - role: at
    default_baud: 115200
line_ending: "\r\n"
urc_patterns:
  - id: cereg_urc
    pattern: '^\+CEREG: (?<stat>\d+)(,.*)?$'
    label: "网络注册"
    severity_field: stat
    severity_map: { "0": error, "1": info, "2": warning, "3": error, "5": info }
  - id: mip_urc
    pattern: '^\+MIPURC: "(?<evt>\w+)",.*$'
    label: "Socket 事件"
    severity: warning
  - id: mqtt_urc
    pattern: '^\+MQTT(SUB|PUB|CONN|DISC).*$'
    label: "MQTT"
    severity: info
at_commands:
  - cmd: "AT+CSQ"
    syntax: "AT+CSQ"
    category: network
    risk: none
    doc: "查询信号质量，rssi 0-31，99=无信号，dBm = rssi*2-113。"
  - cmd: "AT+CEREG"
    syntax: "AT+CEREG? / AT+CEREG=<n>"
    category: network
    risk: none
    doc: "EPS 注册状态。1=已注册 2=搜网中 3=被拒绝 5=漫游注册。"
  - cmd: "AT+MQTTCONN"
    syntax: 'AT+MQTTCONN=<id>,"<host>",<port>,"<clientid>","<user>","<passwd>"'
    category: mqtt
    risk: none
    doc: "连接 MQTT 服务器。OneNET 场景 passwd 为 token（version/res/et/method/sign 拼接）。"
  - cmd: "AT+MQTTSUB"
    syntax: 'AT+MQTTSUB=<id>,"<topic>",<qos>'
    category: mqtt
    risk: none
    doc: "订阅主题。"
  - cmd: "AT+MQTTPUB"
    syntax: 'AT+MQTTPUB=<id>,"<topic>",<len>'
    category: mqtt
    risk: none
    doc: "发布消息，随后按提示输入负载。"
  - cmd: "AT+CFUN"
    syntax: "AT+CFUN=<fun>[,<rst>]"
    category: system
    risk: reboot
    doc: "功能模式设置，AT+CFUN=1,1 重启模组——高危。"
diagnostics: [network_attach]
error_code_tables: [cme_standard, cms_standard]
intents:
  - phrases: ["查信号", "信号强度"]
    sequence: ["AT+CSQ"]
  - phrases: ["注册状态", "入网了吗"]
    sequence: ["AT+CEREG?", "AT+COPS?"]
